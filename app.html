/* projeção mês a mês: realizado + agendado + média do que não é fixo */
function cashMonths(back = 5, fwd = 3) {
  const tk = todayKey(), t = todayISO(), recs = X().receitas, ns = cashNotes(), tpl = X().recorrentes.filter(r => r.ativo);
  const recFornecedores = new Set(tpl.filter(r => r.tipo === 'despesa').map(r => norm(r.nome)));
  const isFixedNote = n => n.recId || recFornecedores.has(norm(n.fornecedor));
  const mOf = d => (d || '').slice(0, 7);
  const ent = k => recs.filter(e => mOf(e.status === 'recebido' ? e.recebidoEm || e.data : e.data) === k);
  const sai = k => ns.filter(n => mOf(cashDateNote(n)) === k);
  const last3 = [1, 2, 3].map(i => shiftMonth(tk, -i));
  const avgVarSai = last3.reduce((a, k) => a + sum(sai(k).filter(n => !isFixedNote(n))), 0) / 3;
  const avgVarEnt = last3.reduce((a, k) => a + ent(k).filter(e => !e.recId).reduce((s, e) => s + e.valor, 0), 0) / 3;
  const out = [];
  for (let i = -back; i <= fwd; i++) {
    const k = shiftMonth(tk, i);
    if (i < 0) { out.push({ k, ent: ent(k).reduce((a, e) => a + e.valor, 0), sai: sum(sai(k)), proj: false }); continue; }
    if (i === 0) { out.push({ k, ent: ent(k).reduce((a, e) => a + e.valor, 0), sai: sum(sai(k)), proj: false, cur: true }); continue; }
    // meses futuros
    const sched = ent(k).reduce((a, e) => a + e.valor, 0);
    const tplR = tpl.filter(r => r.tipo === 'receita' && (!r.ultimo || r.ultimo < k)).reduce((a, r) => a + r.valor, 0);
    const schedVarEnt = ent(k).filter(e => !e.recId).reduce((a, e) => a + e.valor, 0);
    const e = sched + tplR + Math.max(0, avgVarEnt - schedVarEnt);
    const sAg = sum(sai(k)), tplD = tpl.filter(r => r.tipo === 'despesa' && (!r.ultimo || r.ultimo < k)).reduce((a, r) => a + r.valor, 0);
    const schedVarSai = sum(sai(k).filter(n => !isFixedNote(n)));
    out.push({ k, ent: e, sai: sAg + tplD + Math.max(0, avgVarSai - schedVarSai), proj: true, fixed: tplD, agend: sAg });
  }
  // saldo ao fim de cada mês
  let saldo = saldoHoje();
  const cur = out.find(o => o.cur);
  const restoEnt = recs.filter(e => e.status !== 'recebido' && mOf(e.data) === tk).reduce((a, e) => a + e.valor, 0) + recs.filter(e => e.status !== 'recebido' && e.data < `${tk}-01`).reduce((a, e) => a + e.valor, 0);
  const restoSai = sum(ns.filter(n => n.status === 'a_pagar' && cashDateNote(n) <= `${tk}-31`));
  cur.fimSaldo = saldo + restoEnt - restoSai; cur.saldoHoje = saldo;
  let s = cur.fimSaldo;
  out.filter(o => o.proj).forEach(o => { s += o.ent - o.sai; o.fimSaldo = s; });
  // passado: anda para trás a partir do saldo de hoje
  let sp = saldo - (recs.filter(e => e.status === 'recebido' && mOf(e.recebidoEm || e.data) === tk && (e.recebidoEm || e.data) <= t).reduce((a, e) => a + e.valor, 0) - sum(ns.filter(n => n.status === 'pago' && mOf(cashDateNote(n)) === tk && cashDateNote(n) <= t)));
  for (let i = out.indexOf(cur) - 1; i >= 0; i--) { out[i].fimSaldo = sp; sp -= out[i].ent - out[i].sai; }
  return out;
}

function cashSourcesHTML() {

/* =========================================================
   LEITORES DE CÓDIGO: boleto, conta de consumo e Pix copia e cola

const BANCOS = { '001': 'Banco do Brasil', '004': 'Banco do Nordeste', '033': 'Santander', '041': 'Banrisul', '070': 'BRB', '077': 'Inter', '104': 'Caixa', '208': 'BTG Pactual', '212': 'Banco Original', '237': 'Bradesco', '260': 'Nubank', '290': 'PagBank', '323': 'Mercado Pago', '336': 'C6 Bank', '341': 'Itaú', '380': 'PicPay', '422': 'Safra', '748': 'Sicredi', '756': 'Sicoob' };

function mod10(num) { let s = 0, w = 2; for (let i = num.length - 1; i >= 0; i--) { const p = +num[i] * w; s += p > 9 ? Math.floor(p / 10) + p % 10 : p; w = w === 2 ? 1 : 2; } const r = s % 10; return r ? 10 - r : 0; }

function fatorData(f) {
  const n = +f; if (!n) return '';
  const a = addDays('1997-10-07', n), b = addDays('2025-02-22', n - 1000), t = todayISO();
  return Math.abs(daysBetween(t, a)) <= Math.abs(daysBetween(t, b)) ? a : b;
}
const fmtLinha = d => d.length === 47 ? `${d.slice(0, 5)}.${d.slice(5, 10)} ${d.slice(10, 15)}.${d.slice(15, 21)} ${d.slice(21, 26)}.${d.slice(26, 32)} ${d[32]} ${d.slice(33)}` : d.length === 48 ? d.match(/.{12}/g).map(b => b.slice(0, 11) + '-' + b[11]).join(' ') : d;

  const s = String(raw || '').trim();

  const d = digits(s);
  if (d.length === 47) { // linha digitável de boleto bancário
    const ok = mod10(d.slice(0, 9)) === +d[9] && mod10(d.slice(10, 20)) === +d[20] && mod10(d.slice(21, 31)) === +d[31];
    const bc = d.slice(0, 4) + d[32] + d.slice(33, 47) + d.slice(4, 9) + d.slice(10, 20) + d.slice(21, 31);
    const ok2 = mod11Bol(bc.slice(0, 4) + bc.slice(5)) === +bc[4];
    const banco = d.slice(0, 3);
    return { tipo: 'boleto', linha: fmtLinha(d), valor: +d.slice(37) / 100, venc: fatorData(d.slice(33, 37)), banco, bancoNome: BANCOS[banco] || 'Banco ' + banco, valido: ok && ok2 };
  }
  if (d.length === 44 && d[0] !== '8') { // código de barras de boleto
    const ok = mod11Bol(d.slice(0, 4) + d.slice(5)) === +d[4]; const banco = d.slice(0, 3);
    const l1 = d.slice(0, 4) + d.slice(19, 24), l2 = d.slice(24, 34), l3 = d.slice(34, 44);
    const linha = l1 + mod10(l1) + l2 + mod10(l2) + l3 + mod10(l3) + d[4] + d.slice(5, 19);
    return { tipo: 'boleto', linha: fmtLinha(linha), valor: +d.slice(9, 19) / 100, venc: fatorData(d.slice(5, 9)), banco, bancoNome: BANCOS[banco] || 'Banco ' + banco, valido: ok };
  }
  if ((d.length === 48 || d.length === 44) && d[0] === '8') { // conta de consumo / tributo
    const blocks = d.length === 48 ? d.match(/.{12}/g) : null;
    const bc = blocks ? blocks.map(b => b.slice(0, 11)).join('') : d;
    const useMod10 = bc[2] === '6' || bc[2] === '7';
    const ok = blocks ? blocks.every(b => (useMod10 ? mod10(b.slice(0, 11)) : mod11Arr(b.slice(0, 11))) === +b[11]) : true;
    const dt = bc.slice(19, 27), iso = `${dt.slice(0, 4)}-${dt.slice(4, 6)}-${dt.slice(6, 8)}`;
    const venc = validISO(iso) && Math.abs(daysBetween(todayISO(), iso)) < 400 ? iso : '';
    return { tipo: 'consumo', linha: fmtLinha(d.length === 48 ? d : bc), valor: +bc.slice(4, 15) / 100, venc, segmento: SEG_ARREC[bc[1]] || 'Conta de consumo', fornecedorSug: '', valido: ok };
  }
  return null;
}
function parseTLV(s) { const out = {}; let i = 0; while (i + 4 <= s.length) { const id = s.substr(i, 2), len = parseInt(s.substr(i + 2, 2), 10); if (isNaN(len)) break; out[id] = s.substr(i + 4, len); i += 4 + len; } return out; }

function parseXMLNota(text) {

  const g = (el, ...tags) => { for (const t of tags) { const x = q(el, t); if (x && x.textContent.trim()) return x.textContent.trim(); } return ''; };
  const inf = q(doc, 'infNFe');
  if (inf) {
    const ide = q(inf, 'ide'), emit = q(inf, 'emit'), dest = q(inf, 'dest'), tot = q(inf, 'ICMSTot');
    const dups = [...(inf.getElementsByTagNameNS('*', 'dup'))]; const prods = [...inf.getElementsByTagNameNS('*', 'xProd')].map(x => x.textContent.trim());
    return { tipo: 'NF-e', fornecedor: g(emit, 'xFant', 'xNome'), cnpj: fmtCNPJ(g(emit, 'CNPJ', 'CPF')), destCnpj: g(dest, 'CNPJ', 'CPF'), numero: g(ide, 'nNF'), dataEmissao: (g(ide, 'dhEmi', 'dEmi') || '').slice(0, 10), valor: +g(tot, 'vNF') || 0, vencimento: dups.length ? g(dups[0], 'dVenc') : '', descricao: prods.slice(0, 2).join(', ').slice(0, 120) + (prods.length > 2 ? ` e mais ${prods.length - 2}` : ''), chave: (inf.getAttribute('Id') || '').replace(/\D/g, '') };
  }
  const v = +(g(doc, 'ValorServicos', 'vServ', 'ValorLiquidoNfse', 'vLiq', 'vNF').replace(',', '.')) || 0;
  if (!v) return null;
  const prest = q(doc, 'PrestadorServico') || q(doc, 'Prestador') || q(doc, 'emit') || doc;
  return { tipo: 'NFS-e', fornecedor: g(prest, 'NomeFantasia', 'RazaoSocial', 'xFant', 'xNome'), cnpj: fmtCNPJ(g(prest, 'Cnpj', 'CNPJ', 'Cpf', 'CPF')), destCnpj: g(q(doc, 'Tomador') || q(doc, 'TomadorServico') || q(doc, 'toma'), 'Cnpj', 'CNPJ'), numero: g(doc, 'Numero', 'nNFSe', 'nDFSe'), dataEmissao: (g(doc, 'DataEmissao', 'dhEmi', 'dhProc', 'Competencia') || '').slice(0, 10), valor: v, vencimento: '', descricao: g(doc, 'Discriminacao', 'xDescServ').replace(/\s+/g, ' ').slice(0, 120), chave: '' };
}

function parseOFX(text) {
  const out = []; const blocks = text.split(/<STMTTRN>/i).slice(1);
  for (const b0 of blocks) {
    const b = b0.split(/<\/STMTTRN>/i)[0];
    const tag = t => { const r = new RegExp('<' + t + '>([^<\\r\\n]*)', 'i').exec(b); return r ? r[1].trim() : ''; };
    const dt = tag('DTPOSTED'), valor = parseFloat(tag('TRNAMT').replace(',', '.'));
    if (!dt || isNaN(valor)) continue;
    out.push({ id: tag('FITID') || uid('t'), data: `${dt.slice(0, 4)}-${dt.slice(4, 6)}-${dt.slice(6, 8)}`, valor, desc: tag('MEMO') || tag('NAME') || tag('TRNTYPE') });
  }
  return out;
}
function parseCSVExtrato(text) {

  const split = l => { const out = []; let cur = '', q = false; for (const ch of l) { if (ch === '"') q = !q; else if (ch === delim && !q) { out.push(cur); cur = ''; } else cur += ch; } out.push(cur); return out.map(s => s.trim()); };
  let hi = lines.findIndex(l => /data|date/i.test(l)); if (hi < 0) hi = 0;
  const h = split(lines[hi]).map(norm);
  const ci = re => h.findIndex(x => re.test(x));
  const cD = ci(/^data|date/), cDesc = ci(/hist|descr|lanc|memo|detal/), cV = ci(/^valor|amount|value|quantia/), cDeb = ci(/debito|saida/), cCred = ci(/credito|entrada/);
  const toISO = s => { s = s.trim(); let m = /^(\d{2})\/(\d{2})\/(\d{2,4})/.exec(s); if (m) return `${m[3].length === 2 ? '20' + m[3] : m[3]}-${m[2]}-${m[1]}`; m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s); return m ? m[0] : ''; };
  const out = [];
  for (const l of lines.slice(hi + 1)) {
    const c = split(l); const data = toISO(c[cD] || ''); if (!data) continue;
    let v = cV >= 0 ? parseBRL(c[cV]) : NaN;
    if (cV >= 0 && /^\s*-/.test(c[cV] || '')) v = -Math.abs(v);
    if (isNaN(v) && (cDeb >= 0 || cCred >= 0)) { const d = parseBRL(c[cDeb] || ''), cr = parseBRL(c[cCred] || ''); v = !isNaN(cr) && cr ? Math.abs(cr) : !isNaN(d) ? -Math.abs(d) : NaN; }
    if (isNaN(v) || !v) continue;
    out.push({ id: 'csv-' + data + '-' + out.length + '-' + Math.round(Math.abs(v) * 100), data, valor: v, desc: (c[cDesc] || '').replace(/\s+/g, ' ') });
  }
  return out;
}
function extratoExemplo() {

  txs.push({ id: 'exu1' + Date.now().toString(36), data: addDays(t, -3), valor: -89.9, desc: 'TARIFA PACOTE DE SERVICOS' });

function matchTx(tx, used) {

    return c ? { st: 'sug', note: c.n, dd: c.dd } : { st: 'none' };
  }
  const done = X().receitas.find(e => e.conciliado && e.conciliado.tx === tx.id); if (done) return { st: 'ok', rec: done };
  const c = X().receitas.filter(e => !used.has(e.id) && !e.conciliado && Math.abs(e.valor - abs) < .011).map(e => ({ e, dd: Math.abs(daysBetween(tx.data, e.recebidoEm || e.data)) })).filter(x => x.dd <= 6).sort((a, b) => a.dd - b.dd)[0];

function alertMessage() {
  const a = cfg().alertas, t = todayISO(), L = [];
  const ap = notes().filter(n => n.aprov === 'aprovada' && n.status === 'a_pagar' && n.vencimento);
  const lb = n => n.tipo === 'reembolso' ? 'Reembolso de ' + firstName(userName(n.reembolsoPara)) : n.fornecedor;
  if (a.vencida) { const v = ap.filter(n => n.vencimento < t); if (v.length) L.push(`⚠️ *${plural(v.length, 'conta vencida', 'contas vencidas')}*: ${v.slice(0, 3).map(n => `${lb(n)} (${brl(n.valor)})`).join(', ')}${v.length > 3 ? '…' : ''}`); }
  if (a.vencer) { const lim = addDays(t, +a.vencerDias || 0); const v = ap.filter(n => n.vencimento >= t && n.vencimento <= lim); if (v.length) L.push(`📅 *Vence${v.length > 1 ? 'm' : ''} ${+a.vencerDias ? 'até ' + dateBR(lim).slice(0, 5) : 'hoje'}*: ${v.map(n => `${lb(n)} ${brl(n.valor)}`).join(', ')}`); }
  if (a.aprovacao) { const p = pendentes(); if (p.length) L.push(`✅ *${plural(p.length, 'nota esperando', 'notas esperando')} aprovação* (${brl(sum(p))})`); }
  if (a.orcamento) { const tk = todayKey(); active('departamentos').forEach(d => { const g = sum(notes().filter(n => n.depId === d.id && n.mesRef === tk)); if (d.orcamento && g > d.orcamento) L.push(`🎯 *${d.nome}* passou do orçamento: ${brl(g)} de ${brl(d.orcamento)}`); }); }
  const head = `*Conexo · ${S.co.nome}*\nAvisos de ${dateBR(t)}`;
  return L.length ? `${head}\n\n${L.join('\n')}\n\nAbra o Conexo para resolver.` : `${head}\n\nTudo em dia por aqui. Nenhum aviso hoje. 🎉`;
}

async function exportContabil() {
  const mes = S.ct.mes, rows = contabilRows(mes); if (!rows.length) return toast('Nenhuma nota aprovada nesse mês.', 'err');
  const head = ['Data', 'Competência', 'Documento', 'Fornecedor', 'CNPJ/CPF', 'Histórico', 'Conta débito', 'Conta crédito', 'Centro de custo', 'Valor', 'Situação', 'Data pagamento', 'Vencimento', 'Chave de acesso'];
  const base = `contabilidade_${slug(S.co.nome)}_${mes}`;
  if (S.ct.fmt === 'csv') {
    const cell = v => { const s = String(v ?? ''); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const lines = [head.join(';')].concat(rows.map(r => [dateBR(r.data), r.comp.split('-').reverse().join('/'), r.doc, r.forn, r.cnpj, r.hist, r.deb, r.cred, r.cc, brlNum(r.valor).replace(/\./g, ''), r.sit, dateBR(r.pago), dateBR(r.venc), r.chave].map(cell).join(';')));
    await saveFile(base + '.csv', new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' }));
  } else {
    await loadScript(LIB.exceljs);
    const wb = new window.ExcelJS.Workbook(); const ws = wb.addWorksheet('Lançamentos', { views: [{ state: 'frozen', ySplit: 1 }] });
    ws.columns = head.map((h, i) => ({ header: h, key: 'c' + i, width: [11, 11, 11, 30, 19, 50, 13, 13, 26, 14, 10, 13, 12, 46][i] }));
    rows.forEach(r => ws.addRow([new Date(r.data + 'T12:00:00'), r.comp.split('-').reverse().join('/'), r.doc, r.forn, r.cnpj, r.hist, r.deb, r.cred, r.cc, r.valor, r.sit, r.pago ? new Date(r.pago + 'T12:00:00') : '', r.venc ? new Date(r.venc + 'T12:00:00') : '', r.chave]));
    ws.getRow(1).font = { bold: true, color: { argb: 'FFFFFFFF' } }; ws.getRow(1).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF0B0D12' } };
    ws.getColumn(1).numFmt = 'dd/mm/yyyy'; ws.getColumn(12).numFmt = 'dd/mm/yyyy'; ws.getColumn(13).numFmt = 'dd/mm/yyyy'; ws.getColumn(10).numFmt = '"R$" #,##0.00';
    ws.autoFilter = { from: 'A1', to: 'N1' };
    const tr = ws.addRow(['', '', '', '', '', 'Total', '', '', '', { formula: `SUM(J2:J${rows.length + 1})` }]); tr.font = { bold: true };
    const buf = await wb.xlsx.writeBuffer();
    await saveFile(base + '.xlsx', new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
  }
  toast(`${plural(rows.length, 'lançamento exportado', 'lançamentos exportados')} de ${monthName(mes)}`);
}

  if (x === 'al-save') { const a = cfg().alertas; a.whats.numero = $('#alW').value.trim(); a.email.endereco = $('#alE').value.trim(); saveCo(); renderOwnSec(); return toast('Contatos salvos'); }

function needsYou({ venc, week, pend, dep, months, list }) {
  const out = [];
  if (venc.length) out.push({ c: 'bad', i: 'alert', t: plural(venc.length, 'conta vencida', 'contas vencidas'), s: 'Pague logo para evitar juros e multa', v: brl(sum(venc)), go: 'pagar' });
  if (week.length) out.push({ c: 'warn', i: 'clock', t: `${plural(week.length, 'conta vence', 'contas vencem')} em 7 dias`, s: week.slice(0, 2).map(n => n.tipo === 'reembolso' ? 'Reembolso' : n.fornecedor).join(', ') + (week.length > 2 ? '…' : ''), v: brl(sum(week)), go: 'pagar' });
  if (pend.length && canSee('aprovacoes')) out.push({ c: 'blue', i: 'approve', t: `${plural(pend.length, 'nota espera', 'notas esperam')} aprovação`, s: isAdmin() ? 'Lançadas pela equipe' : 'Enviadas por você', v: brl(sum(pend)), go: 'aprovacoes' });
  const ib = (X().inbox || []).filter(i => i.status === 'novo');
  if (ib.length && canSee('entrada')) out.push({ c: 'blue', i: 'inbox', t: `${plural(ib.length, 'nota chegou', 'notas chegaram')} para conferir`, s: 'Pelo WhatsApp, e-mail ou Receita', v: 'conferir', go: 'entrada' });
  if (!dep) { const over = active('departamentos').filter(d => d.orcamento && sum(list.filter(n => n.depId === d.id)) > d.orcamento * months); if (over.length) out.push({ c: 'warn', i: 'target', t: `${plural(over.length, 'área passou', 'áreas passaram')} do orçamento`, s: over.map(d => d.nome).join(', '), v: 'ver', go: 'departamentos' }); }
  if (isAdmin()) { const rb = notes().filter(n => n.tipo === 'reembolso' && n.aprov === 'aprovada' && n.status === 'a_pagar'); if (rb.length) out.push({ c: '', i: 'refund', t: `${plural(rb.length, 'reembolso', 'reembolsos')} para devolver`, s: [...new Set(rb.map(n => firstName(userName(n.reembolsoPara))))].join(', '), v: brl(sum(rb)), go: 'reembolsos' }); }

/* ---------- IA (opcional) para reescrever os textos ---------- */
async function aiTexts(m, c) {
  const sample = await getSample(); if (!sample) return false;
  const prompt = `Você é a A.N.A.B, analista financeira do Conexo. Escreva textos curtos e profissionais, em português do Brasil, para uma apresentação "${c.titulo}" (${c.objetivo}) da empresa ${m.empresa}, período ${m.periodo}${m.depNome ? ', departamento ' + m.depNome : ''}.
Dados: gasto ${brl(m.total)}${m.pt ? `, período anterior ${brl(m.pt)}` : ''}; orçamento ${m.bud ? brl(m.bud) : 'não definido'}; contas em aberto ${brl(m.aberto)}, vencidas ${brl(m.venc)} (${m.nVenc}); categorias: ${m.cats.slice(0, 5).map(x => x.k + ' ' + kBRL(x.v)).join('; ')}; departamentos: ${m.deps.slice(0, 5).map(x => `${x.k} ${kBRL(x.v)}${x.o ? ' de ' + kBRL(x.o) : ''}`).join('; ')}; maiores fornecedores: ${m.forns.slice(0, 4).map(x => x.k + ' ' + kBRL(x.v)).join('; ')}; alertas: ${m.ins.map(x => x.t).join('; ')}.
${c.extra ? `Pedido adicional de quem está montando: """${c.extra.slice(0, 1500)}"""` : ''}
Responda só com JSON: {"resumo":["3 ou 4 frases de até 140 caracteres"],"recomendacoes":["3 sugestões de economia de até 120 caracteres"],"passos":["3 a 5 próximos passos de até 110 caracteres"],"adicionais":["se houver pedido adicional, 3 a 6 pontos de até 150 caracteres; senão lista vazia"]}`;
  try {
    const r = await Promise.race([sample.json(prompt, { modelTier: 'default' }), new Promise((_, rej) => setTimeout(() => rej(new Error('tempo')), 45000))]);
    const ok = a => Array.isArray(a) && a.length && a.every(s => typeof s === 'string');
    if (ok(r.resumo)) m.resumo = r.resumo.slice(0, 4); if (ok(r.recomendacoes)) m.recs = r.recomendacoes.slice(0, 4); if (ok(r.passos)) m.passos = r.passos.slice(0, 5); if (ok(r.adicionais)) m.adicionais = r.adicionais.slice(0, 7);
    m.ia = true; return true;
  } catch { return false; }
}

function present(svgs, start = 0) {
  let i = start; const el = document.createElement('div'); el.className = 'dk-present'; el.tabIndex = -1;

  document.body.appendChild(el);
  const draw = () => { $('#dkpS', el).innerHTML = svgs[i]; $('#dkpN', el).textContent = `${i + 1} / ${svgs.length}`; };
  const close = () => { removeEventListener('keydown', key, true); el.remove(); try { if (document.fullscreenElement) document.exitFullscreen(); } catch { } };
  const key = e => { if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); e.stopPropagation(); i = Math.min(svgs.length - 1, i + 1); draw(); } else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); e.stopPropagation(); i = Math.max(0, i - 1); draw(); } else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(); } };
  addEventListener('keydown', key, true);
  el.addEventListener('click', e => { const b = e.target.closest('[data-p]'); if (b) { if (b.dataset.p === 'x') return close(); i = Math.max(0, Math.min(svgs.length - 1, i + +b.dataset.p)); return draw(); } if (e.target.closest('.dkp-slide')) { i = Math.min(svgs.length - 1, i + 1); draw(); } });
  draw(); el.focus(); try { el.requestFullscreen && el.requestFullscreen().catch(() => { }); } catch { }
}
async function svgToPng(svg, w = 1920, h = 1080, type = 'image/png') {
  const url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const c = document.createElement('canvas'); c.width = w; c.height = h; const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
    return c.toDataURL(type, .92);
  } finally { URL.revokeObjectURL(url); }
}

  await saveFile(deckName(d) + '.pdf', pdf.output('blob'));
}
async function deckPPTX(d, svgs) {

function scanModal() {
  if (!canWrite()) return;
  const o = openModal(`<div class="sheet-head"><h3>${ic('camera')}Escanear</h3>${closeBtn}</div>
  <div class="sheet-body sc2">
    <p class="sc2-lead">Nota fiscal, boleto ou Pix. O Conexo lê e preenche tudo para você.</p>

      <label class="sc2-opt sc2-main"><span class="sc2-ic">${ic('camera')}</span><span><b>Tirar foto</b><small>Aponte a câmera para a nota ou o boleto</small></span><input type="file" accept="image/*" capture="environment" id="scCam" hidden></label>
      <label class="sc2-opt"><span class="sc2-ic">${ic('upload')}</span><span><b>Enviar arquivo</b><small>Foto, PDF ou XML da nota</small></span><input type="file" accept="image/*,application/pdf,.pdf,.xml,text/xml" id="scFile" hidden></label>
      <button type="button" class="sc2-opt" data-sc="code"><span class="sc2-ic">${ic('barcode')}</span><span><b>Colar código</b><small>Linha do boleto ou Pix copia e cola</small></span></button>
    </div>
    <div class="sc2-code" id="scCode" hidden>
      <label for="scIn">Cole aqui o código do boleto ou do Pix</label>
      <textarea id="scIn" class="in" rows="3" placeholder="Os números do boleto ou o Pix copia e cola"></textarea>
      <div class="sc2-code-acts"><button type="button" class="btn btn-primary" id="scRead">${ic('check')}Ler código</button><button type="button" class="link" data-sc="ex-bol">boleto de exemplo</button><button type="button" class="link" data-sc="ex-pix">Pix de exemplo</button></div>
      <div id="scRes"></div>
    </div>
    ${planHas('ia') ? '' : `<p class="sc2-note">${ic('info')}No plano ${esc(planNome())} o código do boleto e do Pix é lido sozinho. A leitura automática da foto da nota é do plano Pro.</p>`}
  </div>
  <div class="sheet-foot sc2-foot"><button type="button" class="link" data-sc="manual">Prefere digitar? Lançar sem escanear</button></div>`, { narrow: true, label: 'Escanear', cls: 'sc2-sheet' });
  let last = null;
  const read = () => {
    const v = $('#scIn', o).value, res = $('#scRes', o); last = null;
    if (!v.trim()) { res.innerHTML = ''; return; }
    const c = parseCodigo(v);
    if (!c) { res.innerHTML = `<div class="code-res bad">Não reconheci esse código. Copie a linha inteira do boleto (47 ou 48 números) ou o Pix copia e cola.</div>`; return; }
    last = c;
    res.innerHTML = `<div class="code-res${c.valido ? '' : ' warn'}">${codeSummaryHTML(c)}<button type="button" class="btn btn-primary" data-sc="go">${ic('check')}Lançar esta conta</button></div>`;
  };
  const onPick = async f => {
    if (!f) return;
    if (/\.xml$/i.test(f.name) || /xml/.test(f.type)) {
      const p = parseXMLNota(await f.text());
      if (!p || !p.valor) return toast('Não reconheci esse XML. Envie o arquivo da NF-e ou NFS-e.', 'err');
      closeModal(o);
      return openForm(null, { valor: p.valor, dataEmissao: p.dataEmissao, fornecedor: p.fornecedor, cnpj: p.cnpj, numero: p.numero, descricao: p.descricao || '', vencimento: p.vencimento, status: p.vencimento && p.vencimento >= todayISO() ? 'a_pagar' : 'pago', origem: 'xml' });
    }
    closeModal(o); openForm(); onFile(f);
  };
  ['scCam', 'scFile'].forEach(id => $('#' + id, o).addEventListener('change', e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; onPick(f); }));
  $('#scIn', o).addEventListener('input', debounce(read, 250));
  $('#scRead', o).addEventListener('click', read);
  o.addEventListener('click', e => {
    const b = e.target.closest('[data-sc]'); if (!b) return;
    const k = b.dataset.sc;
    if (k === 'code') { const c = $('#scCode', o); c.hidden = false; $('#scIn', o).focus(); b.setAttribute('aria-pressed', 'true'); }
    if (k === 'ex-bol') { $('#scIn', o).value = makeBoletoExemplo(1890.5, addDays(todayISO(), 9), '237'); read(); }
    if (k === 'ex-pix') { $('#scIn', o).value = makePixExemplo(640, 'MARCOS SILVA ELETRICA', 'SALVADOR', 'marcos.eletrica@exemplo.com'); read(); }
    if (k === 'go' && last) { closeModal(o); openForm(null, codePrefill(last)); }
    if (k === 'manual') { closeModal(o); openForm(); }
  });
}

function fornInfo(nome) { const x = X(); x.forn = x.forn || {}; const k = norm(nome); return x.forn[k] || (x.forn[k] = {}); }
function fornStats() {
  const tk = todayKey(), from = shiftMonth(tk, -11), last3 = [1, 2, 3].map(i => shiftMonth(tk, -i));
  const all = notes().filter(n => n.mesRef >= from && n.fornecedor);
  const m = new Map();
  all.forEach(n => { const k = norm(n.fornecedor); if (!m.has(k)) m.set(k, { k, nome: n.fornecedor, notes: [] }); m.get(k).notes.push(n); });
  return [...m.values()].map(g => {
    const ns = g.notes.slice().sort((a, b) => (a.dataEmissao || '').localeCompare(b.dataEmissao || ''));
    const last = ns[ns.length - 1], prev = ns.slice(0, -1);
    const avgPrev = prev.length >= 2 ? sum(prev) / prev.length : 0;
    const up = avgPrev && last.valor > avgPrev * 1.15 && last.valor - avgPrev > 50 ? Math.round((last.valor - avgPrev) / avgPrev * 100) : 0;
    const cat = groupDim(ns, 'categoria')[0], dep = groupDim(ns, 'departamento')[0];
    const info = fornInfo(g.nome);
    return { ...g, notes: ns, last, total: sum(ns), mes: sum(ns.filter(n => n.mesRef === tk)), media: sum(ns.filter(n => last3.includes(n.mesRef))) / 3, up, cat, dep, cnpj: (ns.find(n => digits(n.cnpj)) || {}).cnpj || '', info };
  }).sort((a, b) => b.total - a.total);
}

    if (k === 'more') { const c = cfgNow(); closeModal(o); return deckForm(c); }
    if (k === 'go') {

      const p = planSlides(cf), model = buildModel(cf);

  });
  draw();
}

  if (ds.memberRm) { const m = DB.user(ds.memberRm); if (!m) return; return confirmModal({ title: 'Remover da equipe?', text: `<b>${esc(m.nome)}</b> perde o acesso ao Conexo. As notas que essa pessoa lançou continuam no sistema.`, okLabel: 'Remover acesso', onOk: () => { DB.d.users = DB.d.users.filter(u => u.id !== m.id); DB.save(); refreshAll(); toast(`${esc(firstName(m.nome))} foi removido da equipe`); } }); }
  if (ds.restore) return restoreNote(ds.restore);
  if (ds.purge) { const n = allNotes().find(x => x.id === ds.purge); if (!n) return; return confirmModal({ title: 'Apagar de vez?', text: `A nota de <b>${esc(n.fornecedor)}</b> (${brl(n.valor)}) e o arquivo dela serão apagados para sempre.`, okLabel: 'Apagar de vez', onOk: () => { if (n.arquivo) Files.del(n.arquivo.id); DB.d.notes[S.co.id] = allNotes().filter(x => x.id !== n.id); DB.save(); refreshAll(); toast('Nota apagada de vez'); } }); }
  const a = ds.act; if (!a) return;
  if (a === 'new') return openForm();
  if (a === 'me') return menuSheet('me');
  if (a === 'more') return menuSheet('more');
  if (a === 'cmd') return openCmd();
  if (a === 'notif') return openNotif(t);
  if (a === 'logout') return logout();
  if (a === 'nclear') { Object.assign(S.nf, { q: '', dep: '', cat: '', proj: '', st: '' }); return renderNotas(); }
  if (a === 'more-notes') { notesLimit += 150; return renderNotas(); }
  if (a === 'approve-all') { const p = pendentes(); return confirmModal({ title: `Aprovar ${plural(p.length, 'nota', 'notas')}?`, text: `Total de <b>${brl(sum(p))}</b>. Elas entram nas contas a pagar.`, okLabel: 'Aprovar todas', onOk: () => { p.forEach(n => setAprov(n, 'aprovada')); DB.save(); refreshAll(); toast(`${plural(p.length, 'nota aprovada', 'notas aprovadas')}`); } }); }
  if (a === 'zip') return runZip(S.fech);
  if (a === 'rm-avatar') { S.user.avatar = ''; DB.save(); return refreshAll(); }
  if (a === 'rm-logo') { S.co.logo = ''; saveCo(); return refreshAll(); }
  if (a === 'save-perfil') {
    const nome = $('#pNome').value.trim(), email = $('#pEmail').value.trim();
    if (!nome) return toast('Informe o seu nome.', 'err');
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return toast('Digite um e-mail válido.', 'err');
    const other = DB.userByEmail(email); if (other && other.id !== S.user.id) return toast('Esse e-mail já é usado por outra pessoa.', 'err');
    Object.assign(S.user, { nome, email, cargo: $('#pCargo').value.trim(), depId: $('#pDep').value }); DB.save(); refreshAll(); return toast('Perfil salvo');
  }
  if (a === 'save-senha') {
    const cur = $('#pAtual').value, n1 = $('#pNova').value, n2 = $('#pNova2').value;
    if (S.user.pw !== await hashPw(cur, S.user.salt)) return toast('A senha atual não confere.', 'err');
    if (n1.length < 8) return toast('A nova senha precisa ter pelo menos 8 caracteres.', 'err');
    if (n1 !== n2) return toast('As duas senhas novas não são iguais.', 'err');
    S.user.salt = newSalt(); S.user.pw = await hashPw(n1, S.user.salt); DB.save();
    ['pAtual', 'pNova', 'pNova2'].forEach(id => { $('#' + id).value = ''; }); return toast('Senha trocada');
  }
  if (a === 'save-empresa') {
    const nome = $('#eNome').value.trim(); if (!nome) return toast('Informe o nome da empresa.', 'err');
    Object.assign(S.co, { nome, cnpj: fmtCNPJ($('#eCnpj').value), cidade: $('#eCidade').value.trim(), segmento: $('#eSeg').value, projLabel: $('#eLabel').value, cor: ($('#eCor') || {}).value || S.co.cor || '#2F6BFF' });
    saveCo(); refreshAll(); return toast('Dados da empresa salvos');
  }
  if (a === 'add-member') return memberModal(null);
  if (a === 'empty-trash') return confirmModal({ title: 'Esvaziar a lixeira?', text: `${plural(trash().length, 'nota será apagada', 'notas serão apagadas')} para sempre, junto com os arquivos.`, okLabel: 'Esvaziar', onOk: () => { trash().forEach(n => n.arquivo && Files.del(n.arquivo.id)); DB.d.notes[S.co.id] = allNotes().filter(n => !n.excluidoEm); DB.save(); refreshAll(); toast('Lixeira esvaziada'); } });
  if (a === 'reset-demo') return confirmModal({ title: 'Restaurar a demonstração?', text: 'Tudo o que foi alterado na empresa de exemplo volta ao original.', okLabel: 'Restaurar', onOk: async () => { await seedDemo(); const u = DB.user('u_demo'); DB.d.session = { userId: u.id }; DB.save(); S.own = 'perfil'; S.chat = []; startApp(u); toast('Demonstração restaurada'); } });
  if (a === 'del-co') {
    if (norm($('#delCo').value) !== norm(S.co.nome)) return toast('Digite o nome da empresa exatamente como aparece para confirmar.', 'err');
    const cid = S.co.id; allNotes().forEach(n => n.arquivo && Files.del(n.arquivo.id));
    delete DB.d.notes[cid]; delete DB.d.companies[cid];
    const me = S.user, others = (me.empresas || []).filter(x => x !== cid && DB.d.companies[x]);
    DB.d.users.forEach(u => { if (u.empresas) u.empresas = u.empresas.filter(x => x !== cid); });
    if (others.length) { me.companyId = others[0]; DB.d.users = DB.d.users.filter(u => u === me || u.companyId !== cid); DB.save(); startApp(me); return toast('Empresa excluída. Você está em ' + esc(DB.d.companies[others[0]].nome)); }
    DB.d.users = DB.d.users.filter(u => u.companyId !== cid); DB.d.session = null; DB.save();
    S.user = null; S.co = null; renderAuth('login', { text: 'A empresa e todos os dados foram excluídos.', kind: 'ok' });
  }
});
document.addEventListener('change', e => {
  if (!S.user) return;
  const id = e.target.id, v = e.target.value;
  if (id === 'dDep') { S.dashDep = v; renderPainel(); }
  else if (id === 'nDep') { S.nf.dep = v; renderNotas(); }
  else if (id === 'nCat') { S.nf.cat = v; renderNotas(); }
  else if (id === 'nProj') { S.nf.proj = v; renderNotas(); }
  else if (id === 'nSt') { S.nf.st = v; renderNotas(); }
  else if (id === 'rDep') { S.rel.dep = v; renderRel(); }
  else if (id === 'rCat') { S.rel.cat = v; renderRel(); }
  else if (id === 'rProj') { S.rel.proj = v; renderRel(); }
  else if (id === 'fechMes') { S.fech = v; }
});
document.addEventListener('submit', e => {
  if (e.target.id === 'fLogin') return onLogin(e);
  if (e.target.id === 'fSignup') return onSignup(e);
  if (e.target.id !== 'askForm') e.preventDefault();
});

/* =========================================================
   INÍCIO
   ========================================================= */
function boot() {
  DB.load();
  { const u = DB.user('u_demo'); if (u && u.nome === 'Marina Costa') { u.nome = 'Ana Bia'; DB.save(); } }
  if (!DB.d.v2ui) { DB.d.theme = 'light'; DB.d.v2ui = true; try { DB.save(); } catch {} }
  applyTheme(DB.d.theme || 'light');
  getSample(); getDownloads();
  const sess = DB.d.session && DB.user(DB.d.session.userId);
  if (SITE_DEMO && (!sess || DB.d.siteDemoV !== 2)) { (async () => { await demoSeedEmpty(); await doLogin('demo@conexo.app', 'demo1234'); })(); }
  else if (sess && DB.d.companies[sess.companyId]) startApp(sess);
  else renderAuth(location.hash === '#criar' ? 'signup' : 'login');
}
boot();
})();
</script>

</body>
</html>
