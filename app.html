/* =================== CONEXO 2 · simples, claro, azul =================== */
:root[data-theme="light"],:root:not([data-theme]){--bg:#F4F6FB;--bg-2:#EDF1F8;--line:#E4E8F0;--line-2:#D3DAE6;--ink-2:#2A3346;--muted:#5D6880}
:root{--side-g1:#2563FF;--side-g2:#1A49D6;--r2:22px;--sh2:0 1px 2px rgba(16,24,40,.04),0 10px 30px -14px rgba(16,24,40,.16)}
:root[data-theme="dark"]{--side-g1:#0F1C45;--side-g2:#0A1230;--sh2:0 1px 0 rgba(255,255,255,.03) inset,0 20px 40px -24px rgba(0,0,0,.9)}
body{font-size:15.5px}
/* barra lateral azul */
.v2 .side{background:linear-gradient(180deg,var(--side-g1),var(--side-g2));color:#fff;padding:18px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.v2 .side .logo{color:#fff}
.v2 .side .logo-mark rect:first-child{fill:#fff}
.v2 .side .logo-mark path:first-of-type{fill:#DCE6FF;opacity:.6}
.v2 .side .logo-mark path:nth-of-type(2),.v2 .side .logo-mark circle{stroke:#2563FF}
.v2 .side .logo-mark circle,.v2 .side .logo-mark rect:not(:first-child){fill:#2563FF}
.v2 .co{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.16)}
.v2 .co:hover{background:rgba(255,255,255,.18)}
.v2 .co .avatar{background:#fff;color:#1A49D6}
.v2 .co small,.v2 .me small{color:rgba(255,255,255,.72)}
.v2 .co .chev,.v2 .me .chev{color:rgba(255,255,255,.7)}
.side-scan{display:flex;align-items:center;gap:12px;width:100%;margin:4px 0 14px;padding:12px 14px;border:0;border-radius:16px;background:#fff;color:#1A49D6;text-align:left;box-shadow:0 14px 30px -14px rgba(0,0,0,.45);transition:transform .15s}
.side-scan:hover{transform:translateY(-1px)}
.side-scan svg{width:26px;height:26px;flex:none}
.side-scan b{display:block;font-size:16px;font-weight:700;line-height:1.1}
.side-scan small{display:block;font-size:12px;font-weight:600;color:#5D7BD6;margin-top:2px}
:root[data-theme="dark"] .side-scan{background:#2F6BFF;color:#fff}
:root[data-theme="dark"] .side-scan small{color:#CFDBFF}
.v2 .nav-label{color:rgba(255,255,255,.55);letter-spacing:.14em;padding:16px 12px 6px}
.v2 .nav button{color:rgba(255,255,255,.86);font-size:15px;font-weight:500;padding:11px 12px;border-radius:12px;gap:12px}
.v2 .nav button svg{width:20px;height:20px;color:inherit}
.v2 .nav button:hover{background:rgba(255,255,255,.12);color:#fff}
.v2 .nav button[aria-current="page"]{background:rgba(255,255,255,.2);color:#fff;font-weight:700;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.v2 .nav button[aria-current="page"] svg{color:#fff}
.v2 .nav button[aria-current="page"]::before{display:none}
:root[data-theme="dark"] .v2 .nav button[aria-current="page"]{background:#2F6BFF;color:#fff}
:root[data-theme="dark"] .v2 .nav button[aria-current="page"] svg{color:#fff}
.v2 .nav .count{background:rgba(255,255,255,.2);color:#fff;border-color:transparent}
.v2 .nav .count.hot{background:#FF5A6A;color:#fff}

.v2 .nav-end{border-top-color:rgba(255,255,255,.16)}
.v2 .me{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.14)}
.v2 .side-foot{padding-top:10px}
/* topo e conteúdo */
.v2 .topbar{background:color-mix(in srgb,var(--bg) 85%,transparent);border-bottom:0}
.v2 .crumbs{font-size:15px}
.v2 .cmd-btn{height:42px;border-radius:13px;font-size:14px;border-color:var(--line)}
.v2 .content{max-width:1360px}
.v2 .pi{margin-bottom:22px}
.v2 .pi-tx h1{font-size:clamp(26px,2.3vw,32px);font-weight:700;letter-spacing:-.035em}
.v2 .pi-tx p{font-size:15.5px;max-width:62ch}
.v2 .pi-act{align-items:center}
.v2 .btn{min-height:44px;border-radius:13px;font-size:15px;padding:0 18px}
.v2 .btn-sm{min-height:36px;font-size:14px;border-radius:11px;padding:0 13px}
.v2 .btn-ico{width:44px;padding:0}
.btn-scan{gap:10px;padding:0 22px!important;font-weight:700}
.btn-scan svg{width:20px;height:20px}
.v2 .tabs button{font-size:15px;padding:12px 14px}
.v2 .lst{border-radius:18px;box-shadow:var(--sh2);border-color:transparent}
.v2 .lr{padding:15px 18px}
.v2 .lr-main b{font-size:15.5px}
.v2 .lr-main small{font-size:13.5px}
.v2 .lst-g{font-size:12.5px;margin:22px 4px 10px}
.v2 .srch{min-height:46px;border-radius:14px;font-size:15px}
.v2 .p-btn{min-height:46px;border-radius:14px;font-size:14px;padding:0 14px}
.seg-pill{display:inline-flex;gap:4px;padding:4px;border-radius:14px;background:var(--surface);border:1px solid var(--line);flex-wrap:wrap}
.seg-pill button{border:0;background:none;color:var(--ink-2);font-weight:600;font-size:14px;padding:9px 14px;border-radius:10px;display:inline-flex;align-items:center;gap:6px}
.seg-pill button em{font-style:normal;font-size:12px;color:var(--muted);font-weight:700}
.seg-pill button[aria-pressed="true"]{background:var(--blue);color:#fff;box-shadow:0 6px 16px -8px var(--blue)}
.seg-pill button[aria-pressed="true"] em{color:rgba(255,255,255,.8)}
.mstep{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;min-height:46px}
.mstep button{width:38px;height:38px;border:0;border-radius:10px;background:none;display:grid;place-items:center;color:var(--ink-2)}
.mstep button:hover:not(:disabled){background:var(--surface-2)}
.mstep button:disabled{opacity:.35}
.mstep button svg{width:18px;height:18px}
.mstep b{min-width:150px;text-align:center;font-size:15px}
/* menu de baixo (celular) com Escanear no meio */
@media (max-width:760px){
  .v2 .bottom{background:color-mix(in srgb,var(--surface) 94%,transparent);border-top:1px solid var(--line)}
  .v2 .bottom button{color:var(--muted);font-size:11.5px}
  .v2 .bottom button[aria-current="page"]{color:var(--blue)}
  .v2 .bottom button[aria-current="page"] svg{color:var(--blue)}
  .v2 .bottom .fab{width:auto;height:auto;padding:10px 14px 8px;border-radius:20px;flex-direction:column;gap:2px;margin-top:-30px;background:var(--blue);color:#fff;box-shadow:0 0 0 5px var(--bg),0 14px 30px -8px var(--blue);display:flex;align-items:center}
  .v2 .bottom .fab svg{width:26px;height:26px}
  .v2 .bottom .fab span{font-size:11px;font-weight:700}
  .v2 .content{padding-block:14px calc(118px + env(safe-area-inset-bottom,0px))}
}
/* ---------- escanear ---------- */
.sc2-sheet{width:min(560px,100%)}
.sc2{display:flex;flex-direction:column;gap:14px}
.sc2-lead{font-size:16px;color:var(--ink-2);margin:0}
.sc2-opts{display:grid;gap:10px}
.sc2-opt{display:flex;align-items:center;gap:16px;padding:16px 18px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);color:inherit;text-align:left;cursor:pointer;width:100%;transition:border-color .15s,background .15s}
.sc2-opt:hover,.sc2-opt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.sc2-opt b{display:block;font-size:17px}
.sc2-opt small{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.sc2-ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue);flex:none}
.sc2-ic svg{width:26px;height:26px}
.sc2-opt.sc2-main{background:var(--blue);border-color:var(--blue);color:#fff}
.sc2-opt.sc2-main small{color:rgba(255,255,255,.82)}
.sc2-opt.sc2-main .sc2-ic{background:rgba(255,255,255,.18);color:#fff}
.sc2-opt.sc2-main:hover{background:var(--blue-deep)}
.sc2-code{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:16px;background:var(--bg-2)}
.sc2-code label{font-weight:600;font-size:14.5px}
.sc2-code textarea{font-family:var(--f-mono);font-size:14px}
.sc2-code-acts{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.sc2-code .code-res{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.sc2-note{display:flex;gap:8px;font-size:13.5px;color:var(--muted);margin:0}
.sc2-note svg{width:16px;height:16px;flex:none;margin-top:2px}
.sc2-foot{justify-content:center}
/* ---------- início ---------- */
.v2-hello{margin:2px 0 18px}
.v2-hello h1{font-size:clamp(28px,2.6vw,36px);font-weight:700;letter-spacing:-.04em}
.v2-hello p{color:var(--muted);font-size:16px;margin-top:4px}
.scan-hero{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:center;padding:34px 36px;border-radius:28px;overflow:hidden;color:#fff;background:radial-gradient(70% 120% at 100% 0%,rgba(255,255,255,.22),transparent 60%),linear-gradient(135deg,#2F6BFF 0%,#1A49D6 70%,#143BB0 100%);box-shadow:0 30px 60px -30px rgba(26,73,214,.7);margin-bottom:26px}
.scan-hero::after{content:"";position:absolute;right:-80px;bottom:-120px;width:360px;height:360px;border-radius:50%;border:2px solid rgba(255,255,255,.12)}
.sh-k{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700;background:rgba(255,255,255,.16);padding:6px 12px;border-radius:99px}
.sh-k svg{width:15px;height:15px}
.sh-tx h2{font-size:clamp(32px,3.4vw,48px);font-weight:700;letter-spacing:-.045em;margin:14px 0 8px;color:#fff}
.sh-tx p{font-size:17px;line-height:1.55;max-width:46ch;color:rgba(255,255,255,.9)}
.sh-tx p b{color:#fff}
.sh-types{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.sh-types span{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:600;padding:7px 12px;border-radius:12px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18)}
.sh-types svg{width:17px;height:17px}
.sh-btn{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:26px 34px 22px;border:0;border-radius:28px;background:#fff;color:#1A49D6;box-shadow:0 24px 50px -20px rgba(0,0,0,.5);transition:transform .15s}
.sh-btn:hover{transform:translateY(-2px) scale(1.01)}
.sh-btn b{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:10px}
.sh-btn small{font-size:13.5px;color:#5D7BD6;font-weight:600}
.sh-frame{position:relative;width:118px;height:118px;display:grid;place-items:center;border-radius:28px;background:#EEF3FF}
.sh-frame>svg{width:50px;height:50px}
.sh-frame i{position:absolute;width:24px;height:24px;border:4px solid #2F6BFF}
.sh-frame i:nth-child(1){left:10px;top:10px;border-right:0;border-bottom:0;border-radius:10px 0 0 0}
.sh-frame i:nth-child(2){right:10px;top:10px;border-left:0;border-bottom:0;border-radius:0 10px 0 0}
.sh-frame i:nth-child(3){left:10px;bottom:10px;border-right:0;border-top:0;border-radius:0 0 0 10px}
.sh-frame i:nth-child(4){right:10px;bottom:10px;border-left:0;border-top:0;border-radius:0 0 10px 0}
.sh-line{position:absolute;left:18px;right:18px;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,#2F6BFF,transparent);top:20px;animation:shScan 2.6s ease-in-out infinite}
@keyframes shScan{0%,100%{top:20px;opacity:.2}50%{top:95px;opacity:1}}
.pbi-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 20px;flex-wrap:wrap;margin-bottom:14px}
.pbi-h h2{font-size:22px;font-weight:700;letter-spacing:-.03em}
.pbi-h p{color:var(--muted);font-size:14.5px;margin-top:2px}
.pbi-f{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pbi-chip{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:12px;padding:9px 12px;background:var(--blue);color:#fff;font-weight:600;font-size:14px}
.pbi-chip svg{width:15px;height:15px}
.pbi-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.pbi-card{background:var(--surface);border-radius:var(--r2);padding:18px 20px 14px;box-shadow:var(--sh2);min-width:0;display:flex;flex-direction:column}
.pbi-card.w2{grid-column:span 2}
.pbi-card header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.pbi-card h3{font-family:var(--f-body);font-size:16px;font-weight:700}
.pbi-card header small{font-size:13px;color:var(--muted);text-align:right}
.pbi-ch{height:240px}
.pbi-ch.tall{height:270px}
.pbi-st{display:flex;flex-direction:column;gap:16px;justify-content:center;flex:1;padding:6px 0 4px}
.pbi-bar{display:flex;gap:4px;height:22px;border-radius:12px;overflow:hidden;background:var(--surface-3)}
.pbi-bar i{display:block;min-width:6px}
.pbi-bar i.ok,.pbi-li i.ok{background:var(--ok)}.pbi-bar i.blue,.pbi-li i.blue{background:var(--blue)}.pbi-bar i.bad,.pbi-li i.bad{background:var(--bad)}.pbi-bar i.warn,.pbi-li i.warn{background:var(--warn)}
.pbi-leg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.pbi-li{display:grid;grid-template-columns:12px minmax(0,1fr);grid-template-rows:auto auto;column-gap:8px;align-items:center;text-align:left;border:1px solid var(--line);background:none;border-radius:14px;padding:10px 12px;color:inherit}
.pbi-li:hover{border-color:var(--blue-line);background:var(--blue-soft)}
.pbi-li i{width:12px;height:12px;border-radius:4px}
.pbi-li span{font-size:13.5px;color:var(--ink-2);font-weight:600}
.pbi-li b{grid-column:2;font-family:var(--f-display);font-size:22px}
.pbi-li small{display:none}
/* ---------- A.N.A.B: esfera de luz ---------- */
.aura-orb{position:fixed;right:max(24px,env(safe-area-inset-right,0px));bottom:max(24px,env(safe-area-inset-bottom,0px));z-index:45;width:64px;height:64px;border:0;padding:0;background:none;border-radius:50%;cursor:pointer}
.ao-glow{position:absolute;inset:-16px;border-radius:50%;background:radial-gradient(circle,rgba(92,180,255,.55),rgba(47,107,255,.25) 45%,transparent 70%);filter:blur(4px);animation:aoPulse 3.2s ease-in-out infinite}
.ao-ball{position:relative;display:block;width:100%;height:100%;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 32% 28%,#FFFFFF 0%,#BFE3FF 12%,#5DA9FF 34%,#2F6BFF 58%,#1636A8 82%,#0B1E6B 100%);box-shadow:0 14px 34px -10px rgba(47,107,255,.9),inset 0 -6px 14px rgba(5,15,60,.45)}
.ao-ball i{position:absolute;inset:-30%;background:conic-gradient(from 0deg,transparent 0 20%,rgba(160,230,255,.55) 28%,transparent 40% 62%,rgba(120,170,255,.45) 72%,transparent 84%);animation:aoSpin 7s linear infinite;mix-blend-mode:screen;filter:blur(3px)}
.ao-ball em{position:absolute;left:20%;top:13%;width:34%;height:22%;border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.85),transparent 70%)}
.aura-orb:hover .ao-ball{transform:scale(1.05)}
.ao-ball{transition:transform .2s}
.ao-tip{position:absolute;right:calc(100% + 12px);top:50%;transform:translateY(-50%) translateX(6px);white-space:nowrap;background:var(--ink);color:var(--surface);font-size:13.5px;font-weight:500;padding:8px 12px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.ao-tip b{font-family:'Michroma',var(--f-body);font-size:11.5px;letter-spacing:.14em;font-weight:400}
.aura-orb:hover .ao-tip,.aura-orb:focus-visible .ao-tip{opacity:1;transform:translateY(-50%)}
.aura-orb:focus-visible{outline:3px solid var(--blue-line);outline-offset:6px}
@keyframes aoPulse{0%,100%{transform:scale(1);opacity:.75}50%{transform:scale(1.12);opacity:1}}
@keyframes aoSpin{to{transform:rotate(360deg)}}
.ao-ball.sm{width:40px;height:40px;flex:none}
.ao-ball.xs{width:28px;height:28px;flex:none;margin-top:2px}
.ao-ball.lg{width:96px;height:96px}
@media (max-width:760px){.aura-orb{bottom:calc(96px + env(safe-area-inset-bottom,0px));right:16px;width:54px;height:54px}.ao-tip{display:none}}
/* conversa */
.aura-ov{background:rgba(10,16,32,.28);justify-content:flex-end;align-items:stretch;padding:12px}
.aura-sheet{width:min(440px,100%);max-height:none;height:100%;border-radius:24px;animation:adrIn .22s ease-out}
@keyframes adrIn{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.adr{display:flex;flex-direction:column;height:100%;min-height:0}
.adr-h{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.adr-t{flex:1;min-width:0}
.adr-t b{display:block;font-family:'Michroma',var(--f-body);font-weight:400;font-size:15px;letter-spacing:.2em}
.adr-t small{display:block;font-size:12.5px;color:var(--muted)}
.adr-log{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:14px;min-height:0}
.aw{display:flex;flex-direction:column;align-items:center;text-align:center;padding:14px 4px}
.aw-orb{position:relative;margin-bottom:14px}
.aw-orb::before{content:"";position:absolute;inset:-26px;border-radius:50%;background:radial-gradient(circle,rgba(92,180,255,.45),transparent 70%);animation:aoPulse 3.2s ease-in-out infinite}
.aw h3{font-size:24px;font-weight:700;letter-spacing:-.03em}
.aw p{color:var(--muted);font-size:15px;margin:6px 0 18px;max-width:34ch}
.aw-list{display:flex;flex-direction:column;gap:8px;width:100%}
.aw-q{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-align:left;font-size:15.5px;font-weight:500}
.aw-q:hover{border-color:var(--blue);background:var(--blue-soft)}
.aw-q>svg:first-child{width:19px;height:19px;color:var(--blue)}
.aw-q span{flex:1}
.aw-ch{width:16px;height:16px;color:var(--muted)}
.am{display:flex;gap:10px;align-items:flex-start;max-width:100%}
.am.am-me{justify-content:flex-end}
.am.am-me .am-b{background:var(--blue);color:#fff;border-radius:18px 18px 4px 18px;padding:10px 14px;max-width:85%;font-size:15.5px}
.am-w{min-width:0;max-width:calc(100% - 38px)}
.am.am-ai .am-b{background:var(--surface-2);border-radius:4px 18px 18px 18px;padding:11px 14px;font-size:15.5px;line-height:1.5;color:var(--ink)}
.am.am-ai .am-b p{margin:0}.am.am-ai .am-b p+p{margin-top:6px}
.am.am-ai .am-b ul{margin:4px 0 0 18px;display:flex;flex-direction:column;gap:4px}
.am.am-ai .am-b strong{color:var(--ink);font-weight:700}
.am-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.am-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);border-radius:99px;padding:6px 12px;font-size:13.5px;font-weight:600}
.am-btn svg{width:14px;height:14px}
.am-btn:hover{border-color:var(--blue);color:var(--blue)}
.am-btn.go{background:var(--blue-soft);border-color:transparent;color:var(--blue-2)}
.adr-sugg{display:flex;gap:6px;overflow-x:auto;padding:0 14px 8px;scrollbar-width:none}
.adr-sugg::-webkit-scrollbar{display:none}
.adr-chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:99px;padding:7px 12px;font-size:13.5px;font-weight:500}
.adr-chip:hover{border-color:var(--blue);color:var(--blue)}
.adr-in{display:flex;gap:8px;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.adr-in input{flex:1;min-width:0;border:1px solid var(--line-2);background:var(--bg-2);border-radius:14px;padding:0 14px;height:48px;font-size:15.5px;outline:none}
.adr-in input:focus{border-color:var(--blue)}
.adr-send{width:48px;height:48px;border-radius:14px;border:0;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none}
.adr-send svg{width:19px;height:19px}
@media (max-width:760px){.aura-ov{padding:0}.aura-sheet{border-radius:0;width:100%}}
/* ---------- notas fiscais ---------- */
.nfs-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.nfs{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:16px 18px;border-radius:20px;border:2px solid transparent;background:var(--surface);box-shadow:var(--sh2);color:inherit;min-width:0}
.nfs:hover{border-color:var(--blue-line)}
.nfs[aria-pressed="true"]{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 6%,var(--surface))}
.nfs-l{font-size:14.5px;font-weight:700;color:var(--ink-2)}
.nfs[aria-pressed="true"] .nfs-l{color:var(--blue)}
.nfs b{font-family:var(--f-display);font-size:24px;font-weight:600;letter-spacing:-.03em;margin-top:4px}
.nfs-v{font-size:14.5px;color:var(--ink-2);font-weight:600}
.nfs-s{font-size:13px;color:var(--muted);margin-top:2px}
.nfs.warn .nfs-l{color:var(--warn)}
.nf-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.nf-hint{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted)}
.nf-hint svg{width:15px;height:15px}
.nf-paybar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--ink-2);background:var(--blue-soft);padding:11px 14px;border-radius:14px;margin:4px 0 6px}
.nf-paybar span{display:inline-flex;align-items:center;gap:8px}
.nf-paybar svg{width:16px;height:16px;color:var(--blue-2)}
.nf-paybar .link{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.nf-lst .lr-act .btn{min-width:96px}
/* ---------- aprovações ---------- */
.ap-rule{display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:20px;background:var(--surface);box-shadow:var(--sh2);margin-bottom:14px}
.ap-ic{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue);flex:none}
.ap-ic svg{width:24px;height:24px}
.ap-rule>div{flex:1;min-width:0}
.ap-rule b{font-size:16.5px}
.ap-rule p{font-size:14.5px;color:var(--muted);margin-top:2px}
.switch.big{transform:scale(1.25);transform-origin:right center;margin-right:6px}
.ap-flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;font-size:14px;color:var(--ink-2)}
.apf{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:var(--surface-2)}
.apf svg{width:16px;height:16px;color:var(--blue)}
.apf b{width:20px;height:20px;border-radius:50%;background:var(--blue);color:#fff;font-size:11.5px;display:grid;place-items:center}
.ap-flow>i svg{width:15px;height:15px;color:var(--muted)}
.apc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.apc{display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:22px;background:var(--surface);box-shadow:var(--sh2)}
.apc-h{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.apc-h b{color:var(--ink-2)}
.apc-main{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:14px;border-radius:16px;background:var(--bg-2)}
.apc-main:hover{background:var(--blue-soft)}
.apc-f{font-size:17px;font-weight:700}
.apc-v{font-family:var(--f-display);font-size:28px;font-weight:600;letter-spacing:-.03em}
.apc-meta{font-size:13.5px;color:var(--muted)}
.apc-see{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:13.5px;font-weight:600;color:var(--blue-2)}
.apc-see svg{width:15px;height:15px}
.apc-acts{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.apc-acts .btn{min-height:52px;font-size:16px;border-radius:15px}
.apc-acts svg{width:19px;height:19px}
.apc-ok{background:var(--ok);color:#fff}
.apc-ok:hover{filter:brightness(.95)}
.apc-no{background:var(--surface);border:1.5px solid var(--line-2);color:var(--ink-2)}
.apc-no:hover{border-color:var(--bad);color:var(--bad)}
.apc-state{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14.5px;font-weight:600;padding:10px 12px;border-radius:12px}
.apc-state svg{width:18px;height:18px}
.apc-state.ok{background:var(--ok-soft);color:var(--ok)}.apc-state.bad{background:var(--bad-soft);color:var(--bad)}.apc-state.wait{background:var(--warn-soft);color:var(--warn)}
.apc-state .btn{margin-left:auto}
/* ---------- fluxo de caixa ---------- */
.cx-help{display:flex;gap:8px;align-items:flex-start;font-size:14px;color:var(--muted);margin:-10px 0 14px}
.cx-help svg{width:16px;height:16px;flex:none;margin-top:2px;color:var(--blue-2)}
.cx-help b{color:var(--ink-2)}
.v2 .cx2-card,.v2 .tile{border-color:transparent;box-shadow:var(--sh2);border-radius:var(--r2)}
/* ---------- departamentos ---------- */
.dp3-top-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:4px}
.dp3-sum{display:flex;align-items:center;gap:8px;font-size:15px;padding:11px 16px;border-radius:14px;margin:0;flex:1;min-width:240px}
.dp3-sum.ok{background:var(--ok-soft);color:var(--ok)}.dp3-sum.near,.dp3-sum.warn{background:var(--warn-soft);color:var(--warn)}
.dp3-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.dp3{display:flex;gap:16px;align-items:flex-start;text-align:left;padding:18px 20px;border-radius:22px;border:2px solid transparent;background:var(--surface);box-shadow:var(--sh2);color:inherit;min-width:0}
.dp3:hover{border-color:var(--blue-line)}
.dp3.over{border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.dp3-ic{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue);flex:none}
.dp3-ic svg{width:24px;height:24px}
.dp3.over .dp3-ic,.dp3.near .dp3-ic{background:var(--warn-soft);color:var(--warn)}
.dp3-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.dp3-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.dp3-top b{font-size:17px}
.dp3-v{font-family:var(--f-display);font-weight:600;font-size:18px;letter-spacing:-.02em}
.dp3-v small{font-family:var(--f-body);font-size:13.5px;color:var(--muted);font-weight:500;letter-spacing:0}
.dp3-bar{position:relative;height:14px;border-radius:99px;background:var(--surface-3)}
.dp3-bar i{display:block;height:100%;border-radius:99px;background:var(--blue)}
.dp3.near .dp3-bar i{background:var(--warn)}
.dp3.over .dp3-bar i{background:repeating-linear-gradient(-45deg,var(--warn) 0 10px,color-mix(in srgb,var(--warn) 75%,#fff) 10px 20px)}
.dp3-pct{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:10.5px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.dp3.ok .dp3-pct{color:var(--ink-2);text-shadow:none}
.dp3-msg{display:block;font-size:14.5px;color:var(--ink-2);line-height:1.45}
.dp3-msg svg{width:17px;height:17px;vertical-align:-3px;margin-right:6px}
.dp3.over .dp3-msg{color:var(--warn);font-weight:600}.dp3.near .dp3-msg svg{color:var(--warn)}.dp3.ok .dp3-msg svg{color:var(--ok)}.dp3.none .dp3-msg{color:var(--muted)}
.lst-g.warn span{color:var(--warn)}
/* ---------- fornecedores ---------- */
.fo-alert{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:20px;background:var(--warn-soft);margin-bottom:16px}
.fo-al-ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--surface);color:var(--warn);flex:none}
.fo-al-ic svg{width:21px;height:21px}
.fo-alert b{font-size:15.5px;color:var(--ink)}
.fo-al-list{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.fo-al-chip{border:0;background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13.5px;color:var(--ink-2)}
.fo-al-chip b{color:var(--warn);font-size:13.5px}
.fo-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.fo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.fo-card{position:relative;display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:22px;background:var(--surface);box-shadow:var(--sh2);min-width:0}
.fo-star{position:absolute;right:12px;top:12px;width:36px;height:36px;border:0;border-radius:11px;background:none;font-size:21px;line-height:1;color:var(--line-2);display:grid;place-items:center}
.fo-star:hover{background:var(--surface-2)}
.fo-star.on{color:#F5B301}
.fo-main{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding-right:40px;min-width:0}
.fo-av{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue);font-weight:800;font-size:15px;flex:none}
.fo-av.sm{width:34px;height:34px;border-radius:11px;font-size:12.5px}
.fo-n{min-width:0}
.fo-n b{display:block;font-size:16.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fo-n small{display:block;font-size:13.5px;color:var(--muted)}
.fo-nums{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fo-nums>div{background:var(--bg-2);border-radius:13px;padding:10px 12px}
.fo-nums small{display:block;font-size:12.5px;color:var(--muted)}
.fo-nums b{display:block;font-size:16px;font-variant-numeric:tabular-nums;margin-top:2px}
.fo-badge{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--ok)}
.fo-badge svg{width:16px;height:16px}
.fo-badge.up{color:var(--warn)}
.fo-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.fo-acts .btn svg{width:15px;height:15px}
.fo-sheet{width:min(1000px,100%)}
.fo-prof{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px}
.fo-prof h4{font-family:var(--f-body);font-size:15px;font-weight:700;margin:18px 0 10px}
.fo-prof h4:first-child{margin-top:0}
.fo-p-nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
.fo-p-nums>div{background:var(--bg-2);border-radius:14px;padding:12px 14px}
.fo-p-nums small{display:block;font-size:12.5px;color:var(--muted)}
.fo-p-nums b{display:block;font-size:17px;margin-top:2px}
.fo-p-nums span{font-size:12px;color:var(--muted)}
.fo-bars{display:flex;align-items:flex-end;gap:5px;height:120px;padding-bottom:18px}
.fo-bars span{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}
.fo-bars i{display:block;width:100%;max-width:22px;border-radius:6px 6px 3px 3px;background:var(--blue)}
.fo-bars small{position:absolute;bottom:-18px;font-size:10.5px;color:var(--muted)}
.fo-p-hint{font-size:13.5px;color:var(--muted);margin:-4px 0 8px}
.fo-peers{display:flex;flex-direction:column;gap:8px}
.fo-peer{display:grid;grid-template-columns:minmax(0,1fr) 110px auto;gap:10px;align-items:center;font-size:14px;padding:6px 8px;border-radius:10px}
.fo-peer.me{background:var(--blue-soft);font-weight:700}
.fo-pb{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.fo-pb i{display:block;height:100%;background:var(--blue);border-radius:99px}
.fo-quick{display:flex;flex-direction:column;gap:8px}
.fo-quick .btn{justify-content:flex-start}
.fo-p-r .field{margin-bottom:10px}
.fo-ro{padding:11px 12px;border-radius:12px;background:var(--bg-2);font-size:14px}
.fo-rates{display:flex;gap:4px;margin-bottom:10px}
.fo-rate{border:0;background:none;font-size:28px;line-height:1;color:var(--line-2);padding:2px}
.fo-rate.on{color:#F5B301}
/* ---------- relatórios ---------- */
.rp2-switch{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.rp2-switch button{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:20px;border:2px solid transparent;background:var(--surface);box-shadow:var(--sh2);color:inherit;text-align:left}
.rp2-switch button>svg{width:26px;height:26px;color:var(--blue);flex:none}
.rp2-switch b{display:block;font-size:16.5px}
.rp2-switch small{display:block;font-size:13.5px;color:var(--muted)}
.rp2-switch button[aria-selected="true"]{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 6%,var(--surface))}
.rp2-per{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.rp2-q{font-weight:700;font-size:16px}
.rp2-cnt{margin-left:auto;font-size:14px;color:var(--muted)}
.rp2-adv{margin-bottom:8px}
.rp2-adv summary{display:inline-flex;align-items:center;gap:8px;cursor:pointer;color:var(--blue-2);font-weight:600;font-size:14.5px;list-style:none;padding:6px 0}
.rp2-adv summary::-webkit-details-marker{display:none}
.rp2-adv summary svg{width:16px;height:16px}
.rp2-adv-b{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:14px;border-radius:16px;background:var(--surface);margin-top:6px;max-width:640px}
.rp2-h{font-family:var(--f-body);font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:20px 4px 10px}
.rp2-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.rp2-card{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:20px;border:2px solid transparent;background:var(--surface);box-shadow:var(--sh2);color:inherit;text-align:left;min-width:0}
.rp2-card:hover:not(.locked){border-color:var(--blue)}
.rp2-card.locked{opacity:.6}
.rp2-ic{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue);flex:none}
.rp2-ic svg{width:23px;height:23px}
.rp2-ic.pdf{background:color-mix(in srgb,#E5484D 12%,transparent);color:#E5484D}
.rp2-ic.xlsx{background:var(--ok-soft);color:var(--ok)}
.rp2-tx{flex:1;min-width:0}
.rp2-tx b{display:block;font-size:16px}
.rp2-tx small{display:block;font-size:13.5px;color:var(--muted);margin-top:2px}
.rp2-fmt{font-size:11px;font-weight:800;letter-spacing:.06em;padding:4px 8px;border-radius:8px;background:var(--surface-2);color:var(--ink-2)}
.rp2-foot{margin-top:12px}
.rp2-foot .link{display:inline-flex;align-items:center;gap:6px}
.v2 .link svg{width:16px;height:16px;flex:none}
.bi-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.bi-chips{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bi-tip{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted)}
.bi-tip svg{width:15px;height:15px}
.bi-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.bi-kpis>div{background:var(--surface);border-radius:18px;padding:14px 18px;box-shadow:var(--sh2)}
.bi-kpis small{display:block;font-size:13px;color:var(--muted)}
.bi-kpis b{display:block;font-family:var(--f-display);font-size:24px;font-weight:600;letter-spacing:-.03em;margin-top:2px}
.bi-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.bi-grid .pbi-card.w2{grid-column:span 2}
/* ---------- conciliação ---------- */
.cc2-hero{padding:28px;border-radius:26px;background:var(--surface);box-shadow:var(--sh2)}
.cc2-hero h2{font-size:22px;font-weight:700;margin-bottom:16px}
.cc2-steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.cc2-steps li{position:relative;padding:20px;border-radius:20px;background:var(--bg-2)}
.cc2-n{position:absolute;top:16px;right:16px;width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;font-weight:800;display:grid;place-items:center;font-size:14px}
.cc2-ic{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;background:var(--surface);color:var(--blue);margin-bottom:12px}
.cc2-ic svg{width:25px;height:25px}
.cc2-steps li>b{display:block;font-size:16.5px;margin-bottom:6px}
.cc2-steps p{font-size:14.5px;color:var(--ink-2);line-height:1.5}
.cc2-acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.cc2-banks{font-size:13.5px;color:var(--muted);margin-top:12px}
.cc2-sum{display:flex;flex-direction:column;gap:8px;padding:22px 24px;border-radius:24px;background:var(--surface);box-shadow:var(--sh2);margin-bottom:16px;align-items:flex-start}
.cc2-big b{font-family:var(--f-display);font-size:30px;font-weight:600;letter-spacing:-.03em;margin-right:8px}
.cc2-big span{font-size:16px;color:var(--ink-2)}
.cc2-prog{width:100%;height:12px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.cc2-prog i{display:block;height:100%;background:var(--ok);border-radius:99px}
.cc2-sum p{font-size:15px;margin:0}
.cc2-sum small{font-size:13px;color:var(--muted)}
.cc2-foot{margin-top:14px}
.cc2-foot .link{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
/* ---------- apresentações: assistente em 3 passos ---------- */
.dw-sheet{width:min(860px,100%)}
.dw h2{font-size:24px;font-weight:700;letter-spacing:-.03em}
.dw-sub{color:var(--muted);font-size:15px;margin:4px 0 18px}
.dw-steps{display:flex;align-items:center;gap:8px;margin-bottom:18px}
.dw-steps i{flex:0 0 40px;height:2px;background:var(--line)}
.dw-dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--surface-2);color:var(--muted)}
.dw-dot svg{width:16px;height:16px}
.dw-dot.on{background:var(--blue);color:#fff}
.dw-dot.done{background:var(--ok-soft);color:var(--ok)}
.dw-tpls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.dw-tpl{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:18px;border-radius:20px;border:2px solid var(--line);background:var(--surface);color:inherit;text-align:left}
.dw-tpl:hover,.dw-tpl.on{border-color:var(--tc)}
.dw-ti{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 15%,transparent);color:var(--tc);margin-bottom:8px}
.dw-ti svg{width:22px;height:22px}
.dw-tpl b{font-size:17px}
.dw-tpl small{font-size:14px;color:var(--muted);line-height:1.45}
.dw-own{display:inline-flex;align-items:center;gap:8px;margin-top:16px;font-size:14.5px}
.dw-own svg{width:16px;height:16px}
.dw-pers{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.dw-per{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;align-items:center;column-gap:10px;padding:16px 18px;border-radius:18px;border:2px solid var(--line);background:var(--surface);color:inherit;text-align:left}
.dw-per b{font-size:16.5px}
.dw-per small{grid-column:1;font-size:13.5px;color:var(--muted)}
.dw-per svg{grid-row:1/3;grid-column:2;width:22px;height:22px;color:var(--blue)}
.dw-per:hover,.dw-per.on{border-color:var(--blue)}
.dw-capas{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.dw-capa{display:flex;flex-direction:column;gap:8px;padding:8px 8px 12px;border-radius:18px;border:2px solid var(--line);background:var(--surface);color:inherit}
.dw-capa:hover,.dw-capa.on{border-color:var(--blue)}

.dw-cv{display:block;border-radius:12px;overflow:hidden;aspect-ratio:16/9;border:1px solid var(--line)}
.dw-cv svg{display:block;width:100%;height:100%}
.dw-capa b{font-size:15px}
.dw-cores{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px}
.dw-cores>span{font-weight:700;font-size:14.5px;margin-right:4px}
.dw-sum{display:flex;gap:8px;align-items:center;font-size:14.5px;color:var(--ink-2);margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--blue-soft)}
.dw-sum svg{width:16px;height:16px;color:var(--blue-2);flex:none}
.dw-foot{display:flex;align-items:center;gap:10px}
.dw-foot .spacer{flex:1}
/* ---------- planos ---------- */
.pl2 .plan ul li span b{font-weight:700}
.pt2 h3{font-size:18px;margin-bottom:12px}
.pt2-wrap{overflow-x:auto}
.pt2-t{width:100%;border-collapse:collapse;font-size:14.5px;min-width:560px}
.pt2-t th,.pt2-t td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:center}
.pt2-t th:first-child,.pt2-t td:first-child{text-align:left}
.pt2-t th{font-size:15.5px}

.fo-rv small{display:block;font-size:12px;color:var(--muted)}
.fo-up{display:inline-flex;align-items:center;gap:3px;color:var(--blue);font-weight:700}
.fo-up svg{width:12px;height:12px}
.fo-right{position:sticky;top:84px;min-width:0}
.fd{background:var(--surface);border-radius:22px;box-shadow:var(--sh2);padding:20px;display:flex;flex-direction:column;gap:14px}
.fd.modal{box-shadow:none;padding:0}
.fd-h{display:flex;align-items:center;gap:14px}
.fd-t{flex:1;min-width:0}
.fd-t b{display:block;font-size:19px;letter-spacing:-.02em}
.fd-t small{display:block;font-size:13px;color:var(--muted)}
.fd .fo-star{position:static}
.fd-acts{display:flex;gap:8px;flex-wrap:wrap}
.fd-acts .btn svg{width:15px;height:15px}
.fd-tabs{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--bg-2);overflow-x:auto;scrollbar-width:none}
.fd-tabs button{flex:1 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:none;border-radius:10px;padding:9px 12px;font-weight:600;font-size:13.5px;color:var(--ink-2)}
.fd-tabs button svg{width:15px;height:15px}
.fd-tabs button[aria-selected="true"]{background:var(--surface);color:var(--blue);box-shadow:0 2px 8px -4px rgba(16,24,40,.25)}
.fd-body h4{font-family:var(--f-body);font-size:14.5px;font-weight:700;margin:16px 0 8px}
.fd-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.fd-stats>div{background:var(--bg-2);border-radius:14px;padding:11px 13px}
.fd-stats>div:first-child{background:linear-gradient(135deg,#2F6BFF,#1A49D6);color:#fff}
.fd-stats small{display:block;font-size:12px;opacity:.8}
.fd-stats b{display:block;font-size:16px;margin-top:2px;font-variant-numeric:tabular-nums}
.fd-stats span{font-size:11.5px;opacity:.7}
.fd-alert,.fd-ok{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:12px 14px;border-radius:14px;margin-top:12px}
.fd-alert{background:var(--blue-soft);color:var(--ink)}.fd-alert svg{color:var(--blue)}
.fd-ok{background:var(--bg-2);color:var(--ink-2)}.fd-ok svg{color:var(--ok)}
.fd-alert svg,.fd-ok svg{width:18px;height:18px;flex:none;margin-top:1px}
.fd-meta{display:flex;gap:8px 16px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:var(--muted)}
.fd-meta span{display:inline-flex;align-items:center;gap:6px}.fd-meta svg{width:14px;height:14px}
.fd-hint{font-size:14px;color:var(--ink-2);margin:0 0 10px}
.fd-more{font-size:13px;color:var(--muted);margin-top:8px}
.fo-peer{border:0;background:none;color:inherit;text-align:left;grid-template-columns:30px minmax(0,1fr) 110px auto;width:100%}
.fo-peer:hover{background:var(--bg-2)}
.fo-rk{font-weight:800;color:var(--muted);font-size:13px}
.fo-peer.mine .fo-rk{color:var(--blue)}
.fo-peer.mine{background:var(--blue-soft);font-weight:700}
.fo-left .srch{flex:none}
.fo-pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fd-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 12px;margin-bottom:10px}
.fd-form .field:nth-last-child(1),.fd-form .field:nth-last-child(2){grid-column:1/-1}
.fo-ov .sheet{width:min(720px,100%)}
/* conciliação com cor */
.cc2-hero{background:linear-gradient(135deg,#2F6BFF,#1A49D6)!important;color:#fff;box-shadow:0 22px 44px -22px rgba(26,73,214,.85)!important}
.cc2-hero h2{color:#fff}
.cc2-steps li{background:rgba(255,255,255,.12)!important;border:1px solid rgba(255,255,255,.16)}
.cc2-steps li>b{color:#fff}.cc2-steps p{color:rgba(255,255,255,.88)!important}.cc2-steps p b{color:#fff}
.cc2-n{background:#fff!important;color:#1A49D6!important}
.cc2-ic{background:#fff!important;color:#1A49D6!important}
.cc2-acts .btn-primary{background:#fff;color:#1A49D6}
.cc2-acts .btn-ghost{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#fff}
.cc2-banks{color:rgba(255,255,255,.8)!important}
/* relatórios: um pouco mais organizado */
.rp2-per{background:var(--surface);border-radius:18px;padding:12px 16px;box-shadow:var(--sh2)}
.rp2-h{display:flex;align-items:center;gap:10px}
.rp2-h::after{content:"";flex:1;height:1px;background:var(--line)}
/* WhatsApp */
.wa2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:22px;align-items:center;padding:28px;border-radius:28px;background:var(--surface);box-shadow:var(--sh2);margin-bottom:18px}
.wa2-k{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;padding:6px 12px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.wa2-k i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.wa2-k.on{background:rgba(37,211,102,.12);color:#128C4A}.wa2-k.on i{background:#25D366;box-shadow:0 0 0 4px rgba(37,211,102,.2)}
.wa2-l h2{font-size:clamp(28px,2.7vw,38px);font-weight:700;letter-spacing:-.04em;line-height:1.1;margin:14px 0 10px}
.wa2-l h2 em{font-style:normal;color:var(--blue)}
.wa2-l>p{font-size:15.5px;color:var(--ink-2);line-height:1.55;max-width:48ch}
.wa2-steps{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.wa2-steps li{display:flex;gap:14px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:var(--bg-2)}
.wa2-steps li>b{width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:14px;flex:none}
.wa2-steps strong{display:block;font-size:15px}
.wa2-steps span{display:block;font-size:13.5px;color:var(--muted);margin-top:2px}
.wa2-num{display:flex!important;align-items:center;gap:12px;color:var(--ink)!important;font-size:15px!important}
.wa2-num .link{display:inline-flex;align-items:center;gap:5px;font-size:13.5px}
.wa2-ai{display:flex;gap:12px;align-items:flex-start;margin-top:14px;padding:14px 16px;border-radius:16px;background:var(--blue-soft)}
.wa2-ai .ao-ball{width:40px;height:40px;flex:none;box-shadow:none!important}
.wa2-ai b{display:block;font-size:15px}
.wa2-ai>div>span{display:block;font-size:13.5px;color:var(--ink-2);margin-top:2px}
.wa2-q{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.wa2-q em{font-style:normal;font-size:13px;background:var(--surface);border-radius:99px;padding:5px 10px;color:var(--blue-2);font-weight:600}
/* motion: foto no WhatsApp entrando no Conexo (12 s em loop) */
.md{position:relative;display:grid;grid-template-columns:250px 52px minmax(0,1fr);align-items:center;gap:0;padding:18px;border-radius:24px;background:radial-gradient(80% 90% at 20% 20%,rgba(47,107,255,.18),transparent 70%),linear-gradient(135deg,#0E1A3D,#0A1230);min-height:420px;overflow:hidden}
.md-phone{position:relative;width:250px;height:440px;border-radius:34px;background:#0B141A;border:7px solid #1C2733;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 60px -20px rgba(0,0,0,.7)}
.md-top{display:flex;align-items:center;gap:8px;padding:12px 12px 10px;background:#202C33;color:#E9EDEF}
.md-av .logo-mark{width:30px;height:30px}
.md-top b{display:block;font-size:13px}.md-top small{display:block;font-size:11px;color:#8696A0}
.md-chat{flex:1;display:flex;flex-direction:column;gap:7px;padding:12px 10px;background:#0B141A;overflow:hidden}
.md-b{max-width:84%;font-size:11.5px;line-height:1.4;color:#E9EDEF;padding:7px 9px;border-radius:3px 10px 10px 10px;background:#202C33;align-self:flex-start;animation:12s linear infinite both}
.md-b.me{align-self:flex-end;background:#005C4B;border-radius:10px 3px 10px 10px}
.md-b b{color:#fff}
.md-pic{position:relative;display:block;width:120px;height:84px;border-radius:7px;background:linear-gradient(160deg,#FAFAF7,#E9E4D8);overflow:hidden}
.md-pic i{position:absolute;left:12px;right:28px;height:3px;border-radius:2px;background:#C9C3B6}
.md-pic i:nth-child(1){top:14px;right:50px;background:#9E978A}.md-pic i:nth-child(2){top:26px}.md-pic i:nth-child(3){top:38px;right:40px}
.md-pic b{position:absolute;left:12px;bottom:10px;font-size:12px;color:#222!important}
.md-b.typing{display:flex;gap:4px;padding:9px 11px}
.md-b.typing i{width:6px;height:6px;border-radius:50%;background:#8696A0;animation:mdDot 1s infinite}
.md-b.typing i:nth-child(2){animation-delay:.15s}.md-b.typing i:nth-child(3){animation-delay:.3s}
@keyframes mdDot{0%,100%{opacity:.3}50%{opacity:1}}
.md-b.m0{animation-name:mdM0}.md-b.m1{animation-name:mdM1}.md-b.m2{animation-name:mdM2}.md-b.m3{animation-name:mdM3}.md-b.m4{animation-name:mdM4}.md-b.m5{animation-name:mdM5}
@keyframes mdM0{0%,92%{opacity:1;transform:none}96%,100%{opacity:0}}
@keyframes mdM1{0%,14%{opacity:0;transform:translateY(10px) scale(.9)}18%,92%{opacity:1;transform:none}96%,100%{opacity:0}}
@keyframes mdM2{0%,22%{opacity:0;max-height:0;padding:0 11px}24%,34%{opacity:1;max-height:30px;padding:9px 11px}36%,100%{opacity:0;max-height:0;padding:0 11px;margin-top:-7px}}
@keyframes mdM3{0%,36%{opacity:0;transform:translateY(10px)}40%,92%{opacity:1;transform:none}96%,100%{opacity:0}}
@keyframes mdM4{0%,62%{opacity:0;transform:translateY(10px)}66%,92%{opacity:1;transform:none}96%,100%{opacity:0}}
@keyframes mdM5{0%,72%{opacity:0;transform:translateY(10px)}76%,92%{opacity:1;transform:none}96%,100%{opacity:0}}
.md-flash{position:absolute;inset:0;background:#fff;opacity:0;animation:mdFlash 12s linear infinite;pointer-events:none}
@keyframes mdFlash{0%,10%{opacity:0}12%{opacity:.85}15%,100%{opacity:0}}
.md-flow{display:flex;align-items:center;justify-content:center;gap:4px;color:#6B95FF}
.md-flow span{width:6px;height:6px;border-radius:50%;background:#6B95FF;opacity:.2;animation:mdFlow 12s linear infinite}
.md-flow span:nth-child(2){animation-name:mdFlow2}.md-flow span:nth-child(3){animation-name:mdFlow3}
.md-flow svg{width:18px;height:18px}
@keyframes mdFlow{0%,40%{opacity:.2}42%{opacity:1}46%,100%{opacity:.2}}
@keyframes mdFlow2{0%,43%{opacity:.2}45%{opacity:1}49%,100%{opacity:.2}}
@keyframes mdFlow3{0%,46%{opacity:.2}48%{opacity:1}52%,100%{opacity:.2}}
.md-app{background:#fff;border-radius:18px;padding:12px;box-shadow:0 24px 50px -20px rgba(0,0,0,.6);min-width:0}
.md-app-h{display:flex;align-items:center;gap:8px;padding:2px 4px 10px;border-bottom:1px solid #E4E8F0;margin-bottom:6px}
.md-app-h .logo-mark{width:24px;height:24px}
.md-app-h b{font-size:13px;color:#0A0E1A}
.md-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 6px;border-radius:10px;color:#0A0E1A}
.md-d{width:32px;height:32px;border-radius:9px;background:#1F5BFF;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:7.5px;line-height:1}
.md-d b{font-size:12px}
.md-t{min-width:0}.md-t b{display:block;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.md-t small{display:flex;align-items:center;gap:3px;font-size:10px;color:#5D6880}
.md-t small svg{width:10px;height:10px;color:#25D366}
.md-v{font-size:11.5px}
.md-row.new{animation:mdNew 12s ease-out infinite both;background:#EEF3FF}
@keyframes mdNew{0%,46%{opacity:0;transform:translateX(-14px);max-height:0;padding:0 6px}50%{opacity:1;transform:none;max-height:60px;padding:8px 6px;box-shadow:0 0 0 2px #1F5BFF}60%,92%{opacity:1;max-height:60px;padding:8px 6px;box-shadow:0 0 0 0 transparent}97%,100%{opacity:0;max-height:0;padding:0 6px}}
/* apresentações: a página mais bonita */
.ap3-hero{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:center;padding:40px 40px 40px 44px;border-radius:30px;overflow:hidden;color:#fff;background:radial-gradient(60% 80% at 85% 20%,rgba(122,162,255,.45),transparent 65%),radial-gradient(50% 70% at 10% 100%,rgba(47,107,255,.5),transparent 70%),linear-gradient(135deg,#0E1A3D 0%,#13286B 55%,#1A49D6 100%);box-shadow:0 30px 60px -30px rgba(14,26,61,.8);margin-bottom:28px}
.ap3-k{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:6px 12px;border-radius:99px}
.ap3-k svg{width:15px;height:15px}
.ap3-tx h1{font-size:clamp(30px,3.2vw,46px);font-weight:700;letter-spacing:-.045em;line-height:1.05;margin:16px 0 12px;color:#fff}
.ap3-tx h1 em{font-style:normal;background:linear-gradient(90deg,#A9C1FF,#fff);-webkit-background-clip:text;background-clip:text;color:transparent}
.ap3-tx p{font-size:16px;line-height:1.55;color:rgba(255,255,255,.85);max-width:46ch}
.ap3-cta{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:22px}
.ap3-go{background:#fff;color:#1A49D6;min-height:52px!important;padding:0 24px!important;font-size:16px!important;font-weight:700;box-shadow:0 16px 30px -12px rgba(0,0,0,.5)}
.ap3-go:hover{transform:translateY(-1px)}
.ap3-fmt{display:flex;gap:12px;font-size:13px;color:rgba(255,255,255,.8)}
.ap3-fmt span{display:inline-flex;align-items:center;gap:5px}.ap3-fmt svg{width:15px;height:15px}
.ap3-plan{display:inline-flex;align-items:center;gap:6px;margin-top:16px;font-size:12.5px;color:rgba(255,255,255,.65)}
.ap3-plan svg{width:14px;height:14px}
.ap3-art{position:relative;height:300px;perspective:1200px}
.ap3-s{position:absolute;width:74%;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 40px 70px -25px rgba(0,0,0,.75);border:1px solid rgba(255,255,255,.18);transform-style:preserve-3d;transition:transform .4s}
.ap3-s svg{display:block;width:100%;height:auto}
.ap3-s.s1{left:2%;top:96px;z-index:3;transform:rotateY(-14deg) rotateZ(-2deg)}
.ap3-s.s2{left:16%;top:46px;z-index:2;transform:rotateY(-14deg) rotateZ(1deg);opacity:.92}
.ap3-s.s3{left:30%;top:0;z-index:1;transform:rotateY(-14deg) rotateZ(4deg);opacity:.8}
.ap3-hero:hover .ap3-s.s1{transform:rotateY(-6deg) rotateZ(-3deg) translateY(-6px)}
.ap3-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:6px 2px 14px}
.ap3-h h2{font-size:21px;font-weight:700;letter-spacing:-.03em}
.ap3-h p{font-size:14px;color:var(--muted)}
.ap3-tpls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:30px}
.ap3-tpl{display:flex;flex-direction:column;text-align:left;padding:0;border:0;border-radius:22px;overflow:hidden;background:var(--surface);box-shadow:var(--sh2);color:inherit;transition:transform .18s,box-shadow .18s}
.ap3-tpl:hover{transform:translateY(-4px);box-shadow:0 26px 50px -24px rgba(16,24,40,.35)}
.ap3-cv{display:block;aspect-ratio:16/9;overflow:hidden;border-bottom:1px solid var(--line)}
.ap3-cv svg{display:block;width:100%;height:100%}
.ap3-tb{display:flex;gap:12px;align-items:flex-start;padding:14px 16px 8px}
.ap3-ti{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 14%,transparent);color:var(--tc);flex:none}
.ap3-ti svg{width:18px;height:18px}
.ap3-tb b{display:block;font-size:15px}
.ap3-tb small{display:block;font-size:12.8px;color:var(--muted);line-height:1.4;margin-top:2px}
.ap3-use{display:inline-flex;align-items:center;gap:4px;margin:auto 16px 14px;font-size:13.5px;font-weight:700;color:var(--blue)}
.ap3-use svg{width:15px;height:15px;transition:transform .15s}
.ap3-tpl:hover .ap3-use svg{transform:translateX(3px)}
.ap3-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.ap3-card{background:var(--surface);border-radius:22px;box-shadow:var(--sh2);overflow:hidden;display:flex;flex-direction:column}
.ap3-thumb{position:relative;display:block;padding:0;border:0;background:#fff;aspect-ratio:16/9;overflow:hidden}
.ap3-thumb svg{display:block;width:100%;height:100%;transition:transform .3s}
.ap3-thumb:hover svg{transform:scale(1.03)}
.ap3-pg{position:absolute;left:10px;bottom:10px;font-size:11px;font-weight:700;background:rgba(10,14,26,.7);color:#fff;border-radius:7px;padding:3px 8px}
.ap3-play{position:absolute;right:12px;bottom:12px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--blue);box-shadow:0 8px 20px -8px rgba(0,0,0,.5);opacity:0;transition:opacity .2s}
.ap3-play svg{width:18px;height:18px}
.ap3-thumb:hover .ap3-play{opacity:1}
.ap3-info{padding:14px 16px 4px}
.ap3-info b{display:block;font-size:15px}.ap3-info small{display:block;font-size:12.8px;color:var(--muted);margin-top:2px}
.ap3-acts{display:flex;justify-content:space-between;align-items:center;padding:10px 16px 14px}
.ap3-empty{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:24px;border-radius:22px;background:var(--surface);box-shadow:var(--sh2);border:2px dashed var(--blue-line)}
.ap3-ei{width:56px;height:56px;border-radius:17px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue)}
.ap3-ei svg{width:28px;height:28px}
.ap3-empty>div{flex:1;min-width:220px}.ap3-empty b{font-size:16px}.ap3-empty p{font-size:14px;color:var(--muted);margin-top:2px}
/* planos com medalhas, compactos */
.pl3-cur{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 20px;border-radius:20px;background:linear-gradient(135deg,#2F6BFF,#1A49D6);color:#fff;margin-bottom:14px}
.pl3-cm .medal{width:40px;height:46px}
.pl3-ct small{display:block;font-size:12.5px;opacity:.8}.pl3-ct b{font-size:19px}.pl3-ct em{font-style:normal;font-weight:500;opacity:.8;font-size:15px}
.pl3-us{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap}
.pl3-us>span{background:rgba(255,255,255,.14);border-radius:12px;padding:8px 12px}
.pl3-us small{display:block;font-size:11.5px;opacity:.8}.pl3-us b{font-size:15px}
.pl3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.pl3-card{position:relative;display:flex;flex-direction:column;gap:8px;padding:20px;border-radius:22px;background:var(--surface);box-shadow:var(--sh2);border:2px solid transparent}
.pl3-card.hot{border-color:var(--blue);box-shadow:0 24px 50px -24px rgba(26,73,214,.6)}
.pl3-card.cur{border-color:var(--ok)}
.pl3-flag{position:absolute;top:-12px;right:18px;font-size:11.5px;font-weight:800;background:var(--blue);color:#fff;padding:4px 12px;border-radius:99px}
.pl3-top{display:flex;align-items:center;gap:12px}
.medal{width:44px;height:52px;flex:none}
.pl3-tier{font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.basico .pl3-tier{color:#A8693A}.pro .pl3-tier{color:#6E7B91}.empresa .pl3-tier{color:#B7862A}
.pl3-top h3{font-size:22px;font-weight:700;letter-spacing:-.03em}
.pl3-price{font-family:var(--f-display);font-size:34px;font-weight:700;letter-spacing:-.04em;line-height:1}
.pl3-price small{font-size:15px;font-weight:600;margin-right:3px;vertical-align:top}
.pl3-price span{font-size:14px;font-weight:500;color:var(--muted);letter-spacing:0}
.pl3-desc{font-size:13.5px;color:var(--muted);min-height:38px;margin:0}
.pl3-card ul{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.pl3-card li{display:flex;gap:9px;align-items:flex-start;font-size:13.8px;color:var(--ink)}
.pl3-card li svg{width:20px;height:20px;padding:4px;border-radius:50%;background:var(--ok);color:#fff;flex:none;box-sizing:border-box;stroke-width:3}
.pl3-card li b{font-weight:700}
.pl3-all{margin-top:4px}
.pl3-all summary{cursor:pointer;font-size:13.5px;font-weight:700;color:var(--blue-2);list-style:none;padding:6px 0}
.pl3-all summary::-webkit-details-marker{display:none}
.pl3-all[open] summary{margin-bottom:6px}
.pl3-btn{width:100%;margin-top:8px;background:var(--surface);border:1.5px solid var(--line-2);color:var(--ink)}
.pl3-card.hot .pl3-btn{background:var(--blue);color:#fff;border-color:var(--blue)}
.pl3-btn.cur{background:var(--ok-soft)!important;color:var(--ok)!important;border-color:transparent!important}

.pl3-cmp summary{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:700;font-size:15px;padding:12px 0;list-style:none;color:var(--ink)}
.pl3-cmp summary::-webkit-details-marker{display:none}

.pt-y{background:var(--ok)!important;color:#fff!important}
.pt-y svg{stroke-width:3}

@media (max-width:1180px){
  .dp4-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dd2-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.dd2-grid .w2{grid-column:span 2}

  .pl3{grid-template-columns:minmax(0,1fr)}
  .wa2{grid-template-columns:minmax(0,1fr)}
}

  .dp4-hero{grid-template-columns:minmax(0,1fr)}.dp4-hero-r{align-items:flex-start}.dp4-pills{justify-content:flex-start}

  .pl3-us{margin-left:0}
}

  *,*::before,*::after{animation:none!important;transition:none!important}

function toast(msg, kind = '', action) {
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.innerHTML = `<span>${msg}</span>` + (action ? `<button type="button" class="t-act">${esc(action.label)}</button>` : '');

  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), action ? 8000 : kind === 'err' ? 6500 : 3600);
}

const Files = {
  mem: new Map(), db: null,
  async open() {
    if (this.db !== null) return this.db;
    try { this.db = await new Promise((res, rej) => { const r = indexedDB.open('conexo-arquivos', 1); r.onupgradeneeded = () => r.result.createObjectStore('f'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
    catch { this.db = false; }
    return this.db;
  },
  async run(mode, fn) {
    const db = await this.open(); if (!db) return null;
    return new Promise((res, rej) => { const t = db.transaction('f', mode); const r = fn(t.objectStore('f')); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); });
  },
  async put(id, blob) { try { if (!(await this.open())) throw 0; await this.run('readwrite', s => s.put(blob, id)); } catch { this.mem.set(id, blob); } },
  async get(id) { if (this.mem.has(id)) return this.mem.get(id); try { return await this.run('readonly', s => s.get(id)); } catch { return null; } },
  async del(id) { this.mem.delete(id); try { await this.run('readwrite', s => s.delete(id)); } catch {} }
};
async function hashPw(pw, salt) {
  const data = new TextEncoder().encode(salt + ':' + pw);

  catch { let h = 0; for (const c of salt + ':' + pw) h = (h * 31 + c.charCodeAt(0)) | 0; return 'x' + h; }
}

function openCmd() {
  const o = openModal(`<div class="cmd-in">${ic('search')}<input id="cmdQ" placeholder="Buscar notas, fornecedores, páginas e ações…" autocomplete="off" aria-label="Buscar"><span class="kbd">Esc</span></div><div class="cmd-list" id="cmdList" role="listbox"></div>`, { label: 'Buscar', cls: 'cmd' });
  const q = $('#cmdQ', o); let sel = 0, items = [];
  const build = () => {
    const t = norm(q.value);
    const pages = Object.keys(VIEWS).filter(canSee).map(v => ({ g: 'Páginas', i: VIEWS[v][1], l: viewTitle(v), run: () => go(v) }));
    const acts = [canWrite() && { g: 'Ações', i: 'plus', l: 'Lançar nova nota', run: () => openForm() }, { g: 'Ações', i: 'pdf', l: 'Baixar PDF do painel', run: () => runReport('pdf', { r: range(), dep: S.dashDep }) }, { g: 'Ações', i: 'sheet', l: 'Baixar Excel do painel', run: () => runReport('xlsx', { r: range(), dep: S.dashDep }) }, { g: 'Ações', i: 'bot', l: 'Perguntar ao assistente', run: () => go('assistente') }].filter(Boolean);
    let res = [...acts, ...pages].filter(x => !t || norm(x.l).includes(t));
    if (t.length >= 2) {
      const fs = groupDim(notes().filter(n => norm(n.fornecedor).includes(t) || digits(n.cnpj).includes(digits(t) || '§')), 'fornecedor').slice(0, 4).map(g => ({ g: 'Fornecedores', i: 'truck', l: g.k, s: brl(g.total), run: () => { S.fornQ = g.k; go('fornecedores'); } }));
      const ns = notes().filter(n => [n.fornecedor, n.numero, n.descricao, n.cnpj, brlNum(n.valor)].some(v => norm(v).includes(t))).sort((a, b) => (b.dataEmissao || '').localeCompare(a.dataEmissao || '')).slice(0, 7).map(n => ({ g: 'Notas', i: 'receipt', l: `${n.fornecedor} · NF ${n.numero || 's/n'}`, s: brl(n.valor), run: () => openView(n.id) }));
      res = [...res, ...fs, ...ns];
    }
    items = res; sel = Math.min(sel, Math.max(0, items.length - 1));
    let lastG = '';
    $('#cmdList', o).innerHTML = items.length ? items.map((x, i) => { const head = x.g !== lastG ? `<div class="cmd-g">${x.g}</div>` : ''; lastG = x.g; return `${head}<button type="button" class="cmd-item" role="option" data-ci="${i}" aria-selected="${i === sel}">${ic(x.i)}<span>${esc(x.l)}</span>${x.s ? `<small>${esc(x.s)}</small>` : ''}</button>`; }).join('') : '<p class="empty-mini" style="padding:14px">Nada encontrado.</p>';
  };
  const run = i => { const x = items[i]; if (!x) return; closeModal(o); x.run(); };
  q.addEventListener('input', () => { sel = 0; build(); });
  q.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(items.length - 1, sel + 1); build(); $('[aria-selected="true"]', o)?.scrollIntoView({ block: 'nearest' }); }
    if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(0, sel - 1); build(); $('[aria-selected="true"]', o)?.scrollIntoView({ block: 'nearest' }); }
    if (e.key === 'Enter') { e.preventDefault(); run(sel); }
  });
  o.addEventListener('click', e => { const b = e.target.closest('[data-ci]'); if (b) run(+b.dataset.ci); });
  build(); setTimeout(() => q.focus(), 30);
}

function sparkSVG(vals, color = 'var(--c1)') {
  if (!vals.length) return '';
  const W = 120, H = 34, mx = Math.max(...vals, 1), mn = Math.min(...vals, 0), sp = mx - mn || 1;
  const pts = vals.map((v, i) => [vals.length === 1 ? W : i / (vals.length - 1) * W, H - 3 - (v - mn) / sp * (H - 8)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('');
  const gid = 'sg' + Math.random().toString(36).slice(2, 7);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path d="${d}L${W},${H}L0,${H}Z" fill="url(#${gid})"/><path d="${d}" fill="none" stroke="${color}" stroke-width="1.8" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}
function ringSVG(p) {

function hbarsHTML(groups, total, { limit = 6, attr = '', budgetFn = null, of = 'do total' } = {}) {

/* comparação justa: se o período inclui o mês corrente (incompleto), compara com o mesmo trecho do período anterior */
function prevComparable(r, base) {
  if (!r.prev) return [];
  const t = todayISO(), tk = todayKey(); const day = +t.slice(8, 10);
  const shift = monthsBetween(r.prev.to, r.to).length - 1;
  const elapsedEnd = r.to > tk ? tk : r.to; const cut = shiftMonth(elapsedEnd, -shift);
  const partial = r.to >= tk;
  return base.filter(n => n.mesRef >= r.prev.from && n.mesRef <= r.prev.to && (n.mesRef < cut || (n.mesRef === cut && (!partial || +(n.dataEmissao || '0000-00-31').slice(8, 10) <= day))));
}
function dueListHTML(limit = 6, withPay = false) {

  if (!list.length) return '<p class="empty-mini">Nada a pagar. Todas as notas estão quitadas.</p>';
  return '<div class="due">' + list.map(n => dueRow(n, withPay)).join('') + '</div>';
}
function dueRow(n, withPay = false) {

/* =========================================================
   INSIGHTS AUTOMÁTICOS
   ========================================================= */
function insights({ r = range(), dep = '' } = {}) {
  const out = []; const base = notes().filter(n => !dep || n.depId === dep);
  const list = base.filter(n => inR(n, r)); const total = sum(list);
  const prev = prevComparable(r, base); const pt = sum(prev);
  const t = todayISO(), tk = todayKey();
  // vencidas
  const venc = base.filter(n => n.aprov === 'aprovada' && payStatus(n) === 'vencida');
  if (venc.length) out.push({ k: 'bad', i: 'alert', t: `${plural(venc.length, 'nota vencida', 'notas vencidas')} somando ${brl(sum(venc))}`, s: 'Regularize em Contas a pagar para evitar juros e multa.', go: 'pagar', w: 100 });
  // orçamento por departamento
  const months = Math.max(1, monthsOf(r).filter(k => k <= tk).length);
  const deps = active('departamentos').filter(d => d.orcamento > 0 && (!dep || d.id === dep)).map(d => { const s = sum(list.filter(n => n.depId === d.id)); return { d, s, p: s / (d.orcamento * months) * 100 }; }).sort((a, b) => b.p - a.p);
  if (deps[0] && deps[0].p > 100) out.push({ k: 'bad', i: 'target', t: `${deps[0].d.nome} passou do orçamento (${Math.round(deps[0].p)}%)`, s: `${brl(deps[0].s)} gastos para ${brl(deps[0].d.orcamento * months)} previstos no período.`, dep: deps[0].d.id, w: 90 });
  else if (deps[0] && deps[0].p >= 85) out.push({ k: 'warn', i: 'target', t: `${deps[0].d.nome} já usou ${Math.round(deps[0].p)}% do orçamento`, s: `Restam ${brl(deps[0].d.orcamento * months - deps[0].s)} no período.`, dep: deps[0].d.id, w: 70 });
  // contas recorrentes ainda não lançadas (mês final do período)
  const endK = r.to > tk ? tk : r.to;
  if (r.mode !== 'tudo') {
    const prev3 = [1, 2, 3].map(i => shiftMonth(endK, -i));
    const byF = new Map(); base.forEach(n => { if (prev3.includes(n.mesRef)) { const k = fornKey(n); const o = byF.get(k) || { months: new Set(), days: [], n }; o.months.add(n.mesRef); o.days.push(+(n.dataEmissao || '0000-00-15').slice(8, 10)); o.n = n; byF.set(k, o); } });

    const day = endK === tk ? +t.slice(8, 10) : 31;
    const missing = [...byF.entries()].filter(([k, o]) => o.months.size === 3 && !thisMonth.has(k)).map(([k, o]) => ({ o, typ: o.days.sort((a, b) => a - b)[Math.floor(o.days.length / 2)] })).filter(x => day > x.typ + 2).sort((a, b) => a.typ - b.typ);
    if (missing.length) out.push({ k: 'warn', i: 'repeat', t: missing.length === 1 ? `Conta recorrente não lançada: ${missing[0].o.n.fornecedor}` : `${missing.length} contas recorrentes não lançadas em ${monthName(endK)}`, s: missing.length === 1 ? `Costuma chegar até o dia ${missing[0].typ}. Última: ${brl(missing[0].o.n.valor)}.` : missing.slice(0, 3).map(x => x.o.n.fornecedor).join(', ') + (missing.length > 3 ? '…' : ''), w: 65 });
  }

  }
  // categoria que mais cresceu
  if (pt > 0) {
    const cur = new Map(groupDim(list, 'categoria').map(g => [g.id, g.total])), pv = new Map(groupDim(prev, 'categoria').map(g => [g.id, g.total]));
    const best = [...cur.entries()].map(([id, v]) => ({ id, v, p: pv.get(id) || 0 })).filter(x => x.p > 0 && x.v - x.p >= 1000 && (x.v - x.p) / x.p >= .2).sort((a, b) => (b.v - b.p) - (a.v - a.p))[0];

  }
  // aprovações
  if (isAdmin() && !dep) { const p = pendentes(); if (p.length) out.push({ k: '', i: 'approve', t: `${plural(p.length, 'nota aguarda', 'notas aguardam')} sua aprovação`, s: `${brl(sum(p))} lançados pela equipe.`, go: 'aprovacoes', w: 75 }); }

const modalStack = [];
function openModal(html, { narrow = false, cls = '', onClose = null, label = '' } = {}) {

  o.innerHTML = `<div class="sheet${narrow ? ' narrow' : ''}${cls ? ' ' + cls : ''}" role="dialog" aria-modal="true" aria-label="${esc(label)}">${html}</div>`;
  o._onClose = onClose;

}
function closeModal(o) {

function closeAllModals() { [...modalStack].forEach(closeModal); }
addEventListener('keydown', e => {

function mdLite(t) {
  const lines = esc(t).split(/\n/); let html = '', inList = false;
  for (const raw of lines) {
    const l = raw.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    if (/^\s*[-•*]\s+/.test(l)) { if (!inList) { html += '<ul>'; inList = true; } html += '<li>' + l.replace(/^\s*[-•*]\s+/, '') + '</li>'; continue; }
    if (inList) { html += '</ul>'; inList = false; }
    if (l.trim()) html += '<p>' + l.replace(/^#+\s*/, '') + '</p>';
  }
  if (inList) html += '</ul>';
  return html;
}

function auraFacts() {

  const restante = hist.length ? hist.reduce((a, h) => a + Math.max(0, h.tot - h.upTo), 0) / hist.length : 0;

/* respostas calculadas pelo próprio sistema (funcionam sem IA) */
function localAnswer(k) {
  const f = auraFacts(); const L = [];
  const top3 = insights({ r: range({ mode: 'mes', ref: f.tk }) }).filter(x => x.k !== 'ok').slice(0, 3);
  if (k === 'briefing') {
    L.push(`**Briefing de ${dateBR(f.t)}**`);
    L.push(`- Contas: ${f.venc.length ? `**${plural(f.venc.length, 'vencida', 'vencidas')}** (${brl(sum(f.venc))}) e ` : ''}${plural(f.week.length, 'conta vence', 'contas vencem')} nos próximos 7 dias (${brl(sum(f.week))}).`);
    if (f.pend.length) L.push(`- Aprovações: **${plural(f.pend.length, 'nota aguarda', 'notas aguardam')}** sua análise (${brl(sum(f.pend))}).`);
    L.push(`- Mês: ${brl(f.totM)} gastos até hoje${f.bud ? `, **${Math.round(f.bp)}%** do orçamento` : ''}. Projeção de fechamento: **${brl(f.proj)}**${f.bud ? ` (${Math.round(f.pp)}% do orçamento)` : ''}.`);
    if (top3.length) { L.push('**Atenção:**'); top3.forEach(x => L.push(`- ${x.t}`)); }
  } else if (k === 'projecao') {
    L.push(`**Projeção para ${monthLabel(f.tk)}**`);
    L.push(`Até o dia ${f.day} foram ${brl(f.totM)}. Nos últimos ${plural(f.hist.length, 'mês', 'meses')}, depois deste dia ainda entraram em média **${brl(f.restante)}**. A estimativa de fechamento é **${brl(f.proj)}**.`);
    if (f.bud) L.push(f.pp > 100 ? `Isso passa do orçamento de ${brl(f.bud)} em **${brl(f.proj - f.bud)}** (${Math.round(f.pp)}%).` : `Fica dentro do orçamento de ${brl(f.bud)}, com folga de **${brl(f.bud - f.proj)}** (${Math.round(f.pp)}%).`);
    const press = f.deps.filter(x => x.p >= 85).slice(0, 3);
    if (press.length) { L.push('**Departamentos que mais pressionam:**'); press.forEach(x => L.push(`- ${x.d.nome}: ${Math.round(x.p)}% do orçamento mensal já usado (${brl(x.s)} de ${brl(x.d.orcamento)}).`)); }
  } else if (k === 'economia') {
    const tk = f.tk, a = [1, 2, 3].map(i => shiftMonth(tk, -i)), b = [4, 5, 6].map(i => shiftMonth(tk, -i));
    const ga = new Map(groupDim(notes().filter(n => a.includes(n.mesRef)), 'categoria').map(g => [g.id, g.total])), gb = new Map(groupDim(notes().filter(n => b.includes(n.mesRef)), 'categoria').map(g => [g.id, g.total]));
    const grow = [...ga.entries()].map(([id, v]) => ({ id, v, p: gb.get(id) || 0 })).filter(x => x.p > 0 && x.v > x.p * 1.12).sort((x, y) => (y.v - y.p) - (x.v - x.p)).slice(0, 3);
    const last3 = notes().filter(n => a.includes(n.mesRef)); const fs = groupDim(last3, 'fornecedor').slice(0, 3);
    const soft = sum(last3.filter(n => /software|assinatura/i.test(catName(n.categoriaId)))) / 3;
    L.push('**Oportunidades de economia (últimos 3 meses)**');
    grow.forEach(x => L.push(`- **${catName(x.id)}** subiu ${Math.round((x.v - x.p) / x.p * 100)}% contra o trimestre anterior (+${brl((x.v - x.p) / 3)} por mês). Vale revisar contratos e volumes.`));
    if (fs.length) L.push(`- Renegociar 8% com os 3 maiores fornecedores (${fs.map(g => g.k).join(', ')}) economizaria cerca de **${brl(fs.reduce((s, g) => s + g.total, 0) / 3 * .08)} por mês**.`);
    if (soft > 0) L.push(`- Software e assinaturas custam em média **${brl(soft)} por mês**. Revise licenças sem uso e planos anuais com desconto.`);
    if (L.length === 1) L.push('- Não encontrei aumentos relevantes. Os gastos estão estáveis.');
  } else if (k === 'auditoria') {
    const from = shiftMonth(f.tk, -5), base = notes().filter(n => n.mesRef >= from);
    const seen = new Map(), dups = [];
    base.forEach(n => { const key = fornKey(n) + '|' + (n.numero || '') + '|' + n.valor.toFixed(2); if (n.numero && seen.has(key)) dups.push([seen.get(key), n]); else seen.set(key, n); });
    const badCnpj = base.filter(n => digits(n.cnpj).length === 14 && !cnpjValido(n.cnpj));
    const semCnpj = base.filter(n => !digits(n.cnpj)), semArq = f.mes.filter(n => !n.arquivo), semCat = base.filter(n => !n.categoriaId);
    const odd = base.map(n => { const h = notes().filter(x => x.id !== n.id && fornKey(x) === fornKey(n) && x.mesRef < n.mesRef); if (h.length < 3) return null; const avg = sum(h) / h.length; return n.valor > avg * 2.2 && n.valor - avg > 1500 ? { n, avg } : null; }).filter(Boolean).slice(0, 3);
    L.push(`**Auditoria dos últimos 6 meses** (${plural(base.length, 'nota', 'notas')})`);
    L.push(`- Possíveis duplicidades: **${dups.length}**${dups.length ? ' · ' + dups.slice(0, 3).map(([x]) => `${x.fornecedor} NF ${x.numero}`).join(', ') : ''}.`);
    L.push(`- CNPJ com dígito inválido: **${badCnpj.length}** · notas sem CNPJ: **${semCnpj.length}**.`);
    L.push(`- Valores fora do padrão: **${odd.length}**${odd.length ? ' · ' + odd.map(o => `${o.n.fornecedor} ${brl(o.n.valor)} (média ${brl(o.avg)})`).join('; ') : ''}.`);
    L.push(`- Notas do mês sem arquivo anexado: **${semArq.length}**${semArq.length ? '. Anexe antes do fechamento para a contabilidade' : ''}.`);
    if (semCat.length) L.push(`- Notas sem categoria: **${semCat.length}**.`);
  } else if (k === 'diretoria') {
    const dg = groupDim(f.mes, 'departamento').slice(0, 3), cg = groupDim(f.mes, 'categoria').slice(0, 3);
    L.push(`**Resumo executivo · ${monthLabel(f.tk)} (até ${dateBR(f.t)})**`);
    L.push(`Despesas de **${brl(f.totM)}**${f.prevC ? `, ${f.totM >= f.prevC ? 'alta' : 'queda'} de ${Math.abs((f.totM - f.prevC) / f.prevC * 100).toFixed(0)}% sobre o mesmo trecho do mês anterior` : ''}${f.bud ? `, com ${Math.round(f.bp)}% do orçamento consumido` : ''}. Projeção de fechamento em ${brl(f.proj)}.`);
    if (dg.length) L.push(`- Maiores áreas: ${dg.map(g => `${g.k} (${brl(g.total)})`).join(', ')}.`);
    if (cg.length) L.push(`- Principais naturezas de gasto: ${cg.map(g => `${g.k} (${pctTxt(g.total, f.totM, 0)})`).join(', ')}.`);
    L.push(`- Financeiro: ${brl(sum(f.open))} em aberto${f.venc.length ? `, sendo ${brl(sum(f.venc))} vencidos` : ', sem atrasos'}.`);
    if (top3.length) L.push(`- Pontos de atenção: ${top3.map(x => x.t.toLowerCase()).join('; ')}.`);
  }
  return L.join('\n');
}

function speak(text) {

    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text).replace(/\*\*/g, '').replace(/^- /gm, '').replace(/R\$\s?/g, 'R$ ').slice(0, 1200));
    u.lang = 'pt-BR'; u.rate = 1.04; u.pitch = 1.02;

}
function typeOut(el, text, done) {
  if (reduceMotion) { el.innerHTML = mdLite(text); done(); return; }
  let i = 0; const step = Math.max(2, Math.round(text.length / 90));
  const tm = setInterval(() => { i = Math.min(text.length, i + step); if (!el.isConnected) { clearInterval(tm); done(); return; } el.innerHTML = mdLite(text.slice(0, i)) + (i < text.length ? '<span class="caret"></span>' : ''); const lg = $('#msgs'); if (lg) lg.scrollTop = lg.scrollHeight; if (i >= text.length) { clearInterval(tm); done(); } }, 16);
}

async function ask(q, { action = '' } = {}) {
  q = String(q || '').trim(); if (!q || askCtl) return;

  const ta = $('#askIn'); if (ta) { ta.value = ''; ta.style.height = 'auto'; }
  msgs.insertAdjacentHTML('beforeend', `<div class="log-e bot" id="pending"><span class="who">${ic('sparkle')}</span><div class="log-h"><span>A.N.A.B</span><time>${nowHM()}</time></div><div class="log-b"><span class="typing"><i></i><i></i><i></i></span> <span style="opacity:.6">cruzando os dados…</span></div></div>`);

  const finish = (text, offline) => { const p = $('#pending'); if (p) p.removeAttribute('id'); askCtl = null; if (btn && btn.isConnected) btn.disabled = false; $$('[data-aura]').forEach(b => b.disabled = false); if (text) { S.chat.push({ role: 'assistant', content: text, t: nowHM() }); speak(text); } setAura(offline ? 'offline' : 'idle', offline ? 'modo local' : 'online'); };

    const msg = 'Estou em **modo local**: as perguntas livres funcionam quando o Conexo está aberto dentro do Claude. Enquanto isso, use as **análises rápidas** acima (briefing, projeção, economia, auditoria e resumo executivo), que eu calculo direto dos dados.';

  }

async function pickImage(kind) {

    catch (e) { toast(esc(e.message || 'Não consegui usar essa imagem.'), 'err'); }
  };

async function squareImage(file, mode) {
  let src;
  try { src = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch { src = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Não consegui abrir essa imagem. Use JPG ou PNG.')); i.src = URL.createObjectURL(file); }); }
  const w = src.width || src.naturalWidth, h = src.height || src.naturalHeight, Z = 256;
  const c = document.createElement('canvas'); c.width = c.height = Z; const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, Z, Z);
  const k = mode === 'cover' ? Math.max(Z / w, Z / h) : Math.min(Z * .86 / w, Z * .86 / h);
  ctx.drawImage(src, (Z - w * k) / 2, (Z - h * k) / 2, w * k, h * k);
  return c.toDataURL('image/jpeg', .86);
}
