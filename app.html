  .cards{display:flex}
  .dep-grid{grid-template-columns:minmax(0,1fr)}
  .overlay{padding:0;align-items:flex-end}
  .sheet,.sheet.narrow{border-radius:20px 20px 0 0;max-height:94%;width:100%}
  .sheet.cmd{margin-top:0;align-self:flex-end}
  .form-grid{grid-template-columns:minmax(0,1fr)}
  .member{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"a w r" "a x x"}
  .member .avatar{grid-area:a;align-self:start}
  .member .who{grid-area:w}
  .member .role{grid-area:r}
  .member .acts{grid-area:x}
  .le-row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"n x" "b b"}
  .le-row .in{grid-area:n}
  .le-row .money{grid-area:b}
  .le-row .icon-btn{grid-area:x}
  .le-row.nb{grid-template-areas:"n x"}
  .cal .d{min-height:46px;padding:4px}
  .hc{padding:4px;border-radius:8px}
  .hc .hv{font-size:9px}
  .hc .hn{display:none}
  .hcal{gap:3px}
  .cal .d .amt{font-size:9px}
  .page-head h1 .hic{width:34px;height:34px}
}
@media (max-width:440px){
  .auth .row2{grid-template-columns:minmax(0,1fr)}
  .fields{grid-template-columns:minmax(0,1fr)}
  .roles-help{grid-template-columns:minmax(0,1fr)}
  .kpi .k-v{font-size:19px}
  .theme-pick .sw{height:42px}
}
/* =================== NOVIDADES: caixa de entrada, fluxo de caixa, reembolsos, conciliação, planos =================== */
svg.inl{width:14px;height:14px;vertical-align:-2px;display:inline-block}
.mini-tag{display:inline-flex;align-items:center;font-size:10.5px;font-weight:700;letter-spacing:.02em;padding:1px 7px;border-radius:6px;background:var(--blue-soft);color:var(--blue-2);border:1px solid var(--blue-line);margin-right:6px;vertical-align:1px;white-space:nowrap}
.icon-btn.sm{width:32px;height:32px;border-radius:9px}
.icon-btn.sm svg{width:15px;height:15px}
.avatar.sm{--s:30px}
.code-in{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.code-in label{font-size:12.5px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.code-in label svg{width:15px;height:15px;color:var(--blue-2)}
.code-in .in{font-size:12.5px}
.code-in.in-chan{flex-direction:row;margin:0}
.code-in.in-chan .in{min-height:36px}
.code-res{display:flex;gap:10px;align-items:flex-start;font-size:13px;border-radius:11px;padding:10px 12px;background:var(--ok-soft);color:var(--ink-2);border:1px solid color-mix(in srgb,var(--ok) 35%,transparent);flex-wrap:wrap}
.code-res>svg{width:17px;height:17px;color:var(--ok);flex:none;margin-top:1px}
.code-res>span{flex:1;min-width:180px}
.code-res b{color:var(--ink)}
.code-res small{display:block;color:var(--muted);font-size:12px;margin-top:2px;word-break:break-all}
.code-res.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}.code-res.warn>svg{color:var(--warn)}
.code-res.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.rep-row{display:flex;gap:12px;align-items:center;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--bg-2);cursor:pointer}
.rep-row b{display:block;font-size:13.5px;font-weight:600}
.rep-row small{display:block;font-size:12.5px;color:var(--muted);margin-top:1px;line-height:1.4}
.rep-row>span:nth-child(2){flex:1;min-width:0}
.seg.payer{width:100%}
.seg.payer button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.seg.payer button svg{width:15px;height:15px}
.seg.payer button[aria-pressed="true"]{color:var(--blue-2)}
/* canais */
.chan-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.chan{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:var(--shadow);overflow:hidden}
.chan p{font-size:13px;color:var(--muted);line-height:1.45;flex:1}
.chan-h{display:flex;gap:11px;align-items:center}
.chan-h b{display:block;font-size:14.5px}
.chan-h small{display:block;font-size:12px;font-weight:600}
.chan-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue-2);border:1px solid var(--blue-line);flex:none}
.chan-ic svg{width:19px;height:19px}
.chan-ic.wa{background:rgba(47,208,138,.12);color:var(--ok);border-color:rgba(47,208,138,.35)}
.chan-id{font-size:12.5px;padding:8px 10px;border-radius:10px;background:var(--bg-2);border:1px solid var(--line);color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chan-acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chan.locked>*:not(.chan-lock){opacity:.35;pointer-events:none}
.chan-lock{position:absolute;top:12px;right:12px;display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--surface-3);color:var(--ink-2);border:1px solid var(--line-2);z-index:2}
.chan-lock svg{width:12px;height:12px}
/* caixa de entrada */
.ib-bar .chips{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;max-width:100%}
.ib-bar .chips::-webkit-scrollbar{display:none}
.ib{display:flex;flex-direction:column;gap:8px}
.ibx{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.ibx.lancado,.ibx.descartado{opacity:.72}
.ibx-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface-3);color:var(--ink-2);flex:none;align-self:start}
.ibx-ic svg{width:19px;height:19px}
.ibx-ic.whatsapp{background:rgba(47,208,138,.12);color:var(--ok)}
.ibx-ic.email,.ibx-ic.xml{background:var(--blue-soft);color:var(--blue-2)}
.ibx-ic.sefaz{background:var(--warn-soft);color:var(--warn)}
.ibx-main{min-width:0;display:flex;flex-direction:column;gap:3px}
.ibx-top{display:flex;gap:10px;align-items:baseline;justify-content:space-between}
.ibx-top b{font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ibx-v{font-weight:600;white-space:nowrap}
.ibx small{font-size:12.5px}
.ibx-msg{font-size:13px;color:var(--ink-2);font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ibx-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.ibx-tags .tag svg{width:12px;height:12px}
.ibx-acts{display:flex;gap:6px;align-items:center}
/* simulador de WhatsApp */
.sheet.wide-sim{width:min(860px,100%)}
.wa-wrap{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:22px;align-items:start}
.wa-side{display:flex;flex-direction:column;gap:14px}
.phone{border-radius:30px;border:1px solid var(--line-2);background:#0B141A;overflow:hidden;display:flex;flex-direction:column;height:min(600px,70vh);box-shadow:0 30px 60px -30px #000;color:#E9EDEF}
.ph-top{display:flex;gap:10px;align-items:center;padding:12px 14px;background:#111B21;border-bottom:1px solid #1F2C33}
.ph-top b{display:block;font-size:14px}.ph-top small{display:block;font-size:11.5px;color:#8696A0}
.ph-av{width:34px;height:34px;border-radius:50%;overflow:hidden;flex:none}
.ph-av .logo-mark{width:34px;height:34px}
.ph-body{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:6px;background:radial-gradient(circle at 20% 10%,rgba(47,107,255,.06),transparent 40%),#0B141A}
.ph-m{position:relative;max-width:84%;align-self:flex-start;background:#202C33;border-radius:4px 12px 12px 12px;padding:7px 10px 18px;font-size:13.5px;line-height:1.42;color:#E9EDEF;min-width:90px}
.ph-m.me{align-self:flex-end;background:#005C4B;border-radius:12px 4px 12px 12px}
.ph-m img{display:block;max-width:220px;max-height:240px;border-radius:8px;margin-bottom:4px}
.ph-m time{position:absolute;right:8px;bottom:3px;font-size:10.5px;color:rgba(233,237,239,.6)}
.ph-m .typing i{background:#8696A0}
.ph-quick{display:flex;gap:6px;padding:8px 10px 0;overflow-x:auto;scrollbar-width:none;background:#0B141A}
.ph-quick button{flex:none;border:1px solid #2A3942;background:#111B21;color:#53BDEB;border-radius:99px;padding:6px 11px;font-size:12px;font-weight:600}
.ph-in{display:flex;gap:8px;align-items:center;padding:10px;background:#0B141A}
.ph-in input{flex:1;min-width:0;border:0;border-radius:99px;background:#202C33;color:#E9EDEF;padding:10px 14px;font-size:14px;outline:none}
.ph-in button,.ph-cam{width:40px;height:40px;border-radius:50%;border:0;display:grid;place-items:center;background:#00A884;color:#fff;flex:none;cursor:pointer}
.ph-cam{background:#202C33;color:#8696A0}
.ph-in svg,.ph-cam svg{width:19px;height:19px}
.mail-card{border:1px solid var(--line-2);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;background:var(--bg-2);font-size:13.5px}
.mail-card small{display:inline-block;width:62px}
.mail-card p{margin-top:6px;color:var(--ink-2)}
.mail-att{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.mail-att span{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;padding:6px 10px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface)}
.mail-att svg{width:15px;height:15px;color:var(--blue-2)}
.drop-mini{display:flex;gap:10px;align-items:center;justify-content:center;padding:18px;border:1.5px dashed var(--line-2);border-radius:14px;cursor:pointer;color:var(--ink-2);font-weight:600;font-size:13.5px;background:var(--bg-2)}
.drop-mini:hover{border-color:var(--blue)}
.drop-mini svg{width:18px;height:18px;color:var(--blue-2)}
/* fluxo de caixa */
.cx-answer{background:linear-gradient(160deg,color-mix(in srgb,var(--ok) 13%,var(--surface)),var(--surface) 60%)}
.cx-answer.bad{background:linear-gradient(160deg,color-mix(in srgb,var(--bad) 13%,var(--surface)),var(--surface) 60%)}
.cx-q{color:var(--muted);font-size:14px}
.cx-big{font-family:var(--f-display);font-size:clamp(22px,2vw,28px);font-weight:600;letter-spacing:-.03em;line-height:1.2;margin-top:2px}
.cx-answer.ok .cx-big{color:var(--ok)}.cx-answer.bad .cx-big{color:var(--bad)}
.cx-big b{color:var(--ink);font-weight:700;white-space:nowrap}
.cx-split{display:flex;gap:8px 16px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--muted)}
.cx-split span{display:inline-flex;gap:5px;align-items:center}
.cx-split svg{width:14px;height:14px}
.cx-split b{color:var(--ink);font-family:var(--f-mono)}
.tl{display:flex;flex-direction:column}
.tl-row{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;color:inherit;text-align:left;width:100%}
.tl-row:first-child{border-top:0;padding-top:0}
.tl-d{width:40px;height:40px;border-radius:10px;background:var(--bg-2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.tl-d b{font-size:14px;font-family:var(--f-display)}.tl-d span{font-size:10px;color:var(--muted);text-transform:uppercase;margin-top:2px}
.tl-ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center}
.tl-ic svg{width:14px;height:14px}
.tl-row.in .tl-ic{background:var(--ok-soft);color:var(--ok)}
.tl-row.out .tl-ic{background:var(--blue-soft);color:var(--blue-2)}
.tl-row.late .tl-d{border-color:var(--bad);color:var(--bad)}
.tl-tx{min-width:0}
.tl-tx b{display:block;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-tx small{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-v{font-family:var(--f-mono);font-weight:600;font-size:13px;white-space:nowrap}
.tl-row.in .tl-v{color:var(--ok)}
.tl-s{font-size:11.5px;color:var(--muted);white-space:nowrap;min-width:84px;text-align:right}
.fx{display:flex;flex-direction:column}
.fx-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.fx-row:first-child{border-top:0;padding-top:0}
.fx-row.off{opacity:.5}
.fx-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue-2)}
.fx-ic.receita{background:var(--ok-soft);color:var(--ok)}
.fx-ic svg{width:16px;height:16px}
.fx-tx{min-width:0}
.fx-tx b{display:block;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx-tx small{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx-v{font-family:var(--f-mono);font-weight:600;font-size:13.5px;text-align:right;white-space:nowrap}
.fx-v small{display:block;font-family:var(--f-body);font-size:11px;font-weight:500;color:var(--warn)}
/* reembolsos */
.rb{display:flex;flex-direction:column}
.rb-row{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.rb-row:first-child{border-top:0;padding-top:0}
.rb-main{all:unset;cursor:pointer;display:flex;gap:11px;align-items:center;flex:1;min-width:0}
.rb-main:hover b{color:var(--blue-2)}
.rb-tx{min-width:0}
.rb-tx b{display:block;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rb-tx small{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rb-row .v{font-weight:600;font-size:13.5px;white-space:nowrap}
.rb-acts{display:flex;gap:6px;align-items:center;flex:none}
.rb-people{display:flex;flex-direction:column;gap:10px}
.rb-p{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"a n v" "a b b";gap:4px 11px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg-2)}
.rb-p .avatar{grid-area:a}.rb-p>div{grid-area:n;min-width:0}.rb-p>.mono{grid-area:v;font-weight:600}.rb-p>.btn{grid-area:b;justify-self:start;margin-top:4px}
.rb-p b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rb-p small{font-size:12px;color:var(--muted)}
/* conciliação */
.cc{display:flex;flex-direction:column;gap:6px}
.cc-row{display:grid;grid-template-columns:46px minmax(0,1.1fr) 22px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;background:var(--surface);border:1px solid var(--line);border-radius:13px}
.cc-row.sug{border-color:var(--blue-line)}
.cc-row.none{border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.cc-row.ign{opacity:.55}
.cc-d{font-size:12.5px;color:var(--muted)}
.cc-tx{min-width:0}
.cc-tx b{display:block;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--f-mono);letter-spacing:-.01em}
.cc-tx small{font-size:13px;font-weight:600}
.cc-arrow{color:var(--blue-2);display:grid;place-items:center}
.cc-arrow svg{width:16px;height:16px}
.cc-m{all:unset;cursor:pointer;min-width:0;display:block}
div.cc-m{cursor:default}
.cc-m b{display:block;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-m small{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap;margin-top:2px}
.cc-acts{display:flex;gap:6px;justify-content:flex-end}
.cc-okt{display:inline-flex;gap:5px;align-items:center;font-size:12.5px;font-weight:600}
.cc-okt svg{width:15px;height:15px}
/* planos */
.usage{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.usage small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.usage b{display:block;font-family:var(--f-display);font-size:19px;font-weight:600;margin:3px 0 6px}
.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.plan{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 18px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.plan.hot{border-color:var(--blue);box-shadow:var(--glow)}
.plan.cur{outline:2px solid var(--ok);outline-offset:-1px}
.plan h3{font-size:18px}
.plan>p{font-size:13px;line-height:1.4;min-height:36px}
.plan-flag{position:absolute;top:-10px;right:16px;font-size:11px;font-weight:700;background:var(--blue);color:#fff;padding:3px 10px;border-radius:99px}
.plan-price{font-family:var(--f-display);font-size:34px;font-weight:700;letter-spacing:-.04em;line-height:1}
.plan-price small{font-size:15px;font-weight:600;color:var(--muted);margin-right:3px;vertical-align:12px}
.plan-price span{font-size:14px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:2px}
.plan ul{list-style:none;display:flex;flex-direction:column;gap:7px;flex:1;margin:6px 0 8px;padding:0}
.plan li{display:flex;gap:8px;font-size:13px;color:var(--ink-2);line-height:1.35}
.plan li svg{width:15px;height:15px;color:var(--ok);flex:none;margin-top:1px}
.locked-page .ill{background:var(--surface-3);color:var(--ink-2);border-color:var(--line-2)}
/* alertas */
.al-list{display:flex;flex-direction:column;gap:8px}
.al-list .rep-row select{flex:none}
.al-prev{padding:16px;border-radius:14px;background:#0B141A;border:1px solid var(--line-2)}
.al-prev .ph-m{max-width:min(440px,100%);padding-bottom:8px}
.ct-map{display:flex;flex-direction:column;gap:6px}
.ct-map label{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:10px;align-items:center;font-size:13.5px}
.ct-map label.sep{margin-top:10px;padding-top:12px;border-top:1px solid var(--line)}
.ct-map span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* empresas */
.co-list{display:flex;flex-direction:column;gap:6px}
.co-it{display:flex;gap:12px;align-items:center;padding:11px 12px;border:1px solid var(--line);border-radius:13px;background:var(--bg-2);text-align:left;color:inherit;width:100%}
.co-it:hover{border-color:var(--blue-line)}
.co-it.cur{border-color:var(--blue);background:var(--blue-soft)}
.co-it>span:nth-child(2){flex:1;min-width:0}
.co-it b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.co-it small{display:block;font-size:12.5px;color:var(--muted)}
.co-it>svg{width:16px;height:16px;color:var(--muted)}
/* app instalável */
.inst-ic{width:44px;height:44px;border-radius:13px;overflow:hidden;flex:none;display:block}
.inst-ic .logo-mark{width:44px;height:44px;display:block}
.inst-steps{display:flex;flex-direction:column;gap:10px}
.inst-steps section{border:1px solid var(--line);border-radius:13px;padding:13px 14px;background:var(--bg-2)}
.inst-steps section.on{border-color:var(--blue)}
.inst-steps b{font-size:14px}
.inst-steps ol{margin:8px 0 0 18px;display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--ink-2)}
.inst-banner{display:flex;gap:11px;align-items:center;padding:11px 12px;border:1px solid var(--blue-line);background:var(--blue-soft);border-radius:14px;margin-bottom:14px}
.inst-banner .inst-ic,.inst-banner .inst-ic .logo-mark{width:36px;height:36px;border-radius:10px}
.inst-banner>span:nth-child(2){flex:1;min-width:0}
.inst-banner b{display:block;font-size:13.5px}.inst-banner small{display:block;font-size:12px;color:var(--muted)}
.wa-steps{margin:0 0 0 18px;display:flex;flex-direction:column;gap:8px;font-size:13.5px;color:var(--ink-2);line-height:1.45}
.ph-m img{width:200px;max-width:100%;height:auto}

.a2-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;color:var(--ink-2);padding:6px 10px;border-radius:10px;font-size:12.5px;font-weight:600}

.a2-orb{width:150px;height:150px;color:var(--a2c);transition:width .35s,height .35s}
.a2-orb .orb{width:100%;height:100%;overflow:visible}
.a2-orb .o-r1,.a2-orb .o-r2,.a2-orb .o-r3{transform-origin:100px 100px}
.a2-orb .o-r1{animation:a2spin 40s linear infinite}
.a2-orb .o-r2{animation:a2spin 22s linear infinite reverse}
.a2-orb .o-r3{animation:a2spin 60s linear infinite}
.a2-orb .o-core{transform-origin:100px 100px;animation:a2breath 4.5s ease-in-out infinite}
.a2-orb .o-glow{transform-origin:100px 100px;animation:a2breath 4.5s ease-in-out infinite}
.a2-orb .o-wave rect{fill:#fff;opacity:0;transform-origin:center;transform-box:fill-box}

.a2-orb.thinking .o-core{animation-duration:1.2s}
.a2-orb.speaking .o-wave rect{opacity:.95;animation:a2wave .9s ease-in-out infinite}
.a2-orb.speaking .o-core{animation-duration:2s}
.a2-orb.offline{color:#8BA3C7}

@keyframes a2wave{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}

.a2-log .log-e{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;align-items:start}
.a2-log .log-e .who{grid-row:span 2;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;clip-path:none;border:0;background:var(--blue-soft);color:var(--blue-2);font-family:var(--f-body);font-size:11px;font-weight:700}
.a2-log .log-e .who svg{width:15px;height:15px}
.a2-log .log-e.me .who{background:var(--surface-3);color:var(--ink)}
.a2-log .log-h{font-family:var(--f-body);font-size:12.5px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--ink-2);display:flex;gap:8px;align-items:baseline}
.a2-log .log-e.me .log-h{color:var(--ink-2)}
.a2-log .log-h time{font-weight:500;letter-spacing:0;color:var(--muted);font-size:11.5px}
.a2-log .log-b{font-size:14.5px;line-height:1.6;color:var(--ink);font-weight:400}
.a2-log .log-e.me .log-b{color:var(--ink-2)}
.a2-log .log-b ul{margin:6px 0 6px 18px;display:flex;flex-direction:column;gap:4px}
.a2-log .log-b p{margin:4px 0}
.a2-log .log-b b,.a2-log .log-b strong{color:var(--ink);font-weight:600}
.a2-log .caret{display:inline-block;width:7px;height:15px;background:var(--blue-2);vertical-align:-2px;margin-left:2px;animation:blink 1s infinite}
@media (max-width:1180px){.a2-acts{grid-template-columns:repeat(3,minmax(0,1fr))}.p-top{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .p-head{margin-bottom:16px}
  .p-tools{width:100%}
  .p-per{flex:1 1 auto}
  .p-step{flex:1;justify-content:space-between}
  .p-dep{flex:1 1 140px}
  .p-btn span{display:none}
  .p-btn{padding:9px 11px}
  .p-hero{padding:20px}
  .ph-bars{height:48px;gap:4px}
  .p-quick{grid-template-columns:minmax(0,1fr);gap:10px}
  .q{flex-direction:row;flex-wrap:wrap;align-items:baseline;justify-content:space-between;padding:13px 15px}
  .q-l{width:100%}
  .q b{font-size:19px}
  .p-top,.p-grid{gap:10px}
  .demo-chip{display:none}
  .pt-tx b{white-space:normal;line-height:1.3}
  .pt-it{gap:10px;grid-template-columns:auto minmax(0,1fr) auto}
  .pt-ch{display:none}
  .pt-v{font-size:12px}
  .aura2.chatting .a2-facts{display:none}
  .aura2{padding:14px 14px 12px;border-radius:20px;min-height:calc(100dvh - 210px)}
  .aura2.chatting{height:calc(100dvh - 210px)}
  .a2-tag,.a2-btn span{display:none}
  .a2-acts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .a2-act:last-child{grid-column:1/-1}
  .a2-act small{display:none}
  .a2-hero{padding:18px 0 12px}
  .a2-orb{width:110px;height:110px}
  .a2-sugg{display:none}
  .a2-foot{display:none}
}
/* =================== v8 · DESIGN COESO =================== */
/* 1) uma linguagem só: sem ícones decorativos em cartões, cores só para sinalizar */
.page-head h1 .hic{display:none}
.page-head h1{font-size:clamp(22px,1.8vw,26px);font-weight:600}
.page-head p{max-width:70ch}
.kpi .k-ic{display:none}
.kpi .k-top{gap:0}
.kpi .k-l{font-size:12.5px}
.kpi .k-v{font-size:clamp(19px,1.5vw,23px);font-weight:600;margin-top:4px}
.kpi .k-v.st-bad,.kpi .k-v.st-warn{color:var(--ink)}
.kpi.has-ring .ring{transform:scale(.85)}
.tile-head .tic{display:none}
.tile-head h3{font-size:14px;font-weight:600}
.tile-head .sub{font-weight:400}
.btn-ok{background:transparent;border-color:var(--line-2);color:var(--ink-2)}
.btn-ok:hover{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.btn-ok svg{color:var(--ok)}
.pill{font-weight:600;font-size:11px;padding:2px 8px}
.pill::before{width:5px;height:5px}
.tag{background:transparent;border-color:var(--line);font-weight:500}
.chip{font-weight:500}
.chip em{font-style:normal;opacity:.7;margin-left:2px}
.group-t{letter-spacing:.08em;font-weight:600}
.due-row .v,.dt .val,.ncard .v,.fx-v,.tl-v,.rb-row .v,.ibx-v,.cx-split b,.sumbar b,.group-t em{font-family:var(--f-body);font-variant-numeric:tabular-nums}
.ins{background:transparent}
.ins.bad .ii,.ins.warn .ii{background:var(--surface-2)}
.dep{box-shadow:none}
.cx-answer{border-color:color-mix(in srgb,var(--line) 80%,transparent)!important}
.cx-answer .cx-big{font-size:clamp(20px,1.8vw,24px)}
.cx-answer .errbox,.cx-answer .warnbox{font-size:12.5px}
.warnbox{background:transparent;border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);color:var(--ink-2)}
.warnbox::first-letter{color:var(--warn)}
.errbox{background:transparent;border:1px solid color-mix(in srgb,var(--bad) 30%,transparent);color:var(--ink-2)}
.infobox{background:transparent;border:1px solid var(--line-2);color:var(--ink-2)}
.toolbar .seg,.seg{background:transparent;border-color:var(--line)}
.side-new{box-shadow:none}
.icon-btn{border-color:var(--line)}
/* 2) painel mais calmo */
.p-hero{background:var(--surface);border-color:color-mix(in srgb,var(--line) 80%,transparent)}
.ph-v{font-size:clamp(32px,3.2vw,44px);font-weight:600}
.ph-d .delta{font-size:12px}
.pb-bar{height:6px}
.pb-bar i{background:var(--blue)}
.ph-bud.warn .pb-bar i{background:var(--warn)}
.ph-bud.bad .pb-bar i{background:color-mix(in srgb,var(--bad) 85%,var(--surface))}
.ph-bud.bad .pb-top b,.ph-bud.warn .pb-top b{color:var(--ink)}
.ph-bars span{background:var(--surface-3)}
.ph-bars span.on{background:var(--blue)}
.pt-ic,.pt-it.bad .pt-ic,.pt-it.warn .pt-ic,.pt-it.blue .pt-ic{background:var(--surface-2);color:var(--ink-2);position:relative}
.pt-it .pt-ic::after{content:"";position:absolute;top:-2px;right:-2px;width:9px;height:9px;border-radius:50%;border:2px solid var(--surface);background:var(--muted)}
.pt-it.bad .pt-ic::after{background:var(--bad)}.pt-it.warn .pt-ic::after{background:var(--warn)}.pt-it.blue .pt-ic::after{background:var(--blue-2)}
.pt-v,.pt-it.bad .pt-v{font-family:var(--f-body);color:var(--ink-2);font-weight:600}
.pt-n{background:transparent;border:1px solid var(--line-2)}
.q b{font-size:20px}
/* 3) caixa de entrada compacta */
.ib-top{background:var(--surface);border:1px solid color-mix(in srgb,var(--line) 80%,transparent);border-radius:18px;padding:14px;margin-bottom:18px;display:flex;flex-direction:column;gap:12px}
.ib-chs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ib-ch{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:13px;border:1px solid var(--line);background:transparent;color:inherit;text-align:left;min-width:0}
.ib-ch:hover{border-color:var(--line-2);background:var(--surface-2)}
.ib-ci{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2);flex:none}
.ib-ci svg{width:17px;height:17px}
.ib-ci.sm{width:30px;height:30px;background:transparent;color:var(--muted)}
.ib-ct{flex:1;min-width:0}
.ib-ct b{display:block;font-size:13.8px}
.ib-ct small{display:block;font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib-ct small.st-off{color:var(--muted)}.ib-ct small.st-lock{color:var(--muted)}
.ib-chev{width:15px;height:15px;color:var(--muted);flex:none}
.ib-code{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.ib-in{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font-size:13.5px;outline:none;padding:8px 2px}
.ib-in::placeholder{color:var(--muted);font-family:var(--f-body)}
.ib-code-foot{display:flex;align-items:flex-start;gap:12px;justify-content:space-between}
.ib-code-foot .code-res{flex:1}
.ib-code-foot>.link{font-size:12.5px;margin-left:auto;white-space:nowrap}
.ib-bar2{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.ib-bar2 .chips{flex:1;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
.ib-bar2 .chips::-webkit-scrollbar{display:none}
.ch-body{display:flex;flex-direction:column;gap:12px}
.ch-body p{font-size:14px;line-height:1.5}
.ch-st{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;align-self:flex-start;padding:4px 10px;border-radius:99px;border:1px solid var(--line-2)}
.ch-st i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.ch-st.st-ok i{background:var(--ok)}.ch-st.st-off i{background:var(--warn)}
.ch-id{font-size:13.5px;padding:10px 12px;border-radius:11px;background:var(--bg-2);border:1px solid var(--line);color:var(--ink-2);overflow-wrap:anywhere}
.ibx-ic{background:var(--surface-2)!important;color:var(--ink-2)!important}
.color-in{width:52px;height:38px;border:1px solid var(--line-2);border-radius:10px;background:var(--bg-2);padding:3px;cursor:pointer}
/* 4) A.N.A.B · futurista + limpa */
.aura3{display:flex;flex-direction:column;min-height:calc(100dvh - 150px);padding:16px 22px 16px;background:radial-gradient(60% 50% at 50% 30%,rgba(47,107,255,.22),transparent 70%),radial-gradient(30% 25% at 50% 30%,rgba(92,225,255,.10),transparent 70%),linear-gradient(180deg,#030914,#01040A);box-shadow:inset 0 0 90px rgba(92,225,255,.04)}
.aura3::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(92,225,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(92,225,255,.045) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(70% 60% at 50% 35%,#000,transparent 80%);-webkit-mask-image:radial-gradient(70% 60% at 50% 35%,#000,transparent 80%)}
.aura3>*{position:relative}
.aura3 .h-top{border-bottom-color:rgba(92,225,255,.12)}
.aura3 .h-brand span{font-size:11.5px}
.a3-stage{margin:6px 0 4px;transition:all .35s}
.aura3 .h-center svg{max-height:340px}
.aura3 .hcard{background:linear-gradient(135deg,rgba(92,225,255,.07),rgba(47,107,255,.02) 60%)}
.aura3 .amark{filter:drop-shadow(0 0 8px rgba(92,225,255,.8))}
.aura3.nofacts .h-col{display:none}
.aura3.nofacts .a3-stage{grid-template-columns:minmax(0,1fr)}
.aura3.nofacts .h-center{max-width:560px;width:100%;margin:0 auto}
.a3-line{text-align:center;font-family:var(--f-body);font-size:16px;color:rgba(214,244,255,.62);margin:2px 0 18px}
.a3-line span:first-child{color:#fff;font-weight:600}
.a3-start{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:auto;padding-bottom:16px}
.a3-acts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;width:100%;max-width:1060px}
.a3-act{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:14px 14px 13px;border:1px solid var(--hl);background:linear-gradient(160deg,rgba(92,225,255,.07),rgba(2,8,20,.4));color:#D6F4FF;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);min-width:0;transition:border-color .2s,background .2s}
.a3-act:hover:not(:disabled){border-color:var(--hc);background:linear-gradient(160deg,rgba(92,225,255,.14),rgba(2,8,20,.4))}
.a3-ai{color:var(--hc);margin-bottom:6px}
.a3-ai svg{width:19px;height:19px;filter:drop-shadow(0 0 6px rgba(92,225,255,.6))}
.a3-act b{font-family:var(--f-body);font-size:13.8px;font-weight:600;color:#fff}
.a3-act small{font-family:var(--f-body);font-size:12px;color:rgba(214,244,255,.55);line-height:1.35}
.a3-sugg{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 10px;max-width:900px}
.a3-sugg button{border:0;background:transparent;color:rgba(214,244,255,.5);font-family:var(--f-body);font-size:13px;padding:4px 8px}
.a3-sugg button:hover{color:#fff}
.a3-sugg button::before{content:"› ";color:var(--hc)}
.a3-log{display:none;flex-direction:column;gap:18px;width:100%;max-width:880px;margin:0 auto;padding:8px 2px 12px}
.a3-dock{position:sticky;bottom:0;width:100%;max-width:880px;margin:0 auto;padding-top:10px;background:linear-gradient(to top,#01040A 70%,transparent)}
.a3-mini{display:none;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:8px}
.a3-mini::-webkit-scrollbar{display:none}
.a3-mini button{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--hl);background:rgba(2,8,20,.6);color:#BFEFFF;font-family:var(--f-body);font-size:12.5px;font-weight:500;padding:6px 11px;clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.a3-mini button svg{width:14px;height:14px;color:var(--hc)}
.a3-mini button:hover:not(:disabled){border-color:var(--hc);color:#fff}
.a3-input{display:flex;align-items:flex-end;gap:10px;border:1px solid rgba(92,225,255,.35);background:rgba(1,6,14,.85);padding:6px 6px 6px 14px;clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);transition:border-color .2s,box-shadow .2s}
.a3-input:focus-within{border-color:var(--hc);box-shadow:0 0 28px -10px var(--hc)}
.a3-pr{font-family:var(--f-holo);color:var(--hc);font-size:12px;line-height:42px}
.a3-input textarea{flex:1;min-width:0;border:0;background:transparent;resize:none;outline:none;color:#fff;font-family:var(--f-body);font-size:15px;line-height:1.45;padding:10px 0;min-height:42px;max-height:140px}
.a3-input textarea::placeholder{color:rgba(214,244,255,.38)}
.a3-input button{width:42px;height:42px;border:0;display:grid;place-items:center;background:linear-gradient(135deg,#5CE1FF,#2F6BFF);color:#011;flex:none;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.a3-input button:disabled{opacity:.4}
.a3-input button svg{width:18px;height:18px}
.a3-foot{font-family:var(--f-body);font-size:11.5px;color:rgba(214,244,255,.38);text-align:center;margin-top:8px}
.aura3.chatting{height:calc(100dvh - 150px);min-height:480px}
.aura3.chatting .a3-stage{grid-template-columns:minmax(0,1fr);margin:0}
.aura3.chatting .h-col{display:none}
.aura3.chatting .h-center{max-width:210px;width:100%;margin:0 auto}
.aura3.chatting .a3-line{margin:0 0 6px;font-size:13.5px}
.aura3.chatting .a3-line span:first-child{display:none}
.aura3.chatting .a3-start{display:none}
.aura3.chatting .a3-log{display:flex;flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(92,225,255,.3) transparent}
.aura3.chatting .a3-mini{display:flex}
.a3-log .log-e{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;align-items:start}
.a3-log .log-e .who{grid-row:span 2;width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--hl);color:var(--hc);font-family:var(--f-body);font-size:11px;font-weight:700;clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.a3-log .log-e.me .who{color:#fff;background:rgba(47,107,255,.3);border-color:rgba(47,107,255,.55)}
.a3-log .log-h{font-family:var(--f-body);font-size:12.5px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--hc);display:flex;gap:8px;align-items:baseline}
.a3-log .log-e.me .log-h{color:#9DB8FF}
.a3-log .log-h time{color:rgba(214,244,255,.4);font-weight:500;letter-spacing:0}
.a3-log .log-b{font-family:var(--f-body);font-size:15px;line-height:1.6;color:#E3F7FF;font-weight:400;background:none;border:0;padding:0}
.a3-log .log-b ul{margin:6px 0 6px 18px;display:flex;flex-direction:column;gap:4px}
.a3-log .log-b b,.a3-log .log-b strong{color:#fff;font-weight:600}
.a3-log .caret{display:inline-block;width:7px;height:15px;background:var(--hc);vertical-align:-2px;margin-left:2px;animation:blink 1s infinite}
/* 5) apresentações */
.dk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.dk-card{background:var(--surface);border:1px solid color-mix(in srgb,var(--line) 80%,transparent);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.dk-thumb{display:block;border:0;padding:0;background:#fff;aspect-ratio:16/9;overflow:hidden;cursor:pointer}
.dk-thumb svg,.dk-mini svg,.dk-main svg,.dkp-slide svg,.dk-hero-art svg{display:block;width:100%;height:auto}
.dk-info{padding:14px 16px 4px;min-width:0}
.dk-info b{display:block;font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dk-info small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.dk-acts{display:flex;gap:6px;justify-content:flex-end;padding:8px 12px 12px}
.dk-empty{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:32px;align-items:center;padding:28px}
.dk-empty h3{font-size:22px;margin-bottom:8px}
.dk-empty p{font-size:14.5px;line-height:1.55;margin-bottom:14px}
.dk-hero-art{border-radius:14px;overflow:hidden;border:1px solid var(--line);box-shadow:0 30px 60px -30px rgba(0,0,0,.6)}
.dk-feats{list-style:none;padding:0;margin:0 0 18px;display:flex;flex-direction:column;gap:7px}
.dk-feats li{display:flex;gap:8px;font-size:14px;color:var(--ink-2)}
.dk-feats svg{width:16px;height:16px;color:var(--ok)}
.sheet.dk-sheet{width:min(860px,100%)}
.sheet.dk-sheet.wide{width:min(1180px,100%)}
.dk-form{display:flex;flex-direction:column;gap:22px}
.dkf-sec h4{display:flex;align-items:center;gap:10px;font-family:var(--f-body);font-size:15px;font-weight:600;margin-bottom:12px}
.dkf-sec h4 span{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--blue-soft);color:var(--blue-2)}
.dk-chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.dk-chip{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:transparent;min-width:0}
.dk-chip:has(input:checked){border-color:var(--blue);background:var(--blue-soft)}
.dk-chip input{margin-top:3px;accent-color:var(--blue);flex:none}
.dk-chip b{display:block;font-size:13px;font-weight:600}
.dk-chip small{display:block;font-size:11.5px;color:var(--muted);line-height:1.35;margin-top:1px}
.dk-vis{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;margin-top:12px}
.dk-colors{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dk-sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;box-shadow:0 0 0 1px var(--line-2);cursor:pointer;padding:0}
.dk-sw[aria-pressed="true"]{border-color:var(--surface);box-shadow:0 0 0 2px var(--ink)}
.dk-custom{position:relative;background:conic-gradient(#f43f5e,#f59e0b,#22c55e,#06b6d4,#6366f1,#d946ef,#f43f5e);overflow:hidden}
.dk-custom input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.dk-count{margin-right:auto;font-size:13px;color:var(--muted)}
.dk-count b{color:var(--ink)}
.dk-view{display:flex;flex-direction:column;gap:14px}
.dk-stage{position:relative;display:flex;align-items:center;gap:10px}
.dk-main{flex:1;min-width:0;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#fff;box-shadow:0 30px 60px -30px rgba(0,0,0,.7)}
.dk-nav{width:40px;height:40px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);display:grid;place-items:center;flex:none}

.ic2-list{display:flex;flex-direction:column;gap:10px}
.ic2{background:var(--surface);border:1px solid color-mix(in srgb,var(--line) 80%,transparent);border-left:3px solid var(--cc);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.ic2.lancado,.ic2.descartado{opacity:.7}
.ic2-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.ch-badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--cc);background:color-mix(in srgb,var(--cc) 14%,transparent);padding:3px 9px;border-radius:99px}
.ch-badge svg{width:13px;height:13px}
.ic2-warn{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--warn);background:var(--warn-soft);padding:3px 9px;border-radius:99px}
.ic2-mid{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.ic2-tx{min-width:0}
.ic2-tx b{display:block;font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic2-tx small{display:block;font-size:13px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic2-v{font-family:var(--f-display);font-size:19px;font-weight:600;letter-spacing:-.02em;white-space:nowrap}
.ic2-msg{font-size:13px;color:var(--ink-2);font-style:italic;padding:8px 12px;border-radius:10px;background:var(--bg-2)}
.ic2-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--line)}
.ic2-tags{display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.ic2-tags b{color:var(--ink-2);font-weight:600}
.ic2-acts{display:flex;gap:6px;align-items:center;margin-left:auto}
.ibx2-side{display:flex;flex-direction:column;gap:12px;position:sticky;top:84px}
.side-card{background:var(--surface);border:1px solid color-mix(in srgb,var(--line) 80%,transparent);border-radius:16px;padding:16px}
.side-card h3{display:flex;align-items:center;gap:8px;font-family:var(--f-body);font-size:14px;font-weight:600;margin-bottom:6px}
.side-card h3 svg{width:16px;height:16px;color:var(--muted)}
.side-card p{font-size:12.8px;color:var(--muted);line-height:1.45;margin-bottom:10px}
.sc-list{display:flex;flex-direction:column;margin-top:6px}
.sc-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.sc-row:first-child{border-top:0}
.sc-ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--cc) 15%,transparent);color:var(--cc);flex:none}
.sc-ic svg{width:16px;height:16px}
.sc-tx{all:unset;flex:1;min-width:0;cursor:pointer}
.sc-tx b{display:block;font-size:13.5px}
.sc-tx small{display:block;font-size:12px;font-weight:500}
.sc-tx small.st-off,.sc-tx small.st-lock{color:var(--muted)}
.sc-code{display:flex;gap:6px}
.sc-code .in{flex:1;min-width:0}
.side-card .code-res{margin-top:8px}
.how-v ol{margin:6px 0 0 18px;display:flex;flex-direction:column;gap:7px;font-size:12.8px;color:var(--muted);line-height:1.45}
.how-v ol b{color:var(--ink-2)}
.btn-block{width:100%}
/* 4) departamentos em cartões com personagem */
.dc2-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.dc2{display:flex;flex-direction:column;gap:12px;text-align:left;color:inherit;background:var(--surface);border:1px solid color-mix(in srgb,var(--line) 80%,transparent);border-radius:18px;padding:18px;min-width:0;position:relative;overflow:hidden;transition:border-color .15s,transform .15s}
.dc2::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--dc)}
.dc2:hover{border-color:color-mix(in srgb,var(--dc) 45%,var(--line));transform:translateY(-1px)}
.dc2-top{display:flex;align-items:center;gap:12px}
.dc2-av{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--dc) 16%,transparent);color:var(--dc);flex:none;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--dc) 30%,transparent)}
.dc2-av svg{width:22px;height:22px}
.dc2-n{flex:1;min-width:0}
.dc2-n b{display:block;font-size:15.5px;font-weight:600}
.dc2-n small{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.dc2-st{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--ok-soft);color:var(--ok);white-space:nowrap}
.dc2-st.warn,.dc2-st.bad{background:var(--warn-soft);color:var(--warn)}
.dc2-st.none{background:var(--surface-2);color:var(--muted)}
.dc2-v{font-family:var(--f-display);font-size:24px;font-weight:600;letter-spacing:-.03em}
.dc2-v small{display:block;font-family:var(--f-body);font-size:12.5px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:2px}
.dc2-bar{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.dc2-bar i{display:block;height:100%;border-radius:99px;background:var(--dc)}
.dc2-bar.bad i,.dc2-bar.warn i{background:var(--warn)}
.dc2-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted)}
.dc2-team{display:flex}
.dc2-team .avatar+.avatar{margin-left:-4px}
/* 5) fornecedores */
.fr-row{display:grid;grid-template-columns:auto minmax(0,1.4fr) minmax(0,1fr) 140px 16px;gap:14px;align-items:center;padding:13px 16px;border:0;border-top:1px solid var(--line);background:none;color:inherit;text-align:left;width:100%}
.fr-row:first-child{border-top:0}
.fr-row:hover{background:color-mix(in srgb,var(--surface-2) 55%,transparent)}
.fr-av{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--fc);background:color-mix(in srgb,var(--fc) 15%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--fc) 30%,transparent)}
.fr-tx{min-width:0}
.fr-tx b{display:block;font-size:14.2px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fr-tx small{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);margin-top:3px;overflow:hidden;white-space:nowrap}
.ctag{font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:99px;color:var(--tc);background:color-mix(in srgb,var(--tc) 13%,transparent);flex:none}
.fr-share{display:flex;flex-direction:column;gap:6px}
.fr-track{height:7px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.fr-track i{display:block;height:100%;border-radius:99px;background:var(--fc)}
.fr-share small{font-size:12px;color:var(--muted)}
.fr-v{text-align:right;font-weight:600;font-size:14.5px;font-variant-numeric:tabular-nums}
.fr-v small{display:block;margin-top:3px}
/* 6) relatórios */
.rp-build{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.rp-steps{display:flex;flex-direction:column;gap:14px}
.rp-step{background:var(--surface);border:1px solid color-mix(in srgb,var(--line) 80%,transparent);border-radius:16px;padding:16px 18px}
.rp-step h3{display:flex;align-items:center;gap:10px;font-family:var(--f-body);font-size:14.5px;font-weight:600;margin-bottom:12px}
.rp-step h3 span{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--blue);color:#fff}
.rp-step h3 em{font-style:normal;font-weight:500;font-size:12.5px;color:var(--muted)}
.rp-models{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.rp-model{display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left;padding:12px;border-radius:13px;border:1px solid var(--line);background:transparent;color:inherit}
.rp-model:hover{border-color:color-mix(in srgb,var(--mc) 50%,var(--line))}
.rp-model[aria-pressed="true"]{border-color:var(--mc);background:color-mix(in srgb,var(--mc) 10%,transparent)}
.rp-mi{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--mc) 16%,transparent);color:var(--mc);margin-bottom:6px}
.rp-mi svg{width:16px;height:16px}
.rp-model b{font-size:13.5px;font-weight:600}
.rp-model small{font-size:12px;color:var(--muted);line-height:1.35}
.rp-filt{display:flex;gap:8px;flex-wrap:wrap}
.rp-filt .in{flex:1 1 160px}
.rp-dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rp-btn{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px;border-radius:14px;border:1px solid var(--line);background:transparent;color:inherit}
.rp-btn:disabled{opacity:.5}
.rp-btn.pdf{--bc:#EF4444}.rp-btn.xls{--bc:#22C55E}
.rp-btn:hover:not(:disabled){border-color:var(--bc);background:color-mix(in srgb,var(--bc) 7%,transparent)}
.rp-bi{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--bc) 15%,transparent);color:var(--bc);flex:none}
.rp-bi svg{width:19px;height:19px}
.rp-btn b{display:block;font-size:14px;font-weight:600}
.rp-btn small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.rp-prev{background:var(--surface);border:1px solid color-mix(in srgb,var(--line) 80%,transparent);border-radius:16px;padding:16px 18px;position:sticky;top:84px}
.rp-prev-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px}
.rp-prev-h span{font-weight:600;font-size:14.5px}
.rp-prev-h small{font-size:12px;color:var(--muted);text-align:right}
.rp-prev-k{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
.rp-prev-k>div{background:var(--bg-2);border-radius:12px;padding:10px 12px}
.rp-prev-k small{display:block;font-size:12px;color:var(--muted)}
.rp-prev-k b{display:block;font-family:var(--f-display);font-size:18px;font-weight:600;margin-top:2px}
.rp-ready{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.rp-card{background:var(--surface);border:1px solid color-mix(in srgb,var(--line) 80%,transparent);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.rp-card::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--rc)}
.rp-ci{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--rc) 16%,transparent);color:var(--rc);margin-bottom:4px}
.rp-ci svg{width:21px;height:21px}
.rp-card h3{font-family:var(--f-body);font-size:15px;font-weight:600}
.rp-card p{font-size:13px;color:var(--muted);line-height:1.45;flex:1}
.rp-ctl{display:flex;gap:8px;flex-wrap:wrap}
.rp-ctl .in{flex:1 1 140px}
/* 7) apresentações */
.dk-hero2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:center;padding:26px 28px;border-radius:22px;background:radial-gradient(90% 120% at 100% 0%,rgba(47,107,255,.22),transparent 60%),var(--surface);border:1px solid color-mix(in srgb,var(--blue) 25%,var(--line));margin-bottom:22px;overflow:hidden}
.dkh-k{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--blue-2);background:var(--blue-soft);padding:4px 10px;border-radius:99px}
.dkh-k svg{width:13px;height:13px}
.dkh-tx h2{font-size:clamp(22px,2.3vw,32px);letter-spacing:-.035em;margin:12px 0 8px}
.dkh-tx p{font-size:14.5px;color:var(--muted);line-height:1.55;max-width:56ch}
.dkh-steps{display:flex;flex-wrap:wrap;gap:8px 16px;margin:16px 0 14px;font-size:13px;color:var(--ink-2)}
.dkh-steps span{display:inline-flex;align-items:center;gap:8px}
.dkh-steps b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;background:var(--blue);color:#fff}
.dkh-plan{font-size:12.5px;color:var(--muted)}
.dkh-art{position:relative;height:250px}
.dkh-s{position:absolute;width:70%;border-radius:12px;overflow:hidden;box-shadow:0 30px 60px -25px rgba(0,0,0,.8);border:1px solid rgba(255,255,255,.08);background:#fff}
.dkh-s svg{display:block;width:100%;height:auto}
.dkh-s.s1{left:0;top:74px;z-index:3}
.dkh-s.s2{left:13%;top:40px;z-index:2;transform:rotate(2deg);opacity:.9}
.dkh-s.s3{left:26%;top:8px;z-index:1;transform:rotate(4deg);opacity:.75}
.dk-tpls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.dk-tpl{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;padding:16px;border-radius:16px;border:1px solid color-mix(in srgb,var(--line) 80%,transparent);background:var(--surface);color:inherit;position:relative;overflow:hidden}
.dk-tpl::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--tc)}
.dk-tpl:hover{border-color:color-mix(in srgb,var(--tc) 50%,var(--line))}
.dk-ti{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 16%,transparent);color:var(--tc);margin-bottom:8px}
.dk-ti svg{width:19px;height:19px}
.dk-tpl b{font-size:14.5px;font-weight:600}
.dk-tpl small{font-size:12.5px;color:var(--muted);line-height:1.4;flex:1}
.dk-tgo{margin-top:10px;font-size:12.5px;font-weight:600;color:var(--tc)}
.dk-thumb{position:relative}
.dk-pg{position:absolute;right:8px;bottom:8px;font-size:11px;font-weight:700;background:rgba(0,0,0,.65);color:#fff;border-radius:6px;padding:2px 7px}
.dk-info small+small{margin-top:0}
/* 8) login */
.auth-art{gap:26px;justify-content:flex-start}
.au-hero{margin-top:18px}
.au-kick{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#6B95FF;margin-bottom:14px}
.auth-art .au-hero h1{font-size:clamp(34px,3.9vw,58px);max-width:14ch;line-height:1.02}
.auth-art .au-hero .lead{font-size:16.5px;max-width:52ch;color:#A3ACC0;line-height:1.55}
.au-keys{display:flex;flex-direction:column;gap:12px;max-width:620px}
.au-key{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;align-items:center;padding:14px;border-radius:18px;background:rgba(255,255,255,.035);border:1px solid #191C25}
.au-key b{display:block;font-size:16px;color:#fff;font-weight:600;margin:6px 0 4px}
.au-key small{display:block;font-size:13px;color:#8C95AA;line-height:1.45}
.au-tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:#6B95FF}
.au-tag svg{width:14px;height:14px}
.au-vis{height:96px;border-radius:13px;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:10px;overflow:hidden}
.au-vis.wa{background:#0B141A}
.au-b{align-self:flex-start;max-width:96%;background:#202C33;color:#E9EDEF;font-size:9.5px;line-height:1.35;padding:5px 7px;border-radius:3px 9px 9px 9px}
.au-b b{display:inline;font-size:9.5px;margin:0;color:#fff}
.au-b.me{align-self:flex-end;background:#005C4B;border-radius:9px 3px 9px 9px;padding:4px}
.au-photo{display:block;width:44px;height:30px;border-radius:5px;background:linear-gradient(135deg,#f5f5f0 60%,#d8d2c4);position:relative}
.au-photo::after{content:"";position:absolute;left:6px;right:10px;top:8px;height:2px;background:#bbb;box-shadow:0 5px 0 #ccc,0 10px 0 #ccc}
.au-vis.aura{background:radial-gradient(circle at 50% 50%,rgba(47,107,255,.35),#020814 70%);align-items:center}
.au-vis.aura svg{width:84px;height:84px}
.au-spin{transform-origin:60px 60px;transform-box:view-box;animation:hspin 24s linear infinite}
.au-vis.slide{background:linear-gradient(135deg,#132046,#0b1020);align-items:center}
.au-sl{position:relative;width:118px;height:68px;border-radius:7px;background:#fff;box-shadow:0 12px 24px -10px #000;overflow:hidden}
.au-sl .t{position:absolute;left:8px;top:8px;width:46px;height:6px;border-radius:3px;background:#0F172A}
.au-sl .b1,.au-sl .b2,.au-sl .b3,.au-sl .b4{position:absolute;bottom:8px;width:14px;border-radius:3px 3px 1px 1px;background:#A9C1FF}
.au-sl .b1{left:10px;height:18px}.au-sl .b2{left:30px;height:26px}.au-sl .b3{left:50px;height:22px}.au-sl .b4{left:70px;height:36px;background:#2F6BFF}
.au-sl::after{content:"";position:absolute;right:0;top:0;bottom:0;width:26px;background:#2F6BFF;clip-path:polygon(40% 0,100% 0,100% 100%,0 100%)}
.au-more{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:#8C95AA}
.au-more span{display:inline-flex;align-items:center;gap:6px}
.au-more svg{width:14px;height:14px;color:#2FD08A}
@media (max-width:1180px){.ibx2{grid-template-columns:minmax(0,1fr)}.ibx2-side{position:static;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.dc2-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.rp-build{grid-template-columns:minmax(0,1fr)}.rp-prev{position:static}.dk-tpls{grid-template-columns:repeat(2,minmax(0,1fr))}.fr-row{grid-template-columns:auto minmax(0,1.4fr) minmax(0,1fr) 120px}.fr-row .dp-ch{display:none}}
@media (max-width:980px){.dk-hero2{grid-template-columns:minmax(0,1fr)}.dkh-art{height:200px;max-width:440px}.rp-ready{grid-template-columns:minmax(0,1fr)}
  .au-keys{display:flex;max-width:none}.au-key{grid-template-columns:minmax(0,1fr);padding:12px 14px}.au-vis{display:none}.au-more{display:none}.auth-art .au-hero h1{font-size:clamp(30px,8vw,40px)}}
@media (max-width:760px){
  .ibx2-side{grid-template-columns:minmax(0,1fr)}
  .ibx2-hero{gap:14px}.ibx2-hero>div{min-width:0;flex:1 1 40%}.ibx2-hero>div+div{padding-left:14px}
  .ibx2-hero .btn{margin-left:0;width:100%}
  .ibx2-bar{flex-direction:column;align-items:stretch;gap:8px}
  .ic2-mid{flex-direction:column;gap:4px}
  .ic2-acts{width:100%;justify-content:flex-end;margin-left:0}
  .dc2-grid{grid-template-columns:minmax(0,1fr)}
  .fr-row{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"a t v" "a s s";gap:6px 12px}
  .fr-av{grid-area:a;align-self:start}.fr-tx{grid-area:t}.fr-v{grid-area:v}.fr-share{grid-area:s}
  .rp-dl{grid-template-columns:minmax(0,1fr)}
  .dk-tpls{grid-template-columns:minmax(0,1fr)}
  .dkh-art{display:none}
  .dk-hero2{padding:20px}
  .nf-lst .lr-act{min-width:0;width:auto;justify-content:flex-start}
}
/* =================== v11 =================== */
/* painel: topo */
.p-ico{padding:9px;width:40px;justify-content:center}
.p-scan{padding:10px 16px;border-radius:12px;gap:8px}
.p-scan svg{width:17px;height:17px}
.p-hero.ph2{display:flex;flex-direction:column;gap:0;padding:0;background:var(--surface);border:1px solid color-mix(in srgb,var(--line) 80%,transparent)}
.ph2-top{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.ph2-m{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:6px;padding:22px 24px 20px;cursor:pointer;min-width:0;position:relative;transition:background .15s}
.ph2-m:hover{background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
.ph2-m:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.ph2-m+.ph2-m{border-left:1px solid var(--line)}
.ph2-k{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:500}
.ph2-k i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.gasto .ph2-k i{background:var(--bad)}
.saldo .ph2-k i{background:var(--ok)}
.pagar .ph2-k i{background:var(--blue)}
.ph2-v{font-family:var(--f-display);font-size:clamp(24px,2.2vw,31px);font-weight:600;letter-spacing:-.035em;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gasto .ph2-v{color:var(--bad)}
.saldo .ph2-v{color:var(--ok)}

.ph2-bot{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.4fr);gap:26px;padding:18px 24px 20px;border-top:1px solid var(--line);background:color-mix(in srgb,var(--bg-2) 45%,transparent);flex:1;align-items:end}

.ph2-bud-h svg{width:15px;height:15px;color:var(--muted)}
.ph2-bud-h b{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.ph2-bud.warn .ph2-bud-h b,.ph2-bud.bad .ph2-bud-h b{color:var(--warn)}
.ph2-track{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.ph2-track i{display:block;height:100%;border-radius:99px;background:var(--blue)}
.ph2-bud.warn .ph2-track i,.ph2-bud.bad .ph2-track i{background:var(--warn)}
.ph2-bud small{font-size:12.5px;color:var(--muted)}
.ph2-bot>.ph-set{align-self:center;margin:0}
.ph2-chart{min-width:0}
.ph2-ch-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.ph2-ch-h span{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.ph2-ch-h small{font-size:11.5px;color:var(--muted)}
.ph2-cols{position:relative;display:flex;align-items:stretch;gap:5px;height:118px;padding:22px 0 18px;box-sizing:border-box}
.ph2-col{all:unset;flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative;cursor:pointer;min-width:0;height:100%}
.ph2-bar{display:block;width:100%;max-width:26px;border-radius:6px 6px 3px 3px;background:color-mix(in srgb,var(--blue) 24%,var(--surface-3));position:relative;transition:background .15s}
.ph2-col:hover .ph2-bar{background:color-mix(in srgb,var(--blue) 50%,var(--surface-3))}
.ph2-col.on .ph2-bar{background:var(--blue)}
.ph2-col small{position:absolute;bottom:-18px;font-size:10.5px;color:var(--muted);text-transform:lowercase}
.ph2-col.on small{color:var(--ink);font-weight:700}
.ph2-bar em{position:absolute;left:50%;bottom:calc(100% + 5px);transform:translateX(-50%);font-style:normal;font-size:10.5px;font-weight:700;white-space:nowrap;background:var(--ink);color:var(--surface);padding:2px 6px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .12s;z-index:2}
.ph2-col:hover .ph2-bar em,.ph2-col.on .ph2-bar em{opacity:1}
.ph2-col.on .ph2-bar em{background:var(--blue);color:#fff}
.ph2-col:focus-visible .ph2-bar{outline:2px solid var(--blue);outline-offset:2px}
.ph2-budl{position:absolute;left:0;right:0;height:0;border-top:1.5px dashed color-mix(in srgb,var(--warn) 70%,transparent);z-index:1;pointer-events:none}
.ph2-leg{display:inline-flex;align-items:center;gap:6px}.ph2-leg i{width:14px;border-top:1.5px dashed var(--warn)}
.ph2-budl em{position:absolute;left:0;bottom:2px;font-style:normal;font-size:10px;font-weight:600;color:var(--warn);background:color-mix(in srgb,var(--surface) 85%,transparent);padding:0 4px;border-radius:4px}
.q b.q-t{font-size:17px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* fluxo de caixa */
.cx2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) minmax(0,1.1fr);gap:14px;margin-bottom:16px}
.cx2-card{background:var(--surface);border:1px solid color-mix(in srgb,var(--line) 80%,transparent);border-radius:18px;padding:18px 20px;display:flex;flex-direction:column;gap:8px;min-width:0}
.cx2-k{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);font-weight:500}
.cx2-k svg{width:15px;height:15px}
.cx2-big{font-family:var(--f-display);font-size:clamp(24px,2.1vw,30px);font-weight:600;letter-spacing:-.035em;color:var(--ok);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cx2-card>small{font-size:12.5px;color:var(--muted);line-height:1.45}
.cx2-card>small b{color:var(--ink-2)}
.cx2-io{display:grid;grid-template-columns:86px minmax(0,1fr) auto;align-items:center;gap:10px;font-size:13px}
.cx2-io>span:first-child{display:inline-flex;align-items:center;gap:5px;color:var(--ink-2)}
.cx2-io svg{width:13px;height:13px;color:var(--muted)}
.cx2-io b{font-weight:600;font-variant-numeric:tabular-nums;font-size:13.5px}
.cx2-tr{display:block;height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.cx2-tr i{display:block;height:100%;border-radius:99px;background:var(--blue)}
.cx2-tr.ent i{background:var(--ok)}
.cx2-res{margin-top:2px;font-size:13px;color:var(--muted)}
.cx2-res b{color:var(--ok);font-weight:700}
.cx2-res.bad b{color:var(--bad)}
.cx2-ans{font-size:15px;color:var(--ink-2);margin:0}
.cx2-ans b{font-family:var(--f-display);font-size:20px;font-weight:600;letter-spacing:-.02em;color:var(--ok);display:block;margin-top:2px}
.cx2-prev.bad .cx2-ans b{color:var(--bad)}
.cx2-alert{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;font-size:12px;font-weight:600;color:var(--warn);background:var(--warn-soft);border:0;padding:5px 10px;border-radius:99px;margin-top:2px}
.cx2-alert.bad{color:var(--bad);background:var(--bad-soft)}
.cx2-alert svg{width:13px;height:13px}
.cx2-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;margin-bottom:8px}
.cx2-grid.fx2{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
.cx2-grid .tile{min-width:0}
.cx2-grid{align-items:start}
.cx2-chart .chart{height:280px!important;flex:none}
.cx-in{color:var(--ok)}
.lr-d.ent{background:color-mix(in srgb,var(--ok) 85%,#000);border-color:transparent;color:#fff}
.cx-lst .lr-v small,.cx-ent .lr-v small{font-size:12px;color:var(--muted)}
.lst-more{display:block;width:100%;border:1px dashed var(--line-2);background:transparent;color:var(--blue-2);font-weight:600;font-size:13px;padding:11px;border-radius:12px;margin:-4px 0 14px}
.lst-more:hover{background:var(--blue-soft)}
.cx-ent{cursor:pointer}
.cx-ent:hover{background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
.cx-ebar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.cx-eprog{flex:1;min-width:240px;display:flex;flex-direction:column;gap:7px}
.cx-eprog>div{display:flex;gap:6px;align-items:baseline;font-size:13px;color:var(--muted)}
.cx-eprog b{color:var(--ink);font-variant-numeric:tabular-nums}
.cx-note{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted);line-height:1.5;margin:-4px 0 16px}
.cx-note svg{width:15px;height:15px;flex:none;margin-top:2px;color:var(--blue-2)}
.big-sum b.cx-in{color:var(--ok)}
/* fornecedores em azul e branco */
.fr-row{--fc:var(--blue)!important;grid-template-columns:22px auto minmax(0,1.4fr) minmax(0,1fr) 140px 16px}
.fr-rk{font-size:12.5px;font-weight:700;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}

.ctag{--tc:var(--muted)!important;color:var(--ink-2);background:var(--surface-2)}
.fr-track i{background:var(--blue)}
.fr-row:not(.top) .fr-track i{background:color-mix(in srgb,var(--blue) 55%,var(--surface-3))}
.fr-v small .delta.up{color:var(--muted);background:var(--surface-2)}
.fr-v small .delta.down{color:var(--muted);background:var(--surface-2)}
@media (max-width:1180px){.fr-row{grid-template-columns:22px auto minmax(0,1.4fr) minmax(0,1fr) 120px}.cx2{grid-template-columns:repeat(2,minmax(0,1fr))}.cx2-saldo{grid-column:1/-1}.cx2-grid,.cx2-grid.fx2{grid-template-columns:minmax(0,1fr)}}

@media (max-width:760px){
  .p-tools{width:100%}

}
/* v11b · A.N.A.B no painel */
.ph2-main{display:grid;grid-template-columns:118px minmax(0,1fr);gap:6px 16px;align-items:end;padding:16px 22px 4px}
.ph2-c{display:contents}
.ph2-main .ph2-top{grid-column:1/-1}

.ph2-bubble{position:relative;margin:0 0 18px;align-self:center;padding:12px 16px 13px;border-radius:16px 16px 16px 6px;background:var(--blue-soft);border:1px solid color-mix(in srgb,var(--blue) 22%,transparent);font-size:14.2px;line-height:1.5;color:var(--ink-2)}
.ph2-bubble::before{content:"";position:absolute;left:-11px;bottom:16px;width:12px;height:18px;background:var(--blue-soft);clip-path:polygon(0 100%,100% 0,100% 100%)}

.ph2-main .ph2-m:hover{background:transparent}

.ph2-bot{margin-top:10px}
/* fala: palavras aparecem como se ela estivesse falando */
.ph2.talk .ph2-bubble .w{animation:wIn .32s ease-out var(--d) both}
@keyframes wIn{from{opacity:0;filter:blur(3px)}to{opacity:1;filter:none}}
/* robozinho */
.rb{width:100%;height:auto;overflow:visible}
.rb-sh{fill:var(--ink);opacity:.1;transform-origin:85px 170px;animation:rbSh 4.5s ease-in-out infinite}
.rb-fl{animation:rbFl 4.5s ease-in-out infinite}
.rb-body{fill:#F5F8FF;stroke:#14214A;stroke-width:2.6}

.rb-arm{stroke-width:7;stroke:#14214A}
.rb-hand{fill:#F5F8FF;stroke:#14214A;stroke-width:2.6}
.rb-ear{fill:#2F6BFF;stroke:#14214A;stroke-width:2.2}
.rb-ant{fill:#2F6BFF;stroke:#14214A;stroke-width:2.2;transform-origin:85px 9px;animation:rbAnt 2.4s ease-in-out infinite}
.rb-visor{fill:#0B1638}
.rb-eyes rect{fill:#5CE1FF;transform-box:fill-box;transform-origin:center;animation:rbBlink 5s infinite}
.rb-mouth{fill:#5CE1FF;opacity:.85;transform-box:fill-box;transform-origin:center}
.rb-neck{fill:#2F6BFF;stroke:#14214A;stroke-width:2}
.rb-core{fill:#2F6BFF;stroke:#14214A;stroke-width:2.2}
.rb-glint{fill:#CFF6FF;animation:rbAnt 2.4s ease-in-out infinite reverse}
.rb-belt{fill:#14214A;opacity:.12}
.rb-tab>rect:first-child{fill:#fff;stroke:#14214A;stroke-width:2.4}
.rb-tab .b1,.rb-tab .b2{fill:#A9C1FF}.rb-tab .b3{fill:#2F6BFF}
.rb-tab .tl{fill:none;stroke:#22C55E;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rb-tab{transform-origin:31px 141px;transform:rotate(-8deg)}
.rb-wave{transform-origin:126px 112px}
.ph2.talk .rb-wave{animation:rbWave .5s ease-in-out 4 alternate}
.ph2.talk .rb-mouth{animation:rbTalk .16s ease-in-out 14 alternate}
.ph2-robo:hover .rb-wave{animation:rbWave .5s ease-in-out 2 alternate}
@keyframes rbFl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes rbSh{0%,100%{transform:scaleX(1);opacity:.1}50%{transform:scaleX(.86);opacity:.06}}
@keyframes rbAnt{0%,100%{fill:#2F6BFF}50%{fill:#5CE1FF}}
@keyframes rbBlink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}
@keyframes rbWave{from{transform:rotate(0)}to{transform:rotate(-16deg)}}
@keyframes rbTalk{from{transform:scale(1,1)}to{transform:scale(.65,2.6)}}
[data-theme="dark"] .rb-sh{fill:#000;opacity:.5}
