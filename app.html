<body>
<<title>Conexo Gestão</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&family=Michroma&family=Rajdhani:wght@500;600;700&display=swap">
<style>
/* Layout: central de comando — barra lateral preta com grupos de navegação; área de trabalho escura em grade de 12 colunas,
   com blocos (tiles) no estilo painel de BI. Tablet: barra só com ícones. Celular: navegação embaixo + botão central. */
:root{
  --bg:#050608;
  --bg-2:#08090C;
  --side:#000000;
  --surface:#0E1015;
  --surface-2:#141720;
  --surface-3:#1B1F2B;
  --line:#1B1E27;
  --line-2:#272C3A;
  --ink:#F3F5FA;
  --ink-2:#C2C8D6;
  --muted:#7D879E;
  --blue:#2F6BFF;
  --blue-2:#6B95FF;
  --blue-3:#A9C1FF;
  --blue-deep:#1846C8;
  --blue-soft:rgba(47,107,255,.14);
  --blue-line:rgba(47,107,255,.38);
  --on-blue:#FFFFFF;
  --ok:#2FD08A;
  --ok-soft:rgba(47,208,138,.13);
  --warn:#F4B23E;
  --warn-soft:rgba(244,178,62,.13);
  --bad:#FF5A6A;
  --bad-soft:rgba(255,90,106,.13);
  --ink-on-side:#FFFFFF;
  --muted-on-side:#8A93A8;
  --side-line:#15171D;
  --side-hover:#0D0F14;
  --overlay:rgba(0,0,0,.66);
  --glow:0 0 0 1px rgba(47,107,255,.45),0 10px 30px -10px rgba(47,107,255,.65);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 20px 40px -24px rgba(0,0,0,.9);
  --shadow-lg:0 40px 90px -30px rgba(0,0,0,.95);
  --c1:#2F6BFF;--c2:#6B95FF;--c3:#A9C1FF;--c4:#E3EBFF;--c5:#3D4A6B;--c6:#5D6A88;
  --f-display:'Sora','Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Geist',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'Geist Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  --r:16px;--r-md:12px;--r-sm:9px;
  --side-w:256px;
  --gut-l:max(16px, env(safe-area-inset-left, 0px));
  --gut-r:max(16px, env(safe-area-inset-right, 0px));
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F3F5F9;--bg-2:#ECEFF5;--side:#000000;--surface:#FFFFFF;--surface-2:#F4F6FA;--surface-3:#E9EDF5;--line:#E3E7EF;--line-2:#CFD6E3;
    --ink:#0A0E1A;--ink-2:#2C3446;--muted:#667089;
    --blue:#1F5BFF;--blue-2:#1F5BFF;--blue-3:#4D7DFF;--blue-deep:#1443C2;--blue-soft:rgba(31,91,255,.10);--blue-line:rgba(31,91,255,.35);
    --ok:#0E9A5C;--ok-soft:rgba(14,154,92,.11);--warn:#B87200;--warn-soft:rgba(184,114,0,.11);--bad:#D42F43;--bad-soft:rgba(212,47,67,.10);
    --overlay:rgba(6,9,18,.5);--shadow:0 1px 2px rgba(10,14,26,.05),0 14px 30px -20px rgba(10,14,26,.3);--shadow-lg:0 40px 90px -30px rgba(10,14,26,.45);
    --c1:#1F5BFF;--c2:#5C86FF;--c3:#9DB6FF;--c4:#D3DFFF;--c5:#B4C2E2;--c6:#8A94AB;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F3F5F9;--bg-2:#ECEFF5;--side:#000000;--surface:#FFFFFF;--surface-2:#F4F6FA;--surface-3:#E9EDF5;--line:#E3E7EF;--line-2:#CFD6E3;
  --ink:#0A0E1A;--ink-2:#2C3446;--muted:#667089;
  --blue:#1F5BFF;--blue-2:#1F5BFF;--blue-3:#4D7DFF;--blue-deep:#1443C2;--blue-soft:rgba(31,91,255,.10);--blue-line:rgba(31,91,255,.35);
  --ok:#0E9A5C;--ok-soft:rgba(14,154,92,.11);--warn:#B87200;--warn-soft:rgba(184,114,0,.11);--bad:#D42F43;--bad-soft:rgba(212,47,67,.10);
  --overlay:rgba(6,9,18,.5);--shadow:0 1px 2px rgba(10,14,26,.05),0 14px 30px -20px rgba(10,14,26,.3);--shadow-lg:0 40px 90px -30px rgba(10,14,26,.45);
  --c1:#1F5BFF;--c2:#5C86FF;--c3:#9DB6FF;--c4:#D3DFFF;--c5:#B4C2E2;--c6:#8A94AB;
  color-scheme:light;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
#root{min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{margin:0;font-family:var(--f-display);font-weight:700;letter-spacing:-.02em;text-wrap:balance;color:var(--ink)}
p{margin:0}
.num,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:.92em}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{flex:none}
.st-ok{color:var(--ok)}.st-warn{color:var(--warn)}.st-bad{color:var(--bad)}.st-blue{color:var(--blue-2)}

/* ---------- marca ---------- */
.logo{display:inline-flex;align-items:center;gap:11px;color:inherit;text-decoration:none}
.logo-mark{width:36px;height:36px;display:block}
.logo-word{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.04em;line-height:1;color:inherit}
.logo-word small{display:block;font-family:var(--f-body);font-weight:600;font-size:10px;letter-spacing:.2em;text-transform:uppercase;opacity:.6;margin-top:4px}

/* ---------- botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 15px;border-radius:11px;border:1px solid transparent;font-weight:600;font-size:14px;line-height:1;white-space:nowrap;transition:background .15s,border-color .15s,color .15s,box-shadow .15s,transform .1s;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn svg{width:17px;height:17px}
.btn-primary{background:var(--blue);color:var(--on-blue);box-shadow:0 8px 24px -12px var(--blue)}
.btn-primary:hover:not(:disabled){background:var(--blue-deep);box-shadow:var(--glow)}
.btn-ghost{background:var(--surface);border-color:var(--line-2);color:var(--ink)}
.btn-ghost:hover:not(:disabled){border-color:var(--blue-line);color:var(--blue-2)}
.btn-soft{background:var(--blue-soft);color:var(--blue-2)}
.btn-soft:hover:not(:disabled){background:var(--blue-line);color:var(--on-blue)}
.btn-danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn-danger.armed,.btn-danger:hover:not(:disabled){background:var(--bad);color:#fff}
.btn-ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.btn-ok:hover:not(:disabled){background:var(--ok);color:#04140C}
.btn-white{background:#fff;color:#0A0E1A;border-color:#fff}
.btn-white:hover:not(:disabled){background:#E9EEFF}
.btn-sm{min-height:32px;padding:0 11px;font-size:13px;border-radius:9px}
.btn-sm svg{width:15px;height:15px}
.btn-block{width:100%}
.icon-btn{position:relative;display:inline-grid;place-items:center;width:38px;height:38px;border-radius:11px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);flex:none}
.icon-btn:hover{border-color:var(--blue-line);color:var(--blue-2)}
.icon-btn svg{width:18px;height:18px}
.icon-btn .dot{position:absolute;top:6px;right:6px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--bad);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg)}
.link{background:none;border:0;padding:0;color:var(--blue-2);font-weight:600;text-decoration:none}
.link:hover{text-decoration:underline;text-underline-offset:3px}

/* ---------- campos ---------- */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.label{font-size:12.5px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--muted);font-weight:500}
.in{width:100%;min-height:42px;background:var(--bg-2);border:1px solid var(--line-2);border-radius:11px;padding:9px 12px;font-size:14.5px;color:var(--ink);transition:border-color .15s,box-shadow .15s;min-width:0}
.in::placeholder{color:var(--muted);opacity:.8}
.in:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-soft)}
select.in{appearance:none;-webkit-appearance:none;padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 52%,calc(100% - 12px) 52%;background-size:5px 5px;background-repeat:no-repeat}
select.in option{background:var(--surface);color:var(--ink)}
textarea.in{min-height:90px;resize:vertical}
.in-sm{min-height:36px;font-size:13.5px;padding:6px 11px;border-radius:10px}
select.in-sm{padding-right:30px}
.in-group{position:relative;display:flex;align-items:center}
.in-group .in{padding-right:44px}
.in-group .eye{position:absolute;right:3px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;background:none;color:var(--muted);display:grid;place-items:center;border-radius:9px}
.in-group .eye svg{width:18px;height:18px}
.money{display:flex;align-items:center;gap:8px;background:var(--bg-2);border:1px solid var(--line-2);border-radius:13px;padding:2px 14px;transition:border-color .15s,box-shadow .15s;min-width:0}
.money:focus-within{border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-soft)}
.money span{font-weight:700;color:var(--blue-2);font-size:16px}
.money input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-family:var(--f-display);font-size:28px;font-weight:600;padding:6px 0;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--ink)}
.money.sm{padding:0 11px;border-radius:11px}
.money.sm span{font-size:13px}
.money.sm input{font-family:var(--f-body);font-size:14.5px;font-weight:600;padding:9px 0}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:12px;background:var(--bg-2);border:1px solid var(--line);flex-wrap:nowrap;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface-3);color:var(--ink);box-shadow:0 0 0 1px var(--line-2)}
.seg button[data-v="pago"][aria-pressed="true"]{color:var(--ok)}
.seg button[data-v="a_pagar"][aria-pressed="true"]{color:var(--warn)}
.check{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:600;color:var(--ink-2);cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--blue)}
.switch{position:relative;width:44px;height:26px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--surface-3);border:1px solid var(--line-2);transition:background .2s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--ink-2);transition:transform .2s,background .2s}
.switch input:checked+span{background:var(--blue);border-color:var(--blue)}
.switch input:checked+span::after{transform:translateX(18px);background:#fff}
.switch input:focus-visible+span{outline:2px solid var(--blue);outline-offset:2px}

/* ---------- etiquetas ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;line-height:1.3;border:1px solid transparent}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.pago{background:var(--ok-soft);color:var(--ok)}
.pill.a_pagar{background:var(--warn-soft);color:var(--warn)}
.pill.vencida{background:var(--bad-soft);color:var(--bad)}
.pill.pendente{background:var(--blue-soft);color:var(--blue-2);border-color:var(--blue-line)}
.pill.rejeitada{background:transparent;color:var(--muted);border-color:var(--line-2)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:7px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis}
.tag i{width:7px;height:7px;border-radius:2px;flex:none;background:var(--blue)}
.role{display:inline-flex;font-size:11px;font-weight:700;letter-spacing:.02em;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line-2);white-space:nowrap}
.role.proprietario{background:var(--blue);color:#fff;border-color:transparent}
.role.admin{background:var(--blue-soft);color:var(--blue-2);border-color:var(--blue-line)}
.ai-badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;color:var(--blue-2);background:var(--blue-soft);padding:2px 7px;border-radius:6px}
.ai-badge svg{width:11px;height:11px}
.kbd{font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px solid var(--line-2);border-radius:6px;padding:1px 6px;background:var(--surface-2)}

/* ---------- avatar ---------- */
.avatar{--s:38px;width:var(--s);height:var(--s);border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:calc(var(--s) * .37);color:#fff;background:linear-gradient(140deg,var(--blue),var(--blue-deep));overflow:hidden;user-select:none}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.sq{border-radius:28%}

/* =================== LOGIN =================== */
.auth{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);background:var(--bg)}
.auth-art{position:relative;overflow:hidden;background:#000;color:#fff;padding-block:36px;padding-inline:clamp(28px,4.5vw,64px);display:flex;flex-direction:column;gap:30px;justify-content:space-between;border-right:1px solid var(--side-line)}
.auth-art canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.auth-art>*:not(canvas){position:relative}
.auth-art .logo-word{color:#fff}
.auth-art h1{color:#fff;font-size:clamp(30px,3.4vw,50px);line-height:1.04;letter-spacing:-.045em;max-width:15ch;font-weight:700}
.auth-art h1 em{font-style:normal;background:linear-gradient(90deg,#2F6BFF,#A9C1FF);-webkit-background-clip:text;background-clip:text;color:transparent}
.auth-art .lead{color:#9AA3B8;font-size:16px;max-width:46ch;margin-top:16px}
.auth-feats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:26px;max-width:560px}
.auth-feat{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:13px;background:rgba(255,255,255,.03);border:1px solid #16181F}
.auth-feat .ic{width:32px;height:32px;border-radius:10px;background:rgba(47,107,255,.16);color:#6B95FF;display:grid;place-items:center;flex:none}
.auth-feat .ic svg{width:17px;height:17px}
.auth-feat b{display:block;font-size:13.5px;color:#fff;font-weight:600}
.auth-feat small{display:block;font-size:12px;color:#7D879E;line-height:1.35;margin-top:2px}
.mock{position:relative;border-radius:16px;border:1px solid #1B1E27;background:linear-gradient(180deg,#0B0D12,#07080B);padding:14px;max-width:560px;box-shadow:0 40px 80px -40px rgba(47,107,255,.45)}
.mock-top{display:flex;gap:6px;margin-bottom:12px}
.mock-top i{width:9px;height:9px;border-radius:50%;background:#1F232E}
.mock-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mock-k{border:1px solid #171A22;border-radius:10px;padding:9px 10px;background:#0D0F14}
.mock-k small{display:block;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#6A7389}
.mock-k b{display:block;font-family:var(--f-display);font-size:15px;color:#fff;margin-top:3px}
.mock-k em{font-style:normal;font-size:10.5px;color:#2FD08A}
.mock-chart{grid-column:1/-1;height:86px;border:1px solid #171A22;border-radius:10px;background:#0D0F14;display:flex;align-items:flex-end;gap:5px;padding:10px}
.mock-chart span{flex:1;border-radius:4px 4px 1px 1px;background:linear-gradient(180deg,#2F6BFF,#1846C8);opacity:.9;animation:growb 1.1s cubic-bezier(.2,.8,.2,1) both}
.mock-chart span:nth-child(odd){opacity:.55}
@keyframes growb{from{transform:scaleY(.1);transform-origin:bottom}}
.auth-foot{color:#5D667C;font-size:12px}
.auth-form-wrap{display:flex;align-items:center;justify-content:center;padding-block:40px;padding-left:var(--gut-l);padding-right:var(--gut-r)}
.auth-card{width:min(420px,100%);display:flex;flex-direction:column;gap:20px}
.auth-card h2{font-size:28px;letter-spacing:-.035em}
.auth-card .sub{color:var(--muted);margin-top:6px}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:4px;gap:4px}
.auth-tabs button{border:0;background:transparent;padding:10px;border-radius:10px;font-weight:600;color:var(--muted)}
.auth-tabs button[aria-selected="true"]{background:var(--surface-3);color:var(--ink);box-shadow:0 0 0 1px var(--line-2)}
.auth form{display:flex;flex-direction:column;gap:14px}
.auth .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn-google{background:#fff;color:#1F1F1F;border:1px solid #DADCE0;min-height:44px;font-weight:600}
.btn-google:hover{background:#F4F6FB}
.btn-google svg{width:18px;height:18px}
.auth-msg{font-size:13.5px;border-radius:11px;padding:11px 13px;font-weight:500;line-height:1.45}
.auth-msg.err{background:var(--bad-soft);color:var(--bad)}
.auth-msg.ok{background:var(--ok-soft);color:var(--ok)}
.auth-msg.info{background:var(--blue-soft);color:var(--blue-2);border:1px solid var(--blue-line)}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;font-weight:500}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.demo-box{border:1px dashed var(--line-2);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.demo-box p{font-size:13.5px;color:var(--ink-2)}
.demo-box code{font-family:var(--f-mono);font-size:12px;color:var(--blue-2);background:var(--blue-soft);padding:1px 6px;border-radius:5px}
.forgot{align-self:flex-end;font-size:13px}

/* =================== APP =================== */
.shell{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;height:100dvh;background:var(--side);color:var(--ink-on-side);display:flex;flex-direction:column;padding:18px 12px calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(12px, env(safe-area-inset-left,0px));overflow-y:auto;overflow-x:hidden;z-index:30;border-right:1px solid var(--side-line);scrollbar-width:none}
.side::-webkit-scrollbar{display:none}
.side .logo{padding:2px 10px 16px;color:#fff}
.co{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;background:#0B0C10;border:1px solid var(--side-line);margin-bottom:10px;min-width:0;text-align:left;color:inherit;width:100%}
.co:hover{border-color:#262A35}
.co .avatar{--s:32px;background:#fff;color:#000}
.co b{display:block;font-size:13px;font-weight:600;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff}
.co small{display:block;font-size:11px;color:var(--muted-on-side);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.co>div{min-width:0;flex:1}
.co .chev{width:16px;height:16px;color:var(--muted-on-side)}
.nav-label{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#4E566A;padding:14px 12px 6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:var(--muted-on-side);padding:9px 11px;border-radius:10px;font-weight:500;font-size:14px;text-align:left;position:relative;transition:background .12s,color .12s}
.nav button svg{width:19px;height:19px}
.nav button:hover{background:var(--side-hover);color:#fff}
.nav button[aria-current="page"]{background:linear-gradient(90deg,rgba(47,107,255,.22),rgba(47,107,255,.05));color:#fff}
.nav button[aria-current="page"]::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:#2F6BFF;box-shadow:0 0 12px #2F6BFF}
.nav button[aria-current="page"] svg{color:#6B95FF}
.nav .count{margin-left:auto;font-size:10.5px;font-weight:700;background:#16191F;color:#C2C8D6;padding:1px 7px;border-radius:999px;border:1px solid #23262F}
.nav .count.hot{background:rgba(255,90,106,.16);color:#FF7A87;border-color:rgba(255,90,106,.3)}
.nav .count.blue{background:rgba(47,107,255,.18);color:#8FB0FF;border-color:rgba(47,107,255,.35)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:14px}
.side-new{background:#2F6BFF;color:#fff;border:0;box-shadow:0 10px 26px -12px #2F6BFF}
.side-new:hover:not(:disabled){background:#1846C8}
.me{display:flex;align-items:center;gap:10px;padding:9px;border-radius:12px;border:1px solid var(--side-line);background:#07080B;color:inherit;text-align:left;width:100%;min-width:0}
.me:hover{border-color:#262A35}
.me .avatar{--s:34px}
.me b{display:block;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff}
.me small{display:block;font-size:11px;color:var(--muted-on-side)}
.me>div{min-width:0;flex:1}
.me .chev{width:16px;height:16px;color:var(--muted-on-side)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;display:flex;align-items:center;gap:12px;padding-block:12px;padding-left:max(26px, env(safe-area-inset-left,0px));padding-right:max(26px, env(safe-area-inset-right,0px));background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.3) blur(14px);-webkit-backdrop-filter:saturate(1.3) blur(14px);border-bottom:1px solid var(--line)}
.crumbs{display:flex;align-items:center;gap:8px;min-width:0;font-size:13.5px;color:var(--muted)}
.crumbs b{color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs svg{width:14px;height:14px}
.m-logo{display:none}
.cmd-btn{display:flex;align-items:center;gap:10px;min-width:0;flex:0 1 380px;margin-left:auto;height:38px;padding:0 10px 0 12px;border-radius:11px;border:1px solid var(--line-2);background:var(--surface);color:var(--muted);font-size:13.5px;text-align:left}
.cmd-btn:hover{border-color:var(--blue-line)}
.cmd-btn svg{width:17px;height:17px}
.cmd-btn span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.top-actions{display:flex;align-items:center;gap:8px}
.top-me{border:0;background:none;padding:0;border-radius:50%;display:none}
.top-me .avatar{--s:36px}
.content{padding-block:22px 56px;padding-left:max(26px, env(safe-area-inset-left,0px));padding-right:max(26px, env(safe-area-inset-right,0px));width:100%;max-width:1480px;min-width:0}
.demo-banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--blue-line);background:var(--blue-soft);color:var(--ink-2);border-radius:12px;padding:9px 14px;font-size:13px;margin-bottom:18px}
.demo-banner svg{width:16px;height:16px;color:var(--blue-2)}
.demo-banner .link{margin-left:auto;font-size:13px}

/* cabeçalho de página */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px 20px;flex-wrap:wrap;margin-bottom:18px}
.page-head h1{font-size:clamp(23px,2.2vw,30px);letter-spacing:-.035em;line-height:1.1;display:flex;align-items:center;gap:12px}
.page-head h1 .hic{width:40px;height:40px;border-radius:12px;background:var(--blue-soft);color:var(--blue-2);display:grid;place-items:center;border:1px solid var(--blue-line)}
.page-head h1 .hic svg{width:21px;height:21px}
.page-head p{color:var(--muted);margin-top:6px;font-size:14px}
.head-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:0 0 10px;color:var(--blue-2);font-weight:600;font-size:13px}
.back svg{width:15px;height:15px}

/* barra de período/filtros */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.toolbar .spacer{flex:1}
.stepper{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:11px;background:var(--bg-2);padding:2px}
.stepper button{width:30px;height:30px;border:0;background:none;border-radius:8px;color:var(--ink-2);display:grid;place-items:center}
.stepper button:hover:not(:disabled){background:var(--surface-3);color:var(--ink)}
.stepper button:disabled{opacity:.3}
.stepper button svg{width:15px;height:15px}
.stepper b{min-width:122px;text-align:center;font-size:13.5px;font-weight:600;padding:0 6px;text-transform:capitalize}
.toolbar select.in{width:auto;min-width:150px}

/* grade de blocos */
.bi{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.c-12{grid-column:span 12}.c-8{grid-column:span 8}.c-7{grid-column:span 7}.c-6{grid-column:span 6}.c-5{grid-column:span 5}.c-4{grid-column:span 4}.c-3{grid-column:span 3}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.tile-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;min-width:0}
.tile-head .tic{width:30px;height:30px;border-radius:9px;background:var(--surface-3);color:var(--blue-2);display:grid;place-items:center;flex:none;border:1px solid var(--line-2)}
.tile-head .tic svg{width:16px;height:16px}
.tile-head h3{font-family:var(--f-body);font-size:14px;font-weight:600;letter-spacing:0;color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile-head .sub{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap}
.tile-head .act{margin-left:auto;display:flex;gap:6px;align-items:center}
.tile-body{flex:1;min-width:0;display:flex;flex-direction:column}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-bottom:14px}
.kpi{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 12px;display:flex;flex-direction:column;gap:4px;min-width:0;overflow:hidden;box-shadow:var(--shadow);text-align:left;color:inherit}
button.kpi:hover{border-color:var(--blue-line)}
.kpi .k-top{display:flex;align-items:center;gap:9px;min-width:0}
.kpi .k-ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue-2);flex:none}
.kpi .k-ic svg{width:15px;height:15px}
.kpi .k-ic.warn{background:var(--warn-soft);color:var(--warn)}
.kpi .k-ic.bad{background:var(--bad-soft);color:var(--bad)}
.kpi .k-ic.ok{background:var(--ok-soft);color:var(--ok)}
.kpi .k-l{font-size:12.5px;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .k-v{font-family:var(--f-display);font-size:clamp(20px,1.7vw,25px);font-weight:600;letter-spacing:-.03em;line-height:1.15;font-variant-numeric:tabular-nums;margin-top:6px;overflow-wrap:anywhere}
.kpi .k-s{font-size:12px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.delta{display:inline-flex;align-items:center;gap:3px;font-weight:700;font-size:11.5px;padding:1px 6px;border-radius:6px}
.delta.up{color:var(--bad);background:var(--bad-soft)}
.delta.down{color:var(--ok);background:var(--ok-soft)}
.delta.flat{color:var(--muted);background:var(--surface-2)}
.kpi .spark{height:34px;margin:6px -4px -2px}
.kpi.feature{background:radial-gradient(120% 140% at 100% 0%,rgba(47,107,255,.32),transparent 55%),var(--surface);border-color:var(--blue-line)}
.ring{position:absolute;right:14px;top:14px;width:46px;height:46px}
.kpi.has-ring .k-top,.kpi.has-ring .k-s{padding-right:52px}
.dep .ring{top:14px}
.cat-leg{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.cl-row{display:grid;grid-template-columns:10px minmax(0,1fr) auto 40px;gap:10px;align-items:center;padding:6px 8px;margin:0 -8px;border-radius:9px;border:0;background:none;color:inherit;text-align:left;font-size:13px;width:calc(100% + 16px)}
button.cl-row:hover{background:var(--surface-2)}
.cl-row i{width:10px;height:10px;border-radius:3px}
.cl-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl-row b{font-family:var(--f-mono);font-weight:600;font-size:12.5px}
.cl-row em{font-style:normal;color:var(--muted);font-size:12px;text-align:right}
.ring circle{fill:none;stroke-width:5}
.ring .bg{stroke:var(--surface-3)}
.ring .fg{stroke:var(--blue);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .8s ease}
.ring.warn .fg{stroke:var(--warn)}.ring.over .fg{stroke:var(--bad)}
.ring text{fill:var(--ink);font:700 11px var(--f-body);text-anchor:middle;dominant-baseline:central}

/* gráficos */
.chart{position:relative;width:100%;min-height:240px;flex:1}
.chart.h-300{min-height:300px}.chart.h-200{min-height:200px}.chart.h-260{min-height:260px}
.chart-fallback{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center;padding:20px}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-weight:500}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend i.line{height:2px;width:14px;border-radius:2px}
.legend i.dash{height:0;width:14px;border-top:2px dashed currentColor;background:none!important}

/* barras horizontais (ranking e orçamento) */
.hbars{display:flex;flex-direction:column;gap:4px}
.hbar{display:block;width:calc(100% + 16px);margin:0 -8px;padding:7px 8px;border:0;background:none;border-radius:10px;text-align:left;color:inherit}
button.hbar:hover{background:var(--surface-2)}
button.hbar:hover .hb-k{color:var(--blue-2)}
.hb-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13.5px}
.hb-k{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:8px}
.hb-k i{width:8px;height:8px;border-radius:2px;flex:none}
.hb-v{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.hb-track{position:relative;height:7px;border-radius:99px;background:var(--surface-3);margin-top:7px}
.hb-track i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--blue-deep),var(--blue));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.hb-track.warn i{background:var(--warn)}
.hb-track.over i{background:var(--bad)}
.hb-track .goal{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.7;border-radius:2px}
.hb-sub{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--muted);margin-top:5px;font-weight:500}
.empty-mini{font-size:13px;color:var(--muted);padding:6px 0}

/* insights */
.insights{display:flex;flex-direction:column;gap:8px}
.ins{display:flex;gap:11px;align-items:flex-start;padding:10px 11px;border-radius:12px;background:var(--bg-2);border:1px solid var(--line);text-align:left;color:inherit;width:100%}
button.ins:hover{border-color:var(--blue-line)}
.ins .ii{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--blue-soft);color:var(--blue-2)}
.ins .ii svg{width:15px;height:15px}
.ins.bad .ii{background:var(--bad-soft);color:var(--bad)}
.ins.warn .ii{background:var(--warn-soft);color:var(--warn)}
.ins.ok .ii{background:var(--ok-soft);color:var(--ok)}
.ins b{display:block;font-size:13.5px;font-weight:600;line-height:1.35}
.ins small{display:block;font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}

/* tabela de dados */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
.tile .table-wrap{border:0;border-radius:0;background:none;box-shadow:none;margin:0 -18px -16px;border-top:1px solid var(--line)}
table.dt{width:100%;border-collapse:collapse;font-size:13.5px;min-width:720px}
.dt th{position:sticky;top:0;background:var(--surface-2);color:var(--muted);font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
.dt th button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.dt th button:hover{color:var(--ink)}
.dt th button svg{width:12px;height:12px;opacity:.5}
.dt th[aria-sort] button{color:var(--ink)}
.dt th[aria-sort] button svg{opacity:1;color:var(--blue-2)}
.dt td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.dt tbody tr{cursor:pointer;transition:background .1s}
.dt tbody tr:hover{background:var(--surface-2)}
.dt tbody tr:last-child td{border-bottom:0}
.dt tbody tr.flash{animation:flash 2.4s ease}
@keyframes flash{0%,35%{background:var(--blue-soft);box-shadow:inset 3px 0 0 var(--blue)}100%{background:transparent}}
.dt .r{text-align:right}
.dt .strong{font-weight:600;color:var(--ink)}
.dt .forn{display:flex;align-items:center;gap:10px;min-width:0;max-width:250px}
.dt td.muted,.dt td.ell{max-width:170px;overflow:hidden;text-overflow:ellipsis}
.dt .forn .fa{width:30px;height:30px;border-radius:9px;background:var(--surface-3);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--ink-2);flex:none;border:1px solid var(--line-2)}
.dt .forn div{min-width:0}
.dt .forn b{display:flex;align-items:center;gap:6px;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.dt .forn small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.dt .val{font-family:var(--f-mono);font-weight:600;font-size:13.5px}
.dt tfoot td{background:var(--surface-2);font-weight:700;padding:12px 14px;border-top:1px solid var(--line-2)}
.clip{width:13px;height:13px;color:var(--muted)}
.share{display:flex;align-items:center;gap:8px;min-width:110px}
.share i{display:block;height:6px;border-radius:99px;background:var(--blue)}
.share span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* lista de notas em cartões (celular) */
.cards{display:none;flex-direction:column;gap:8px}
.ncard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-align:left;color:inherit;width:100%}
.ncard b{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.ncard .v{font-family:var(--f-mono);font-weight:600;text-align:right;white-space:nowrap}
.ncard small{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ncard .tags{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center}
.ncard.flash{animation:flash 2.4s ease}

.sumbar{display:flex;gap:10px 22px;flex-wrap:wrap;align-items:center;margin-bottom:12px;font-size:13.5px;color:var(--muted)}
.sumbar b{color:var(--ink);font-weight:600;font-family:var(--f-mono)}
.empty{padding:46px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .ill{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue-2);border:1px solid var(--blue-line)}
.empty .ill svg{width:30px;height:30px}
.empty h3{font-size:18px}
.empty p{color:var(--muted);max-width:46ch;font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);padding:6px 12px;border-radius:999px;font-weight:600;font-size:12.5px;white-space:nowrap}
.chip:hover{border-color:var(--blue-line);color:var(--blue-2)}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}

/* listas de vencimento */
.due{display:flex;flex-direction:column}
.due-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:inherit;width:100%}
.due-row:first-child{border-top:0;padding-top:0}
.due-row:hover b{color:var(--blue-2)}
.due-d{width:42px;height:42px;border-radius:11px;background:var(--bg-2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;flex:none}
.due-d b{font-family:var(--f-display);font-size:15px}
.due-d span{font-size:9.5px;font-weight:700;text-transform:uppercase;color:var(--muted);margin-top:2px}
.due-d.bad{border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:var(--bad-soft)}
.due-d.bad b,.due-d.bad span{color:var(--bad)}
.due-row .tx{flex:1;min-width:0}
.due-row .tx b{display:block;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.due-row .tx small{font-size:12px;font-weight:600}
.due-row .v{font-weight:600;font-family:var(--f-mono);white-space:nowrap;font-size:13.5px}
.due-row .act{flex:none}
.group-t{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.group-t:first-child{margin-top:0}
.group-t em{font-style:normal;margin-left:auto;font-family:var(--f-mono);letter-spacing:0;color:var(--ink-2)}

/* calendário */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:11px;color:var(--muted);text-align:center;font-weight:600;padding-bottom:4px}
.cal .d{min-height:62px;border-radius:9px;border:1px solid var(--line);background:var(--bg-2);padding:6px;display:flex;flex-direction:column;gap:2px;font-size:11px;text-align:left;color:inherit}
.cal .d.out{opacity:.35}
.cal .d.today{border-color:var(--blue)}
.cal .d b{font-weight:600;font-size:12px}
.cal .d .amt{margin-top:auto;font-family:var(--f-mono);font-size:10.5px;font-weight:600;color:var(--warn);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal .d.has-bad .amt{color:var(--bad)}
.cal .d.has-ok .amt{color:var(--ok)}
.cal button.d:hover{border-color:var(--blue-line)}

/* calendário de despesas */
.hcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.hcal .wd{font-size:10.5px;font-weight:600;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.06em;padding-bottom:2px}
.hc{position:relative;aspect-ratio:1/.86;min-width:0;border-radius:10px;border:1px solid var(--line);background:var(--bg-2);padding:5px 6px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;color:var(--ink-2);font-size:11px;transition:transform .12s,border-color .12s,box-shadow .12s}
.hc b{font-size:11.5px;font-weight:600;line-height:1}
.hc .hn{position:absolute;top:5px;right:6px;font-style:normal;font-size:9.5px;font-weight:700;color:var(--muted);font-family:var(--f-mono)}
.hc .hv{font-family:var(--f-mono);font-size:10.5px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hc.we{background:transparent}
.hc.out{visibility:hidden}
.hc.fut{opacity:.32}
.hc.today{border-color:var(--blue-2);box-shadow:inset 0 0 0 1px var(--blue-2)}
.hc.l1{background:rgba(47,107,255,.10);border-color:rgba(47,107,255,.18)}
.hc.l2{background:rgba(47,107,255,.20);border-color:rgba(47,107,255,.28)}
.hc.l3{background:rgba(47,107,255,.36);border-color:rgba(47,107,255,.45)}
.hc.l4{background:rgba(47,107,255,.58);border-color:rgba(47,107,255,.7);color:#fff}
.hc.l5{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 8px 20px -10px var(--blue)}
.hc.l4 .hv,.hc.l5 .hv,.hc.l4 .hn,.hc.l5 .hn{color:#fff}
button.hc:hover{transform:translateY(-2px);border-color:var(--blue-2)}
.hleg{display:flex;align-items:center;justify-content:flex-end;gap:4px;margin-top:8px;font-size:11px;color:var(--muted)}
.hleg i{width:12px;height:12px;border-radius:3px;border:1px solid var(--line);background:var(--bg-2)}
.hleg i.l1{background:rgba(47,107,255,.10)}.hleg i.l2{background:rgba(47,107,255,.20)}.hleg i.l3{background:rgba(47,107,255,.36)}.hleg i.l4{background:rgba(47,107,255,.58)}.hleg i.l5{background:var(--blue)}
.hleg span{margin:0 4px}
.hstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.hstats div{background:var(--bg-2);border:1px solid var(--line);border-radius:11px;padding:9px 10px;min-width:0}
.hstats small{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.hstats b{display:block;font-family:var(--f-display);font-size:15px;font-weight:600;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hstats em{display:block;font-style:normal;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wkbars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;height:74px;margin-top:12px;align-items:end}
.wkb{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.wkb span{width:100%;max-width:26px;border-radius:5px 5px 2px 2px;background:var(--surface-3);transition:height .5s}
.wkb.on span{background:var(--blue)}
.wkb em{font-style:normal;font-size:10.5px;color:var(--muted);font-weight:600}
.wkb.on em{color:var(--ink)}
/* departamentos */
.dep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.dep{position:relative;display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;color:inherit;min-width:0;transition:border-color .15s,transform .15s;box-shadow:var(--shadow)}
.dep:hover{border-color:var(--blue-line);transform:translateY(-2px)}
.dep-top{display:flex;align-items:center;gap:10px;min-width:0;padding-right:54px}
.dep-top .di{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--blue-soft);color:var(--blue-2)}
.dep-top .di svg{width:18px;height:18px}
.dep-top b{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dep-v{font-family:var(--f-display);font-size:24px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.dep-meta{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);font-weight:500}
.dep .spark{height:38px;margin:0 -4px}

/* assistente */
.chat{display:flex;flex-direction:column;gap:14px;min-height:420px}
.msgs{display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:12px;align-items:flex-start;max-width:860px}
.msg .who{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--surface-3);color:var(--ink-2)}
.msg .who svg{width:16px;height:16px}
.msg.ai .who{background:var(--blue);color:#fff}
.msg .bubble{padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:14px;line-height:1.6;min-width:0;overflow-wrap:anywhere}
.msg.me{margin-left:auto;flex-direction:row-reverse}
.msg.me .bubble{background:var(--blue-soft);border-color:var(--blue-line)}
.bubble p+p,.bubble ul+p,.bubble p+ul{margin-top:8px}
.bubble ul{margin:6px 0 0;padding-left:18px}
.bubble strong{color:var(--ink)}
.suggest{display:flex;gap:8px;flex-wrap:wrap}
.composer{display:flex;gap:8px;align-items:flex-end;padding:8px;border:1px solid var(--line-2);border-radius:16px;background:var(--surface);position:sticky;bottom:12px}
.composer textarea{flex:1;border:0;background:transparent;resize:none;min-height:42px;max-height:160px;padding:10px;outline:none;color:var(--ink)}
.typing{display:inline-flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}

/* =================== A.N.A.B (assistente holográfico) =================== */
.holo{--hc:#5CE1FF;--hc-2:#2F6BFF;--hc-dim:rgba(92,225,255,.55);--hl:rgba(92,225,255,.22);--hg:rgba(92,225,255,.07);--f-holo:'Michroma','Rajdhani','Geist',system-ui,sans-serif;--f-holo-2:'Rajdhani','Geist',system-ui,sans-serif;position:relative;border-radius:22px;padding:16px 20px 20px;overflow:hidden;color:#D6F4FF;font-family:var(--f-holo-2);font-size:15.5px;background:radial-gradient(70% 55% at 50% 22%,rgba(47,107,255,.26),transparent 70%),radial-gradient(40% 35% at 50% 26%,rgba(92,225,255,.12),transparent 70%),linear-gradient(180deg,#02060E,#010309);border:1px solid var(--hl);box-shadow:inset 0 0 80px rgba(92,225,255,.05),0 50px 100px -50px rgba(47,107,255,.6)}
.holo::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(92,225,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(92,225,255,.05) 1px,transparent 1px);background-size:32px 32px;-webkit-mask-image:radial-gradient(75% 60% at 50% 30%,#000 30%,transparent 100%);mask-image:radial-gradient(75% 60% at 50% 30%,#000 30%,transparent 100%)}
.holo::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px);mix-blend-mode:screen}
.holo>*{position:relative;z-index:1}
.holo b,.holo strong{color:#fff}
/* barra superior */
.h-top{display:flex;align-items:center;gap:12px 18px;flex-wrap:wrap;padding-bottom:14px;margin-bottom:6px;border-bottom:1px solid var(--hl)}
.h-brand{display:flex;align-items:baseline;gap:12px;min-width:0;flex-wrap:wrap}
.h-brand b{font-family:var(--f-holo);font-size:20px;letter-spacing:.32em;color:#fff;text-shadow:0 0 18px rgba(92,225,255,.7);font-weight:400}
.h-brand span{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--hc-dim);font-weight:500}
.h-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.h-pill{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-holo);font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;padding:7px 11px;border:1px solid var(--hl);background:var(--hg);color:var(--hc);clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px)}
.h-pill i{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor;animation:hblink 1.8s infinite}
.h-pill.off{color:#FFB347;border-color:rgba(255,179,71,.35);background:rgba(255,179,71,.06)}
.h-pill.busy{color:#fff;border-color:var(--hc)}
.h-clock{font-family:var(--f-holo);font-size:12px;letter-spacing:.2em;color:#fff;font-variant-numeric:tabular-nums}
.h-btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--hl);background:transparent;color:var(--hc);padding:7px 11px;font-family:var(--f-holo-2);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px)}
.h-btn svg{width:16px;height:16px}
.h-btn[aria-pressed="true"]{background:rgba(92,225,255,.14);color:#fff;border-color:var(--hc)}
.h-btn:hover{border-color:var(--hc);color:#fff}
/* palco: módulos + emblema */
.h-stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.55fr) minmax(0,1fr);align-items:stretch;gap:0;margin:8px 0 14px}
.h-col{display:flex;flex-direction:column;justify-content:space-between;gap:10px;padding-block:2%}
.h-center{position:relative;min-width:0}
.h-center svg{display:block;width:100%;height:auto;overflow:visible}
.hcard{position:relative;padding:11px 14px 11px 15px;background:linear-gradient(135deg,rgba(92,225,255,.10),rgba(47,107,255,.04) 60%,rgba(92,225,255,.06));border:1px solid var(--hl);clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);text-align:left;color:inherit;min-width:0;transition:border-color .2s,background .2s}
.hcard::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:2px;background:var(--hc);box-shadow:0 0 10px var(--hc)}
button.hcard:hover{border-color:var(--hc);background:linear-gradient(135deg,rgba(92,225,255,.16),rgba(47,107,255,.06))}
.hcard .hl{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--hc-dim)}
.hcard .hl svg{width:14px;height:14px;color:var(--hc)}
.hcard .hv{display:block;font-family:var(--f-holo);font-size:clamp(15px,1.45vw,19px);letter-spacing:.02em;color:#fff;margin-top:5px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hcard .hv .pc{font-family:var(--f-holo-2);font-weight:700;font-size:1.2em;margin-left:1px}
.hcard .hs{display:block;font-size:13.5px;color:rgba(214,244,255,.68);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hcard .hb{height:3px;background:rgba(92,225,255,.14);margin-top:7px;position:relative}
.hcard .hb i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--hc-2),var(--hc));box-shadow:0 0 8px var(--hc)}
.hcard.warn::before,.hcard.warn .hb i{background:#FFB347;box-shadow:0 0 10px #FFB347}
.hcard.bad::before,.hcard.bad .hb i{background:#FF5C7A;box-shadow:0 0 10px #FF5C7A}
.hcard.bad .hv{color:#FFC2CE}
.hcard.warn .hv{color:#FFE2B8}
/* emblema */
.em .tr path{fill:none;stroke:rgba(92,225,255,.38);stroke-width:1.2}
.em .tr .pulse{stroke:#BDF3FF;stroke-width:2;stroke-dasharray:16 420;stroke-linecap:round;animation:hpulse 3.2s linear infinite;filter:drop-shadow(0 0 4px #5CE1FF)}
.em .tr circle{fill:#02060E;stroke:#5CE1FF;stroke-width:1.2}
.em .tr rect{fill:#5CE1FF}
.em .g{transform-box:view-box;transform-origin:280px 180px}
.em .rt{animation:hspin 70s linear infinite}
.em .rt path{stroke:rgba(92,225,255,.55);stroke-width:1.2;fill:none}
.em .rd{animation:hspin 45s linear infinite reverse}
.em .rd circle{fill:none;stroke:rgba(92,225,255,.5);stroke-width:2;stroke-dasharray:1.5 7}
.em .ra{animation:hspin 20s linear infinite}
.em .ra path{fill:none;stroke:#5CE1FF;stroke-width:6;stroke-linecap:butt;opacity:.85;filter:drop-shadow(0 0 6px rgba(92,225,255,.8))}
.em .rb{animation:hspin 10s linear infinite reverse}
.em .rb circle{fill:none;stroke:rgba(92,225,255,.35);stroke-width:1}
.em .rb path{fill:none;stroke:#E6FBFF;stroke-width:2.2;stroke-linecap:round}
.em .orbit{animation:hspin 14s linear infinite}
.em .orbit circle{fill:#E6FBFF;filter:drop-shadow(0 0 6px #5CE1FF)}
.em .sweep{opacity:0;animation:hspin 1.6s linear infinite;transition:opacity .3s}
.em .disc{fill:url(#auraDisc);stroke:rgba(92,225,255,.6);stroke-width:1.2}
.em .core{fill:url(#auraCore);transform-box:view-box;transform-origin:280px 180px;animation:hbreath 4s ease-in-out infinite}
.em .ttl{font-family:var(--f-holo);font-size:21px;letter-spacing:5px;fill:#fff;text-anchor:middle;filter:drop-shadow(0 0 8px rgba(92,225,255,.9))}
.em .sub{font-family:var(--f-holo-2);font-size:11px;font-weight:600;letter-spacing:3.5px;fill:#9FEBFF;text-anchor:middle;text-transform:uppercase}
.em .wave rect{fill:#5CE1FF;transform-box:fill-box;transform-origin:center;transform:scaleY(.2);opacity:.8}
.em.thinking .rt{animation-duration:14s}.em.thinking .rd{animation-duration:8s}.em.thinking .ra{animation-duration:3s}.em.thinking .rb{animation-duration:2s}
.em.thinking .sweep{opacity:1}
.em.thinking .tr .pulse{animation-duration:1.1s}
.em.speaking .core{animation:hbreath .6s ease-in-out infinite}
.em.speaking .wave rect{animation:hwave .7s ease-in-out infinite}
.em.offline .ra path{stroke:#FFB347;filter:drop-shadow(0 0 6px rgba(255,179,71,.6))}
.em.offline .sub{fill:#FFCF8A}
@keyframes hspin{to{transform:rotate(360deg)}}
@keyframes hpulse{from{stroke-dashoffset:436}to{stroke-dashoffset:0}}
@keyframes hbreath{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.06);opacity:1}}
@keyframes hwave{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
@keyframes hblink{50%{opacity:.35}}
/* ações rápidas */
.h-acts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:14px}
.hact{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:11px 12px;border:1px solid var(--hl);background:rgba(92,225,255,.04);color:inherit;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);transition:background .2s,border-color .2s;min-width:0}
.hact:hover:not(:disabled){background:rgba(92,225,255,.12);border-color:var(--hc)}
.hact:disabled{opacity:.45;cursor:default}
.hact .ai2{width:32px;height:32px;display:grid;place-items:center;flex:none;border:1px solid var(--hl);color:var(--hc);background:rgba(92,225,255,.08);clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.hact .ai2 svg{width:16px;height:16px}
.hact b{display:block;font-size:15px;font-weight:700;letter-spacing:.04em;color:#fff;line-height:1.15}
.hact small{display:block;font-size:12.5px;color:rgba(214,244,255,.6);line-height:1.3;margin-top:2px}
/* conversa */
.h-conv{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;border:1px solid var(--hl);background:linear-gradient(180deg,rgba(92,225,255,.05),rgba(2,6,14,.4));padding:14px;clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.h-conv-h{display:flex;align-items:center;gap:10px;font-family:var(--f-holo);font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--hc)}
.h-conv-h::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--hl),transparent)}
.hlog{display:flex;flex-direction:column;gap:12px;max-height:440px;overflow:auto;padding-right:4px;scrollbar-width:thin;scrollbar-color:rgba(92,225,255,.3) transparent}
.log-e{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:start}
.log-e .who{grid-row:span 2;width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--hl);color:var(--hc);font-family:var(--f-holo);font-size:10px;clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.log-e .who svg{width:15px;height:15px}
.log-e.me .who{color:#fff;background:rgba(47,107,255,.35);border-color:rgba(47,107,255,.6)}
.log-h{display:flex;align-items:baseline;gap:10px;font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--hc)}
.log-e.me .log-h{color:#9DB8FF}
.log-h time{font-weight:500;letter-spacing:.08em;color:rgba(214,244,255,.4);font-variant-numeric:tabular-nums}
.log-b{font-size:16px;line-height:1.55;color:#E3F7FF;font-weight:500;overflow-wrap:anywhere}
.log-b p+p,.log-b ul+p,.log-b p+ul{margin-top:7px}
.log-b ul{margin:4px 0 0;padding-left:18px}
.log-b li::marker{color:var(--hc)}
.log-e.bot .log-b{border-left:2px solid var(--hc);padding-left:12px;box-shadow:-8px 0 16px -14px var(--hc)}
.log-b .caret{display:inline-block;width:8px;height:15px;background:var(--hc);vertical-align:-2px;margin-left:2px;animation:hblink .8s infinite}
.h-sugg{display:flex;gap:8px;flex-wrap:wrap}
.h-chip{border:1px solid var(--hl);background:transparent;color:#BFEFFF;font-family:var(--f-holo-2);font-weight:600;font-size:14px;padding:6px 12px;letter-spacing:.03em;clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px)}
.h-chip:hover{border-color:var(--hc);color:#fff;background:rgba(92,225,255,.08)}
.h-input{display:flex;align-items:flex-end;gap:10px;border:1px solid var(--hc-dim);background:rgba(1,4,10,.75);padding:6px 6px 6px 14px;box-shadow:0 0 0 1px rgba(92,225,255,.08),0 0 30px -12px var(--hc);clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.h-input .prompt{font-family:var(--f-holo);color:var(--hc);font-size:13px;line-height:42px}
.h-input textarea{flex:1;border:0;background:transparent;resize:none;min-height:42px;max-height:140px;padding:10px 0;outline:none;color:#fff;font-family:var(--f-holo-2);font-size:16.5px;font-weight:500}
.h-input textarea::placeholder{color:rgba(214,244,255,.4)}
.h-send{width:42px;height:42px;display:grid;place-items:center;border:0;background:linear-gradient(135deg,#5CE1FF,#2F6BFF);color:#011;flex:none;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.h-send svg{width:18px;height:18px}
.h-send:disabled{opacity:.4}
.h-foot{font-size:12.5px;letter-spacing:.06em;color:rgba(214,244,255,.42);text-align:center}
/* inicialização */
.h-boot{position:absolute!important;inset:0;z-index:5!important;display:grid;place-items:center;background:#010309;pointer-events:none;animation:hboot 1.9s ease forwards}
.h-boot div{text-align:center;font-family:var(--f-holo);letter-spacing:.3em;font-size:12px;color:var(--hc)}
.h-boot b{display:block;font-size:26px;letter-spacing:.4em;color:#fff;margin-bottom:12px;text-shadow:0 0 20px var(--hc);font-weight:400}
.h-boot i{display:block;height:2px;width:220px;margin:14px auto 0;background:linear-gradient(90deg,var(--hc),transparent);transform-origin:left;animation:hload 1.3s ease forwards}
@keyframes hboot{0%,70%{opacity:1}100%{opacity:0;visibility:hidden}}
@keyframes hload{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (max-width:1180px){
  .h-stage{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .h-center{grid-column:1/-1;order:-1;max-width:560px;width:100%;margin:0 auto}
  .em .tr{display:none}
  .h-col{padding:0;justify-content:flex-start}
  .h-acts{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:760px){
  .holo{padding:12px;border-radius:16px}
  .h-brand span{display:none}
  .h-clock{display:none}
  .h-stage{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .h-col{display:contents}
  .h-acts{display:flex;overflow-x:auto;scrollbar-width:none;margin-inline:-12px;padding-inline:12px}

  .hcard .hv{font-size:15px}
}
@media (prefers-reduced-motion:reduce){.em *,.h-boot,.h-boot i{animation:none!important}.h-boot{display:none}}
/* =================== PROPRIETÁRIO =================== */
.own{display:grid;grid-template-columns:232px minmax(0,1fr);gap:20px;align-items:start}
.own-nav{position:sticky;top:80px;display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.own-nav button{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:9px 11px;border-radius:10px;font-weight:500;font-size:14px;color:var(--ink-2);text-align:left;white-space:nowrap}
.own-nav button svg{width:17px;height:17px;color:var(--muted)}
.own-nav button:hover{background:var(--surface-2);color:var(--ink)}
.own-nav button[aria-current="true"]{background:var(--blue-soft);color:var(--ink)}
.own-nav button[aria-current="true"] svg{color:var(--blue-2)}
.own-sec{display:flex;flex-direction:column;gap:14px;min-width:0}
.sec-head h2{font-size:21px}
.sec-head p{color:var(--muted);font-size:14px;margin-top:4px;max-width:66ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0;box-shadow:var(--shadow)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-head h3{font-family:var(--f-body);font-size:14.5px;font-weight:600;letter-spacing:0}
.card-head .sub{font-size:12.5px;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.form-grid .full{grid-column:1/-1}
.card-foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.photo-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:18px}
.photo-row .avatar{--s:84px;box-shadow:0 0 0 4px var(--surface),0 0 0 5px var(--line-2)}
.photo-row .tx{display:flex;flex-direction:column;gap:8px;min-width:0}
.photo-row .tx b{font-size:16px;font-weight:600}
.photo-row .tx small{color:var(--muted);font-size:12.5px}
.photo-row .acts{display:flex;gap:8px;flex-wrap:wrap}
.member{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}
.member:first-child{border-top:0;padding-top:0}
.member .who b{display:block;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.member .who small{display:block;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.member .acts{display:flex;gap:6px}
.row-flex{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.row-flex .grow{flex:1;min-width:200px}
.meter{height:7px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--blue)}
.meter.warn i{background:var(--warn)}.meter.over i{background:var(--bad)}
.roles-help{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.role-card{border:1px solid var(--line);border-radius:13px;padding:12px 14px;background:var(--bg-2)}
.role-card b{display:block;font-size:13.5px;margin-bottom:4px;font-weight:600}
.role-card p{font-size:12.5px;color:var(--muted);line-height:1.4}
.pw-box{display:flex;align-items:center;gap:10px;background:var(--blue-soft);border:1px solid var(--blue-line);border-radius:12px;padding:10px 12px;flex-wrap:wrap}
.pw-box code{font-family:var(--f-mono);font-size:15px;font-weight:600;color:var(--blue-2);letter-spacing:.04em;flex:1;min-width:0;overflow-wrap:anywhere}
.list-editor{display:flex;flex-direction:column;gap:8px}
.le-row{display:grid;grid-template-columns:minmax(0,1fr) 170px auto;gap:8px;align-items:center}
.le-row.nb{grid-template-columns:minmax(0,1fr) auto}
.le-row .in{min-height:38px;font-size:14px;padding-block:7px}
.le-row.arch .in{opacity:.55}
.le-add{display:flex;gap:8px;margin-top:4px}
.le-add .in{min-height:38px;font-size:14px}
.le-add .btn{align-self:stretch;height:auto}
.theme-pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.theme-pick button{border:1px solid var(--line-2);background:var(--bg-2);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;font-weight:600;font-size:13.5px;color:var(--ink-2)}
.theme-pick button[aria-pressed="true"]{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue);color:var(--ink)}
.theme-pick .sw{height:56px;border-radius:9px;display:grid;grid-template-columns:26% 1fr;overflow:hidden;border:1px solid var(--line-2)}
.theme-pick .sw i:first-child{background:#000}
.theme-pick .sw i:last-child{background:#0E1015;position:relative}
.theme-pick .sw i:last-child::after{content:"";position:absolute;left:12%;right:30%;top:40%;height:8px;border-radius:4px;background:#2F6BFF}
.theme-pick .sw.l i:last-child{background:#F3F5F9}
.theme-pick .sw.a i:last-child{background:linear-gradient(90deg,#0E1015 50%,#F3F5F9 50%)}
.danger-zone{border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.trash-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.trash-row:first-child{border-top:0;padding-top:0}
.trash-row b{display:block;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trash-row small{display:block;font-size:12.5px;color:var(--muted)}
.trash-row .acts{display:flex;gap:6px}

/* =================== MODAIS / POPOVERS =================== */
.overlay{position:fixed;inset:0;z-index:70;background:var(--overlay);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .16s ease}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--surface);border:1px solid var(--line-2);border-radius:20px;width:min(1000px,100%);max-height:calc(100% - 8px);display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow-lg);animation:rise .2s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(12px);opacity:.5}}
.sheet.narrow{width:min(560px,100%)}
.sheet.cmd{width:min(640px,100%);align-self:flex-start;margin-top:8vh}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line)}
.sheet-head h3 svg{width:20px;height:20px;color:var(--blue-2)}
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}.kpis.k2{grid-template-columns:repeat(2,minmax(0,1fr))}
.sheet-head h3{font-size:18px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:10px}
.sheet-body{padding:18px;overflow:auto;min-height:0;overscroll-behavior:contain}
.sheet-foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;padding:13px 18px calc(13px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg-2)}
.sheet-foot .spacer{flex:1}
.form-layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:22px}
.drop{position:relative;border:1.5px dashed var(--line-2);border-radius:16px;background:var(--bg-2);min-height:300px;display:flex;flex-direction:column;overflow:hidden;transition:border-color .15s,background .15s}
.drop.drag{border-color:var(--blue);background:var(--blue-soft)}
.drop-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center}
.drop-empty .ic{width:60px;height:60px;border-radius:18px;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:var(--glow)}
.drop-empty .ic svg{width:28px;height:28px}
.drop-empty b{font-size:15.5px;font-weight:600}
.drop-empty span{font-size:13px;color:var(--muted);max-width:30ch}
.drop-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.drop-preview{position:relative;flex:1;display:flex;flex-direction:column}
.pv-box{position:relative;flex:1;display:flex;align-items:center;justify-content:center;background:var(--surface-3);min-height:260px;max-height:460px;overflow:hidden}
.pv-box img,.pv-box canvas{max-width:100%;max-height:460px;object-fit:contain;display:block}
.pv-ph{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted);font-size:13.5px;padding:30px;text-align:center}
.pv-ph svg{width:40px;height:40px;color:var(--blue-2)}
.pv-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);background:var(--surface)}
.pv-bar span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scanning .pv-box::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--blue);box-shadow:0 0 20px 6px rgba(47,107,255,.7);animation:scan 1.6s ease-in-out infinite alternate}
.scanning .pv-box::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(47,107,255,.18),transparent 45%);pointer-events:none;z-index:1}
@keyframes scan{from{top:0}to{top:calc(100% - 2px)}}
.ai{margin-top:12px;border-radius:13px;padding:12px 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line-2);background:var(--bg-2);line-height:1.45}
.ai .dot{flex:none;width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--muted)}
.ai.reading .dot{background:var(--blue);animation:blink 1s infinite}
.ai.done{border-color:var(--blue-line);background:var(--blue-soft)}
.ai.done .dot{background:var(--blue)}
.ai.warn{border-color:color-mix(in srgb,var(--warn) 40%,transparent);background:var(--warn-soft)}
.ai.warn .dot{background:var(--warn)}
.ai .grow{flex:1;min-width:0}
@keyframes blink{50%{opacity:.25}}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;align-content:start}
.fields .full{grid-column:1/-1}
.field.by-ai .in,.field.by-ai .money{border-color:var(--blue-line);background:color-mix(in srgb,var(--blue-soft) 60%,var(--bg-2))}
.field .ai-badge{display:none}
.field.by-ai .ai-badge{display:inline-flex}
.warnbox,.errbox,.infobox{font-size:13.5px;border-radius:11px;padding:11px 13px;font-weight:500}
.warnbox{background:var(--warn-soft);color:var(--warn)}
.errbox{background:var(--bad-soft);color:var(--bad)}
.infobox{background:var(--blue-soft);color:var(--blue-2);border:1px solid var(--blue-line)}
.detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
.detail .pv-box{border-radius:14px;border:1px solid var(--line);max-height:540px}
.pv-pages{display:flex;flex-direction:column;gap:8px;overflow:auto;max-height:540px;width:100%;align-items:center;padding:8px}
.d-val{font-family:var(--f-display);font-size:34px;font-weight:600;letter-spacing:-.035em;font-variant-numeric:tabular-nums;line-height:1.1}
.d-val small{font-size:.46em;color:var(--blue-2);vertical-align:.55em;margin-right:5px}
.dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px 18px;margin:16px 0 0;font-size:14px}
.dl dt{color:var(--muted)}
.dl dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.hist{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.hist h4{font-family:var(--f-body);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.hist ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:7px}
.hist li{font-size:13px;color:var(--ink-2);display:flex;gap:10px}
.hist li time{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:12px}
.cmd-in{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.cmd-in svg{width:19px;height:19px;color:var(--muted)}
.cmd-in input{flex:1;border:0;background:transparent;outline:none;font-size:16px;color:var(--ink);min-width:0}
.cmd-list{max-height:min(60vh,460px);overflow:auto;padding:8px}
.cmd-g{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:10px 10px 6px}
.cmd-item{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;padding:10px;border-radius:10px;text-align:left;color:var(--ink)}
.cmd-item svg{width:17px;height:17px;color:var(--muted)}
.cmd-item small{margin-left:auto;color:var(--muted);font-size:12px;font-family:var(--f-mono)}
.cmd-item span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmd-item[aria-selected="true"],.cmd-item:hover{background:var(--blue-soft)}
.cmd-item[aria-selected="true"] svg{color:var(--blue-2)}
.pop{position:fixed;z-index:75;width:min(380px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--line-2);border-radius:16px;box-shadow:var(--shadow-lg);overflow:hidden;animation:rise .16s ease}
.pop-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:600}
.pop-body{max-height:420px;overflow:auto;padding:6px}
.pop-item{display:flex;gap:10px;align-items:flex-start;width:100%;padding:10px;border:0;background:none;border-radius:10px;text-align:left;color:inherit}
.pop-item:hover{background:var(--surface-2)}
.pop-item .ii{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--blue-soft);color:var(--blue-2)}
.pop-item .ii svg{width:15px;height:15px}
.pop-item.bad .ii{background:var(--bad-soft);color:var(--bad)}
.pop-item.warn .ii{background:var(--warn-soft);color:var(--warn)}
.pop-item b{display:block;font-size:13.5px;font-weight:600}
.pop-item small{display:block;font-size:12px;color:var(--muted)}
.menu-list{display:flex;flex-direction:column;gap:2px}
.menu-list button{display:flex;align-items:center;gap:12px;border:0;background:transparent;padding:12px;border-radius:12px;font-weight:500;font-size:15px;text-align:left;color:var(--ink)}
.menu-list button svg{width:19px;height:19px;color:var(--blue-2)}
.menu-list button:hover{background:var(--surface-2)}
.menu-list .sep{height:1px;background:var(--line);margin:6px 4px}

/* toast */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,460px)}
.toast{pointer-events:auto;background:var(--ink);color:var(--bg);font-weight:600;font-size:13.5px;border-radius:12px;padding:11px 12px 11px 15px;box-shadow:var(--shadow-lg);display:flex;gap:12px;align-items:center;animation:tin .22s ease;max-width:100%}
.toast.err{background:var(--bad);color:#fff}
.toast .t-act{margin-left:auto;background:none;border:0;color:var(--blue);font-weight:700;padding:4px 6px;border-radius:7px;white-space:nowrap}
.toast.err .t-act{color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
.skel{border-radius:10px;background:linear-gradient(90deg,var(--surface-2),var(--surface-3),var(--surface-2));background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}

.bottom{display:none}

  .kpis,.kpis.k4,.kpis.k3{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

  .tile{padding:14px}
